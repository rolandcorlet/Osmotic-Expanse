hearth", "reclaimers-ash"]}, {"k": "p", "html": "Her name was <span class=\"lx\" data-t=\"yarrow\">Yarrow<\/span>. <span class=\"lx\" data-t=\"yarrow\">Yarrow-who-went-ahead<\/span>.", "terms": ["yarrow"]}, {"k": "p", "html": "I will not give you all of it. There is a great deal in a life. But I will give you the three things that matter to this tale, because they are the hooks the rest of it hangs on, and because <span class=\"lx\" data-t=\"yarrow\">Yarrow<\/span> wanted them told.", "terms": ["yarrow"]}, {"k": "p", "html": "<i>The first:<\/i> she was not his mother. His mother had stayed behind in the struck colony in <span class=\"lx\" data-t=\"lysosomal-wastes\">the Wastes<\/span>, because she was too sick to cross, and had <span class=\"lx\" data-t=\"division\">divided<\/span> one last time, and put the <span class=\"lx\" data-t=\"bud\">bud<\/span> in <span class=\"lx\" data-t=\"yarrow\">Yarrow<\/span>&#x27;s hands, and said <i>take this somewhere it can be written down<\/i>. <span class=\"lx\" data-t=\"yarrow\">Yarrow<\/span> had sworn the <span class=\"lx\" data-t=\"oath\">Oath<\/span> on the spot — <i>to see the child <span class=\"lx\" data-t=\"register\">listed<\/span><\/i> — and it was the one <span class=\"lx\" data-t=\"oath-box\">Oath box<\/span> she had never spent, because she had never known whether the forged line counted. She had come back to <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> twenty <span class=\"lx\" data-t=\"drift-season\">Drift Seasons<\/span> later, sick with a sequence that was winning its argument with her, to find out. She had died three <span class=\"lx\" data-t=\"beat\">Beats<\/span> short of the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>.", "terms": ["lysosomal-wastes", "division", "bud", "yarrow", "oath", "register", "oath-box", "sump-nine", "drift-season", "beat", "hearth"]}, {"k": "p", "html": "<i>The second:<\/i> she had come back by the <span class=\"lx\" data-t=\"fork-of-the-second-flow\">Fork of the Second Flow<\/span>, and on the way down, two hab-lengths above <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>&#x27;s <span class=\"lx\" data-t=\"somatic-gate\">somatic gate<\/span>, she had found a <b>channel<\/b>.", "terms": ["fork-of-the-second-flow", "sump-nine", "somatic-gate"]}, {"k": "p", "html": "You know what a channel is. An illegal pore. Membranes are meant to read everything that crosses them — that is the first <span class=\"lx\" data-t=\"sacred-code\">Precept<\/span> of the <span class=\"lx\" data-t=\"sacred-code\">Sacred Code<\/span>, <i>nothing crosses a colony&#x27;s membrane unread<\/i> — and channel-makers are the smugglers who open little holes so that goods can leak through without being read. <span class=\"lx\" data-t=\"yarrow\">Yarrow<\/span> was a <span class=\"lx\" data-t=\"pathogen-scout\">Pathogen Scout<\/span>; she could smell a pore the way a <span class=\"lx\" data-t=\"warden-circles\">Warden<\/span> smells a forged token. And this pore did not let goods <i>in<\/i>. It let water <i>out<\/i>. A thin, constant, patient bleed, from the cysts at the channel mouth — the cysts the <span class=\"lx\" data-t=\"hauler\">haulers<\/span> hauled — up through the old protein lattice under the north wall of the <span class=\"lx\" data-t=\"gel-moat\">gel moat<\/span>, the lattice whose supports had been so neatly cut, and into a sealed pipe that ran, she followed it, all the way up the inside of the north wall.", "terms": ["sacred-code", "yarrow", "pathogen-scout", "warden-circles", "hauler", "gel-moat"]}, {"k": "p", "html": "To <span class=\"lx\" data-t=\"dry\">the Dry<\/span> pocket on the highest ledge. <span class=\"lx\" data-t=\"corvane\">Corvane<\/span>&#x27;s pocket. And the pocket next to it, where a <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> factor called <span class=\"lx\" data-t=\"lune\">Lune<\/span> had taken a room.", "terms": ["dry", "corvane", "ribosome-hegemony", "lune"]}, {"k": "p", "html": "<i>The third thing<\/i> was the part of the <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> <span class=\"lx\" data-t=\"yarrow\">Yarrow<\/span> had recorded last, in the channel, three <span class=\"lx\" data-t=\"beat\">Beats<\/span> from death, when she knew she was not going to reach the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>. She had laid it into the <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> so carefully that every one of them in that room smelled it at once, as if she were standing among them.", "terms": ["memory-strand", "yarrow", "beat", "hearth"]}, {"k": "p", "html": "<i>Two of them in the pipe-room. The <span class=\"lx\" data-t=\"dry\">Dry<\/span> one and the <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> one. The <span class=\"lx\" data-t=\"dry\">Dry<\/span> one says: the <span class=\"lx\" data-t=\"tally\">tally<\/span> fails by <span class=\"lx\" data-t=\"swell\">the Swell<\/span>. The <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span> calls the loan. The colony defaults. The <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> buys the <span class=\"lx\" data-t=\"charter\">charter<\/span>. And I am <span class=\"lx\" data-t=\"steward\">Steward<\/span> under the <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span>&#x27;s <span class=\"lx\" data-t=\"charter\">charter<\/span>, and the water is mine to sell. The <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> one says: and if anyone smells the pipe? The <span class=\"lx\" data-t=\"dry\">Dry<\/span> one says: who? The <span class=\"lx\" data-t=\"swollen\">Swollen<\/span>? They&#x27;ll be too thirsty to smell anything.<\/i>", "terms": ["dry", "ribosome-hegemony", "tally", "swell", "brine-office", "charter", "steward", "swollen"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> went dark. It was spent. <span class=\"lx\" data-t=\"yarrow\">Yarrow<\/span> was gone from the world.", "terms": ["memory-strand", "yarrow"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"reclaimers-ash\">Ash<\/span> shelf was very quiet.", "terms": ["reclaimers-ash"]}, {"k": "p", "html": "&quot;That&#x27;s a line,&quot; said <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> at last. &quot;That&#x27;s not a rumour. That&#x27;s a <i>witnessed line<\/i>.&quot;", "terms": ["dunmore"]}, {"k": "p", "html": "&quot;It&#x27;s a dead woman&#x27;s memory,&quot; said <span class=\"lx\" data-t=\"quell\">Quell<\/span>. &quot;In a <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> that no longer exists. Witnessed by an <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span> <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>, an <span class=\"lx\" data-t=\"reader\">Ash Reader<\/span>, a <span class=\"lx\" data-t=\"hauler\">hauler<\/span> with a forged birth, a <span class=\"lx\" data-t=\"barophil\">Barophil<\/span>, and an apprentice who can&#x27;t lie.&quot; She smiled without any humour at all. &quot;It&#x27;s the best evidence I&#x27;ve ever heard, and <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> will have every one of us struck off before we can say it at a <span class=\"lx\" data-t=\"convocation\">Convocation<\/span>.&quot;", "terms": ["quell", "memory-strand", "unlisted", "registrar", "reader", "hauler", "barophil", "corvane", "convocation"]}, {"k": "p", "html": "&quot;Then we say it at a <span class=\"lx\" data-t=\"quorum\">Quorum<\/span>,&quot; said <span class=\"lx\" data-t=\"oro\">Oro<\/span>.", "terms": ["quorum", "oro"]}, {"k": "p", "html": "&quot;Then they&#x27;ll ask how you knew where the pipe was,&quot; said <span class=\"lx\" data-t=\"quell\">Quell<\/span>. &quot;And the honest answer starts with <i>a scout brought me here as a seed<\/i>. And the moment that&#x27;s said in a room with a <span class=\"lx\" data-t=\"register\">register<\/span> in it, you are <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span>, <span class=\"lx\" data-t=\"oro\">Oro<\/span>. You have no birth. You have no line. You will have no water, no <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, no <span class=\"lx\" data-t=\"ledger\">Ledger<\/span>. <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> will make sure of it. <i>That&#x27;s<\/i> why <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> sent you to the <span class=\"lx\" data-t=\"tallow-market\">Tallow Market<\/span>. To open the <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> where nothing is <span class=\"lx\" data-t=\"register\">registered<\/span>. To give you the proof without anyone ever learning where you came from.&quot;", "terms": ["quell", "register", "unlisted", "oro", "hearth", "ledger", "corvane", "varrow", "tallow-market", "memory-strand"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"varrow\">Varrow<\/span> said nothing. <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> had said everything she meant to, at the <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span>.", "terms": ["varrow", "contract-fair"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> looked at <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>.", "terms": ["oro", "mesk"]}, {"k": "p", "html": "And <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> — <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>, who could not lie, who would answer truthfully any question anyone put to them directly — <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> looked back at him, and in front of all of them said: &quot;I want to <span class=\"lx\" data-t=\"conjugation\">conjugate<\/span> with you. At the <span class=\"lx\" data-t=\"contract-fair\">Contract Fair<\/span>. Next <span class=\"lx\" data-t=\"isotonic-rise\">Rise<\/span>. I want it in front of everyone.&quot;", "terms": ["mesk", "conjugation", "contract-fair", "isotonic-rise"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> went perfectly still.", "terms": ["hearth"]}, {"k": "p", "html": "&quot;<span class=\"lx\" data-t=\"mesk\">Mesk<\/span>,&quot; said <span class=\"lx\" data-t=\"quell\">Quell<\/span>, very softly, &quot;if you link your membrane with his, and he is <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span> — &quot;", "terms": ["mesk", "quell", "unlisted"]}, {"k": "p", "html": "&quot;I know,&quot; said <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>. &quot;I&#x27;m not asking whether I <i>can<\/i>. <span class=\"lx\" data-t=\"immunan\">Immunans<\/span> don&#x27;t ask whether. I&#x27;m telling you what&#x27;s true.&quot; They turned back to <span class=\"lx\" data-t=\"oro\">Oro<\/span>. &quot;That&#x27;s what&#x27;s true.&quot;", "terms": ["mesk", "immunan", "oro"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> did not answer, then. You must forgive him. He was a <span class=\"lx\" data-t=\"hauler\">hauler<\/span> whose whole life had just been read aloud by the dead, and he had been asked the one question that has no safe answer, by the one <span class=\"lx\" data-t=\"organism\">organism<\/span> in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> who would not let him pretend.", "terms": ["oro", "hauler", "organism", "the-osmotic-expanse"]}, {"k": "p", "html": "He went back out to the night pumps. Of course he did. A <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> has to move.", "terms": ["flagellan"]}, {"k": "p", "html": "But he took <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> with him. And all <span class=\"lx\" data-t=\"dim\">that dim<\/span> they hauled water up the third ladder together, cyst after cyst — an <span class=\"lx\" data-t=\"immunan\">Immunan<\/span> hauling, which <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> had never seen — and at the top of every landing, he stopped, and <span class=\"lx\" data-t=\"vent\">Vented<\/span>, and did not move on until <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> had caught up.", "terms": ["mesk", "dim", "immunan", "sump-nine", "vent"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> saw it from the fourth landing. <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> told me. &quot;<span class=\"lx\" data-t=\"vent\">Vent<\/span> at the top,&quot; <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> said. &quot;Not halfway. Halfway, your body learns that halfway is where you stop.&quot; And then, after a long <span class=\"lx\" data-t=\"barophil\">Barophil<\/span> pause: &quot;<i>He was stopping at every landing. For the other one. Never seen a <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> learn anything so fast.<\/i>&quot;", "terms": ["dunmore", "vent", "barophil", "flagellan"]}, {"k": "hr", "html": "", "terms": []}, {"k": "h2", "html": "VI · THE SWELL", "terms": []}, {"k": "h3", "html": "<i>Hypotonic Zenith<\/i>", "terms": []}, {"k": "q", "html": "<i><span class=\"lx\" data-t=\"masks\">Masks<\/span> are lawful. Nobody is lying. Everybody is lying. Welcome to <span class=\"lx\" data-t=\"swell\">the Swell<\/span>.<\/i><br>— a carnival barker at <span class=\"lx\" data-t=\"knot-nine\">Knot Nine<\/span>, every <span class=\"lx\" data-t=\"hypotonic-zenith\">Hypotonic Zenith<\/span>", "terms": ["masks", "swell", "knot-nine", "hypotonic-zenith"]}, {"k": "p", "html": "And then the <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> turned, as <span class=\"lx\" data-t=\"osmotic-tide\">Tides<\/span> do, and the water came back.", "terms": ["osmotic-tide"]}, {"k": "p", "html": "At the <span class=\"lx\" data-t=\"hypotonic-zenith\">Hypotonic Zenith<\/span> the whole <span class=\"lx\" data-t=\"the-osmotic-expanse\">Expanse<\/span> goes soft and wet and dilute, and water — which always flows toward salt — floods <i>into<\/i> every body that holds more salt than the world around it. The <span class=\"lx\" data-t=\"swollen\">Swollen<\/span>, who have spent half a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> shrinking, fill out like <span class=\"lx\" data-t=\"bud\">buds<\/span> after a meal. They move faster. They heal. Every <span class=\"lx\" data-t=\"drift\">Drift<\/span> costs them less. And <span class=\"lx\" data-t=\"dry\">the Dry<\/span>, in their sealed and salted pockets, begin to <i>bloat<\/i>: water forcing its way into them through every membrane, their pumps straining day and night to bail it out. For one <span class=\"lx\" data-t=\"drift-season\">Drift Season<\/span> a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span>, the poor are strong and the rich are uncomfortable, and every colony in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> knows what happens next.", "terms": ["hypotonic-zenith", "the-osmotic-expanse", "swollen", "osmotic-tide", "bud", "drift", "dry", "drift-season"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"swell\">Swell<\/span>. A <span class=\"lx\" data-t=\"pulse-ten\">Pulse Ten<\/span> of carnival. The <span class=\"lx\" data-t=\"swollen\">Swollen<\/span> rule the streets. <span class=\"lx\" data-t=\"masks\">Masks<\/span> are lawful — the fourth <span class=\"lx\" data-t=\"sacred-code\">Precept<\/span> of <span class=\"lx\" data-t=\"sacred-code\">the Code<\/span>, <i>tonicity is truth<\/i>, is suspended by custom, so that for ten <span class=\"lx\" data-t=\"beat\">Beats<\/span> anyone may smell like anything — and every <span class=\"lx\" data-t=\"issue\">Issue<\/span> <span class=\"lx\" data-t=\"pump\">the Pump<\/span> backs starts the air a little thicker in its favour. There are <span class=\"lx\" data-t=\"current-race\">current-races<\/span> in the channel. There are mock-elders crowned by the <span class=\"lx\" data-t=\"hauler\">haulers<\/span> and paraded up the ladders on cyst-sledges. There are riots, sometimes. There are always riots, somewhere.", "terms": ["swell", "pulse-ten", "swollen", "masks", "sacred-code", "beat", "issue", "pump", "current-race", "hauler"]}, {"k": "p", "html": "That <span class=\"lx\" data-t=\"swell\">Swell<\/span>, <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> had a strike.", "terms": ["swell", "sump-nine"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"hauler\">haulers<\/span> stopped on the first <span class=\"lx\" data-t=\"beat\">Beat<\/span>. <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> called it, at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, in his slow way: &quot;We carry water uphill to <span class=\"lx\" data-t=\"dry\">the Dry<\/span>. The <span class=\"lx\" data-t=\"dry\">Dry<\/span> are drinking our water through a pipe. We will not carry another cyst up the ladders until the colony knows it.&quot; Nobody in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> could prove the pipe. Everybody in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> had heard of it, by then — the rumour had gone from Fresh to Repeated in a <span class=\"lx\" data-t=\"drift-season\">Drift Season<\/span>, the way true rumours do — and a Repeated rumour is hard to disprove, and <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> did not try. He simply stopped coming down from his pocket.", "terms": ["hauler", "beat", "dunmore", "hearth", "dry", "sump-nine", "drift-season", "corvane"]}, {"k": "p", "html": "Without <span class=\"lx\" data-t=\"pump\">the Pump<\/span>, the <span class=\"lx\" data-t=\"vacuole\">Vacuole<\/span> emptied. Every price in the colony crept toward scarce. The rationing that had ended at the <span class=\"lx\" data-t=\"isotonic-fall\">Fall<\/span> came back. The colony&#x27;s <span class=\"lx\" data-t=\"interior\">Interior<\/span> — its unrest, its <span class=\"lx\" data-t=\"stress\">Stress<\/span> — climbed to five and stayed there: a strike. The <span class=\"lx\" data-t=\"assembly\">Assembly<\/span> sat for two <span class=\"lx\" data-t=\"beat\">Beats<\/span> and could not find eight voices for anything, because the <span class=\"lx\" data-t=\"steward\">Steward<\/span>&#x27;s chair was empty and the <span class=\"lx\" data-t=\"printwright\">Printwright<\/span>&#x27;s chair was empty and the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>&#x27;s chair belonged to someone the <span class=\"lx\" data-t=\"register\">register<\/span> said did not exist.", "terms": ["pump", "vacuole", "isotonic-fall", "interior", "stress", "assembly", "beat", "steward", "printwright", "registrar", "register"]}, {"k": "p", "html": "And <span class=\"lx\" data-t=\"henn\">Henn<\/span>, the <span class=\"lx\" data-t=\"tally-keeper\">Tally-Keeper<\/span>, came to the <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> on the fourth <span class=\"lx\" data-t=\"beat\">Beat<\/span> of <span class=\"lx\" data-t=\"swell\">the Swell<\/span> with her sheets wound so tight she could hardly speak, and said: &quot;The <span class=\"lx\" data-t=\"tally\">tally<\/span> will fail by the end of <span class=\"lx\" data-t=\"swell\">the Swell<\/span>. I&#x27;m eleven <span class=\"lx\" data-t=\"beat\">Beats<\/span> behind on the <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span> loan. Factor <span class=\"lx\" data-t=\"lune\">Lune<\/span> called it this morning. If <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> cannot pay, <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> defaults, and the <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> buys our <span class=\"lx\" data-t=\"charter\">charter<\/span>.&quot; She looked around the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>. &quot;<span class=\"lx\" data-t=\"lune\">Lune<\/span> has already filed the <span class=\"lx\" data-t=\"issue\">Issue<\/span>. <i>Sell the <span class=\"lx\" data-t=\"charter\">charter<\/span> to the <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span>, to clear the colony&#x27;s debt.<\/i> It goes on the air tonight. It will be read at the end of <span class=\"lx\" data-t=\"swell\">the Swell<\/span>.&quot;", "terms": ["henn", "tally-keeper", "hauler", "hearth", "beat", "swell", "tally", "brine-office", "lune", "sump-nine", "ribosome-hegemony", "charter", "issue"]}, {"k": "p", "html": "&quot;And who&#x27;s <span class=\"lx\" data-t=\"steward\">Steward<\/span> under the <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span>&#x27;s <span class=\"lx\" data-t=\"charter\">charter<\/span>?&quot; asked <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span>, who already knew.", "terms": ["steward", "ribosome-hegemony", "charter", "dunmore"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"henn\">Henn<\/span> did not answer. <span class=\"lx\" data-t=\"henn\">Henn<\/span> did not need to.", "terms": ["henn"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "I will not walk you through every round of that <span class=\"lx\" data-t=\"quorum\">Quorum<\/span>. You know how a <span class=\"lx\" data-t=\"quorum\">Quorum<\/span> goes. Every <span class=\"lx\" data-t=\"organism\">organism<\/span> who cares breathes <span class=\"lx\" data-t=\"signal\">signal<\/span> into the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> air, <span class=\"lx\" data-t=\"beat\">Beat<\/span> after <span class=\"lx\" data-t=\"beat\">Beat<\/span>, until the air is thick enough with one answer that the colony <i>knows<\/i>. Speak at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>; move the crowd; swear it; court an <span class=\"lx\" data-t=\"organ\">organ<\/span>; call a faction; pay for <span class=\"lx\" data-t=\"signal\">signal<\/span>. The <span class=\"lx\" data-t=\"pump\">Pump<\/span> spoke and moved and swore, and a hundred and forty <span class=\"lx\" data-t=\"swollen\">Swollen<\/span> bodies at the height of their Tide-strength breathed against the sale as hard as they could breathe. <span class=\"lx\" data-t=\"corvane\">Corvane<\/span>, bloating in his pocket, <i>paid<\/i>. Cyst after cyst of rendered <span class=\"lx\" data-t=\"signal\">signal<\/span>, poured into the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> air by servants in <span class=\"lx\" data-t=\"masks\">masks<\/span>.", "terms": ["quorum", "organism", "signal", "hearth", "beat", "organ", "pump", "swollen", "corvane", "masks"]}, {"k": "p", "html": "And still the air did not move the way it should have. Night after night, <span class=\"lx\" data-t=\"wend\">Wend<\/span> the <span class=\"lx\" data-t=\"quorum-speaker\">Speaker<\/span> tasted it and said, &quot;<i>Sell<\/i> gains.&quot; The <span class=\"lx\" data-t=\"pump\">Pump<\/span> was breathing its lungs out, and the air was barely changing.", "terms": ["wend", "quorum-speaker", "pump"]}, {"k": "p", "html": "&quot;He&#x27;s <span class=\"lx\" data-t=\"quench\">quenching<\/span>,&quot; said <span class=\"lx\" data-t=\"quell\">Quell<\/span>, on the sixth <span class=\"lx\" data-t=\"beat\">Beat<\/span>.", "terms": ["quench", "quell", "beat"]}, {"k": "p", "html": "You know what <span class=\"lx\" data-t=\"quench\">quenching<\/span> is. It is the gravest political crime in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span>. Not lying in the air: <i>making the air lie<\/i>. An enzyme, breathed into the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, that destroys the other side&#x27;s <span class=\"lx\" data-t=\"signal\">signal<\/span> before it can accumulate. A <span class=\"lx\" data-t=\"quench\">quench<\/span> leaves a residue, and anyone can hunt for it — but only <i>after<\/i> the <span class=\"lx\" data-t=\"issue\">Issue<\/span> is read, and by then the colony already <i>knows<\/i>, and a colony that has reached <span class=\"lx\" data-t=\"quorum\">Quorum<\/span> on a stolen question still acts on it.", "terms": ["quench", "the-osmotic-expanse", "hearth", "signal", "issue", "quorum"]}, {"k": "p", "html": "&quot;Can you prove it?&quot; said <span class=\"lx\" data-t=\"oro\">Oro<\/span>.", "terms": ["oro"]}, {"k": "p", "html": "&quot;After,&quot; said <span class=\"lx\" data-t=\"quell\">Quell<\/span>. &quot;Only after. And after, the <span class=\"lx\" data-t=\"charter\">charter<\/span> is sold, and the <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span>&#x27;s <span class=\"lx\" data-t=\"warden-circles\">Wardens<\/span> are at the gate, and I&#x27;m the first <span class=\"lx\" data-t=\"organism\">organism<\/span> they&#x27;ll strike.&quot;", "terms": ["quell", "charter", "ribosome-hegemony", "warden-circles", "organism"]}, {"k": "p", "html": "&quot;Then we need to <span class=\"lx\" data-t=\"reveal\">Reveal<\/span> the pipe <i>before<\/i>,&quot; said <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>. &quot;In front of the colony. Not a rumour. A <i>line<\/i>.&quot;", "terms": ["reveal", "mesk"]}, {"k": "p", "html": "&quot;The <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> is spent,&quot; said <span class=\"lx\" data-t=\"varrow\">Varrow<\/span>.", "terms": ["memory-strand", "varrow"]}, {"k": "p", "html": "&quot;Then we show them the pipe itself,&quot; said <span class=\"lx\" data-t=\"oro\">Oro<\/span>.", "terms": ["oro"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "Now. This is the part bards fight over. Every <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> in the <span class=\"lx\" data-t=\"cytoplasmic-mid-strata\">Mid-Strata<\/span> tells it differently. I am going to tell it the way I remember it, because I <i>do<\/i> remember it, and I will tell you how in a moment.", "terms": ["hearth", "cytoplasmic-mid-strata"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"swell\">Swell<\/span>&#x27;s great sport is the <span class=\"lx\" data-t=\"current-race\">current-race<\/span>: <span class=\"lx\" data-t=\"organism\">organisms<\/span> riding the channel current through a marked course, three checkpoints, <span class=\"lx\" data-t=\"momentum\">Momentum<\/span> allowed, bets running to thousands of <span class=\"lx\" data-t=\"substrate\">S<\/span>. <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>&#x27;s course ran from the <span class=\"lx\" data-t=\"somatic-gate\">somatic gate<\/span>, round the <span class=\"lx\" data-t=\"gel-moat\">gel moat<\/span>, under the north wall — under the old cut lattice — and back to the gate. Every <span class=\"lx\" data-t=\"hauler\">hauler<\/span> in the colony knew it. Every <span class=\"lx\" data-t=\"dry\">Dry<\/span> pocket on the north wall overlooked it. And on the last <span class=\"lx\" data-t=\"beat\">Beat<\/span> of <span class=\"lx\" data-t=\"swell\">the Swell<\/span>, with the whole colony <span class=\"lx\" data-t=\"masks\">masked<\/span> and watching and the <span class=\"lx\" data-t=\"quorum\">Quorum<\/span> to be read at the twentieth <span class=\"lx\" data-t=\"fugue-interval\">Interval<\/span>, <span class=\"lx\" data-t=\"oro\">Oro-of-the-Seven-Ladders<\/span> entered the race.", "terms": ["swell", "current-race", "organism", "momentum", "substrate", "sump-nine", "somatic-gate", "gel-moat", "hauler", "dry", "beat", "masks", "quorum", "fugue-interval", "oro"]}, {"k": "p", "html": "He was a <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> at the height of a <span class=\"lx\" data-t=\"hypotonic-zenith\">Hypotonic Zenith<\/span>. He was faster than anyone in the water. He led from the gate. He led round the moat. And at the second checkpoint, under the north wall, where the pipe went into the lattice, he did not take the turn.", "terms": ["flagellan", "hypotonic-zenith"]}, {"k": "p", "html": "He went <i>into<\/i> the lattice.", "terms": []}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"hauler\">haulers<\/span> on the ladders saw him go. The <span class=\"lx\" data-t=\"masks\">masked<\/span> crowd on the moat saw him go. And then — this is the part every <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> agrees on — the channel current, which had been flowing past the lattice for twenty <span class=\"lx\" data-t=\"drift-season\">Drift Seasons<\/span>, found a hole where a <span class=\"lx\" data-t=\"hauler\">hauler<\/span> had torn it open, and went in after him, and the pipe that <span class=\"lx\" data-t=\"corvane\">Corvane<\/span>&#x27;s <span class=\"lx\" data-t=\"channel\">channel-maker<\/span> had hidden inside the north wall <i>burst<\/i>.", "terms": ["hauler", "masks", "hearth", "drift-season", "corvane", "channel"]}, {"k": "p", "html": "Water came out of the wall. A great pale fan of it, bright with the colony&#x27;s own scent, pouring backward out of the dark where it had been bleeding upward for a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span>. Every <span class=\"lx\" data-t=\"organism\">organism<\/span> in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> smelled it at once: <i>our water. Our water, coming out of the wall under <span class=\"lx\" data-t=\"dry\">the Dry<\/span> pockets.<\/i> You could not fake that. You could not mask it. <span class=\"lx\" data-t=\"sacred-code\">Precept<\/span> 4 was suspended, and it did not matter, because a pipe is not an <span class=\"lx\" data-t=\"organism\">organism<\/span> and does not get to wear a mask.", "terms": ["osmotic-tide", "organism", "sump-nine", "dry", "sacred-code"]}, {"k": "p", "html": "And the lattice under the north wall of the <span class=\"lx\" data-t=\"gel-moat\">gel moat<\/span> — the lattice whose protein supports had been cut, <span class=\"lx\" data-t=\"osmotic-tide\">Tides<\/span> ago, by someone who wanted the pipe to be easy to reach — began to fall.", "terms": ["gel-moat", "osmotic-tide"]}, {"k": "p", "html": "Onto the <span class=\"lx\" data-t=\"nursery\">nursery<\/span>.", "terms": ["nursery"]}, {"k": "p", "html": "Forty <span class=\"lx\" data-t=\"bud\">buds<\/span> of every <span class=\"lx\" data-t=\"lineage\">lineage<\/span>, pressed against the <span class=\"lx\" data-t=\"nursery\">nursery<\/span> membrane to watch the race.", "terms": ["bud", "lineage", "nursery"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> told me what happened next. <span class=\"lx\" data-t=\"tannet\">Tannet<\/span> told me. <span class=\"lx\" data-t=\"grue\">Grue<\/span> told me, in his slow way, a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> later, holding the <span class=\"lx\" data-t=\"long-note\">long note<\/span> for a full breath between every sentence. I will tell you what they told me, and then I will tell you what I remember.", "terms": ["oro", "tannet", "grue", "osmotic-tide", "long-note"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> could have come out of the wall. The race was there, the crowd was there, the burst pipe was there, <span class=\"lx\" data-t=\"reveal\">Reveal<\/span> enough for any <span class=\"lx\" data-t=\"quorum\">Quorum<\/span> in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span>. He could have swum back to the gate and stood at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> and said <i>the colony knows<\/i>, and the colony would have known.", "terms": ["oro", "reveal", "quorum", "the-osmotic-expanse", "hearth"]}, {"k": "p", "html": "He did not come out of the wall. He went <i>under<\/i> the falling lattice, and braced it.", "terms": []}, {"k": "p", "html": "A <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span>. A body that cannot stand still. A body that, if it does not move, finds <span class=\"lx\" data-t=\"obligate-drifter\">the ache<\/span>, and after <span class=\"lx\" data-t=\"obligate-drifter\">the ache<\/span> the grey nothing that he had been afraid of his whole life. He put his back against a falling wall of protein lattice above forty <span class=\"lx\" data-t=\"bud\">buds<\/span> and he <i>held still<\/i>.", "terms": ["flagellan", "obligate-drifter", "bud"]}, {"k": "p", "html": "He held it for a <span class=\"lx\" data-t=\"fugue-interval\">Fugue Interval<\/span>. You can ask the <span class=\"lx\" data-t=\"muster\">Muster<\/span> how long that is for a <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span>. The ache came, and he held. The grey came, and he held. <span class=\"lx\" data-t=\"tannet\">Tannet<\/span> got the first ten <span class=\"lx\" data-t=\"bud\">buds<\/span> out through the moat&#x27;s far side. The <span class=\"lx\" data-t=\"hauler\">haulers<\/span> came down the ladders and got another twenty. And when <span class=\"lx\" data-t=\"oro\">Oro<\/span>&#x27;s lashes had stopped moving and his body had gone dull and grey and he could no longer have said his own name, <span class=\"lx\" data-t=\"grue\">Grue<\/span> the <span class=\"lx\" data-t=\"muster\">Muster<\/span> arrived, slow as a mountain, singing the <span class=\"lx\" data-t=\"long-note\">long note<\/span>, and put his vast slate shoulders under the lattice beside the <span class=\"lx\" data-t=\"hauler\">hauler<\/span>&#x27;s, and held it while the last ten <span class=\"lx\" data-t=\"bud\">buds<\/span> came out.", "terms": ["fugue-interval", "muster", "flagellan", "tannet", "bud", "hauler", "oro", "grue", "long-note"]}, {"k": "p", "html": "They pulled <span class=\"lx\" data-t=\"oro\">Oro<\/span> out of the wall unconscious. He did not move for a full <span class=\"lx\" data-t=\"beat\">Beat<\/span> afterwards. <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> sat with him. <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> breathed the <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span>&#x27; lullaby over him, the whole <span class=\"lx\" data-t=\"beat\">Beat<\/span>, until his chemistry remembered how to argue with the water again.", "terms": ["oro", "beat", "mesk", "seven-ladders"]}, {"k": "p", "html": "That is the story every <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> tells.", "terms": ["hearth"]}, {"k": "p", "html": "Here is what I remember. <i>I remember the grey.<\/i> I remember it from the inside. I remember thinking, in that grey, that it was not boring after all. It was very, very quiet, and somewhere at the bottom of it someone was singing a <span class=\"lx\" data-t=\"long-note\">long note<\/span>, and I was not afraid.", "terms": ["long-note"]}, {"k": "p", "html": "You understand now how I remember. Hold that. I am nearly there.", "terms": []}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "The air was read at the twentieth <span class=\"lx\" data-t=\"fugue-interval\">Interval<\/span>, as it had to be.", "terms": ["fugue-interval"]}, {"k": "p", "html": "The whole of <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> crowded the main sump, <span class=\"lx\" data-t=\"masks\">masked<\/span> and unmasked, the <span class=\"lx\" data-t=\"hauler\">haulers<\/span> wet from the moat and the <span class=\"lx\" data-t=\"nursery\">nursery<\/span> <span class=\"lx\" data-t=\"bud\">buds<\/span> bundled in <span class=\"lx\" data-t=\"tannet\">Tannet<\/span>&#x27;s sheets. <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> came down from his pocket for the first time in <span class=\"lx\" data-t=\"swell\">the Swell<\/span>, bloated and furious, and stood at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> with <span class=\"lx\" data-t=\"lune\">Lune<\/span> at his side, and before <span class=\"lx\" data-t=\"wend\">Wend<\/span> could taste the air, <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> said:", "terms": ["sump-nine", "masks", "hauler", "nursery", "bud", "tannet", "corvane", "swell", "hearth", "lune", "wend"]}, {"k": "p", "html": "&quot;A question. Before the reading. I have the right; I am a party to the <span class=\"lx\" data-t=\"issue\">Issue<\/span>.&quot; He turned his great salted body toward the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>&#x27;s shelf, where <span class=\"lx\" data-t=\"quell\">Quell<\/span> stood — and beside her, <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>. &quot;The <span class=\"lx\" data-t=\"hauler\">hauler<\/span> who burst the wall. The colony is about to act on what he showed it. The colony should know who he <i>is<\/i>. Ask the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>&#x27;s apprentice. The <span class=\"lx\" data-t=\"immunan\">Immunan<\/span>.&quot; A smile, <span class=\"lx\" data-t=\"dry\">Dry<\/span> as a vault. &quot;<span class=\"lx\" data-t=\"immunan\">Immunans<\/span> cannot lie.&quot;", "terms": ["issue", "registrar", "quell", "mesk", "hauler", "immunan", "dry"]}, {"k": "p", "html": "The sump went silent.", "terms": []}, {"k": "p", "html": "&quot;Apprentice,&quot; said <span class=\"lx\" data-t=\"corvane\">Corvane<\/span>. &quot;Directly, then. Is <span class=\"lx\" data-t=\"oro\">Oro-of-the-Seven-Ladders<\/span> truly <span class=\"lx\" data-t=\"register\">listed<\/span> in the <span class=\"lx\" data-t=\"register\">register<\/span> of <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>?&quot;", "terms": ["corvane", "oro", "register", "sump-nine"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"mesk\">Mesk<\/span> could have refused. An <span class=\"lx\" data-t=\"immunan\">Immunan<\/span> may refuse to answer if an <span class=\"lx\" data-t=\"oath\">Oath<\/span> forbids it — and <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> had not sworn one; they had wanted to, at the <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span>, and the <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span> had not come yet. They could have refused anyway, and paid for it: <span class=\"lx\" data-t=\"stress\">Stress<\/span>, one fraying of the membrane for every sentence of silence, until their body gave out. Some <span class=\"lx\" data-t=\"immunan\">Immunans<\/span> have died that way, refusing. It is in the songs.", "terms": ["mesk", "immunan", "oath", "contract-fair", "stress"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"mesk\">Mesk<\/span> looked across the sump at the <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, where <span class=\"lx\" data-t=\"oro\">Oro<\/span> lay unmoving in <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span>&#x27;s arms.", "terms": ["mesk", "hauler", "hearth", "oro", "dunmore"]}, {"k": "p", "html": "And <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said: &quot;No.&quot;", "terms": ["mesk"]}, {"k": "p", "html": "I want you to smell that word. Breathe it in. That was the sound of a heart going through a <span class=\"lx\" data-t=\"register\">register<\/span> like a blade.", "terms": ["register"]}, {"k": "p", "html": "&quot;No,&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said again, and their voice did not shake, because <span class=\"lx\" data-t=\"immunan\">Immunans<\/span> do not lie and do not tremble. &quot;He was brought here as a <span class=\"lx\" data-t=\"brooding\">brooded<\/span> seed by a <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> scout named <span class=\"lx\" data-t=\"yarrow\">Yarrow-who-went-ahead<\/span>, from a colony in <span class=\"lx\" data-t=\"lysosomal-wastes\">the Wastes<\/span> that was struck from every <span class=\"lx\" data-t=\"register\">register<\/span>. His birth line was forged. He is not <span class=\"lx\" data-t=\"register\">listed<\/span>. He is not of the <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span> by blood. He is <span class=\"lx\" data-t=\"sefa\">Sefa<\/span>&#x27;s <span class=\"lx\" data-t=\"ward\">ward<\/span> by <span class=\"lx\" data-t=\"rite\">Rite<\/span>. That is all true.&quot; And then, without any pause at all, in exactly the same flat, terrible, truthful voice: &quot;<i>And the water in your pocket is ours, <span class=\"lx\" data-t=\"corvane\">Corvane<\/span>. The pipe ends in your pocket and in the <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> factor&#x27;s. <span class=\"lx\" data-t=\"yarrow\">Yarrow-who-went-ahead<\/span> followed it up the wall and recorded it in her <span class=\"lx\" data-t=\"memory-strand\">strand<\/span>, and I heard that <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> opened at the <span class=\"lx\" data-t=\"rendering\">Rendering<\/span>, with an <span class=\"lx\" data-t=\"reader\">Ash Reader<\/span> and a <span class=\"lx\" data-t=\"barophil\">Barophil<\/span> and the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> as witnesses. You <span class=\"lx\" data-t=\"quench\">quenched<\/span> the air. Every <span class=\"lx\" data-t=\"beat\">Beat<\/span> of <span class=\"lx\" data-t=\"swell\">the Swell<\/span>. I can taste the residue on you from here.<\/i>&quot;", "terms": ["mesk", "immunan", "brooding", "lysosan", "yarrow", "lysosomal-wastes", "register", "seven-ladders", "sefa", "ward", "rite", "corvane", "ribosome-hegemony", "memory-strand", "rendering", "reader", "barophil", "registrar", "quench", "beat", "swell"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"corvane\">Corvane<\/span> opened his mouth.", "terms": ["corvane"]}, {"k": "p", "html": "And the most credible witness in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> — an <span class=\"lx\" data-t=\"immunan\">Immunan<\/span>, a body that <i>cannot lie<\/i> — stood at the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>&#x27;s shelf and smelled, to every <span class=\"lx\" data-t=\"organism\">organism<\/span> in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>, of exactly what they were.", "terms": ["the-osmotic-expanse", "immunan", "registrar", "organism", "sump-nine"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"wend\">Wend<\/span> the <span class=\"lx\" data-t=\"quorum-speaker\">Speaker<\/span> tasted the air. <span class=\"lx\" data-t=\"wend\">Wend<\/span>, who was honest enough most of the time and not quite honest enough when it mattered, tasted the air and, for once in her life, found it mattered enough. She did not read the <span class=\"lx\" data-t=\"issue\">Issue<\/span>. She hunted the <span class=\"lx\" data-t=\"quench\">quench<\/span>. It took her a <span class=\"lx\" data-t=\"fugue-interval\">Fugue Interval<\/span>. The residue was everywhere.", "terms": ["wend", "quorum-speaker", "issue", "quench", "fugue-interval"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"quorum\">Quorum<\/span> was void. <span class=\"lx\" data-t=\"cohesion\">Colony Cohesion<\/span> fell by two, because a colony whose air has been stolen is a colony that has been robbed of its own mind. The <span class=\"lx\" data-t=\"lysosome\">Lysosome<\/span> <span class=\"lx\" data-t=\"assay\">assayed<\/span> <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> that night — <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> reading his body in front of the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, the trial run as a <span class=\"lx\" data-t=\"convocation\">Convocation<\/span> with <span class=\"lx\" data-t=\"pump\">the Pump<\/span> and the <span class=\"lx\" data-t=\"tally\">Tally<\/span> and the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>&#x27;s shelf in the room — and the reading was true, and the colony reached <span class=\"lx\" data-t=\"quorum\">Quorum<\/span> on it before dawn, and knew.", "terms": ["quorum", "cohesion", "lysosome", "assay", "corvane", "varrow", "hearth", "convocation", "pump", "tally", "registrar"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"corvane\">Corvane of the Sealed Pocket<\/span> was <b><span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span><\/b>. Struck from every <span class=\"lx\" data-t=\"register\">register<\/span> <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> shared. The irony was not lost on anyone, least of all him.", "terms": ["corvane", "unlisted", "register", "sump-nine"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"lune\">Lune<\/span>, the <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> factor, was never charged. The <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> never breaks a contract in writing; it only reinterprets one for a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span>. <span class=\"lx\" data-t=\"lune\">Lune<\/span> left by the <span class=\"lx\" data-t=\"bridge-post\">Bridge post<\/span> the next morning with a stamped letter explaining that the <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span> had been <i>deceived by a local agent<\/i>, and the loan was quietly given ten <span class=\"lx\" data-t=\"beat\">Beats<\/span>&#x27; grace, and the <span class=\"lx\" data-t=\"charter\">charter<\/span> was not sold, and <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> was still <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>.", "terms": ["lune", "ribosome-hegemony", "osmotic-tide", "bridge-post", "brine-office", "beat", "charter", "sump-nine"]}, {"k": "p", "html": "And <span class=\"lx\" data-t=\"oro\">Oro-of-the-Seven-Ladders<\/span>, who had saved forty <span class=\"lx\" data-t=\"bud\">buds<\/span> and a colony&#x27;s water, woke up on the second <span class=\"lx\" data-t=\"beat\">Beat<\/span> after <span class=\"lx\" data-t=\"swell\">the Swell<\/span> to find he did not exist.", "terms": ["oro", "bud", "beat", "swell"]}, {"k": "hr", "html": "", "terms": []}, {"k": "h2", "html": "VII · TENANCY", "terms": []}, {"k": "h3", "html": "<i>Isotonic Rise, and after<\/i>", "terms": []}, {"k": "q", "html": "<i>The <span class=\"lx\" data-t=\"register\">register<\/span> is the colony. To be <span class=\"lx\" data-t=\"unlisted\">unlisted<\/span> is to be outside the world&#x27;s legal body.<\/i><br>— the <span class=\"lx\" data-t=\"warden-circles\">Warden Circles<\/span>, as the Codex records them", "terms": ["register", "unlisted", "warden-circles"]}, {"k": "p", "html": "An <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span> <span class=\"lx\" data-t=\"organism\">organism<\/span> has no water.", "terms": ["unlisted", "organism"]}, {"k": "p", "html": "That is not cruelty. That is arithmetic. The <span class=\"lx\" data-t=\"tally\">water tally<\/span> is assessed by <span class=\"lx\" data-t=\"hearth\">hearth<\/span>, and an <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span> <span class=\"lx\" data-t=\"organism\">organism<\/span> has no <span class=\"lx\" data-t=\"hearth\">hearth<\/span>; the <span class=\"lx\" data-t=\"vacuole\">Vacuole<\/span>&#x27;s crystal has no line to read its ration from. It may eat at a <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> if the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> will have it. It may haul, if <span class=\"lx\" data-t=\"pump\">the Pump<\/span> will pay it off the books. It may not sign, may not swear, may not <span class=\"lx\" data-t=\"conjugation\">conjugate<\/span>, may not be protected. A <span class=\"lx\" data-t=\"warden-circles\">Warden<\/span> may detain it on sight. It is outside the world&#x27;s legal body.", "terms": ["tally", "hearth", "unlisted", "organism", "vacuole", "pump", "conjugation", "warden-circles"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"pump\">Pump<\/span> would have hidden him forever. <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> said so; <span class=\"lx\" data-t=\"grue\">Grue<\/span> said so; every <span class=\"lx\" data-t=\"hauler\">hauler<\/span> with a <span class=\"lx\" data-t=\"bud\">bud<\/span> who had been in the <span class=\"lx\" data-t=\"nursery\">nursery<\/span> that <span class=\"lx\" data-t=\"swell\">Swell<\/span> said so. <span class=\"lx\" data-t=\"quell\">Quell<\/span> said more than that. <span class=\"lx\" data-t=\"quell\">Quell<\/span> came to him on the third <span class=\"lx\" data-t=\"beat\">Beat<\/span> with her shelves under her arm and said: &quot;I can write you a line. A new one. Honest this time — or as honest as a forged thing can be. <i><span class=\"lx\" data-t=\"oro\">Oro<\/span>, <span class=\"lx\" data-t=\"ward\">ward<\/span> of <span class=\"lx\" data-t=\"sefa\">Sefa<\/span>, <span class=\"lx\" data-t=\"register\">listed<\/span> by the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> of <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>.<\/i> It would hold until the <span class=\"lx\" data-t=\"rereading\">Rereading<\/span>. Maybe longer.&quot;", "terms": ["pump", "dunmore", "grue", "hauler", "bud", "nursery", "swell", "quell", "beat", "oro", "ward", "sefa", "register", "registrar", "sump-nine", "rereading"]}, {"k": "p", "html": "&quot;Written by an <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span> <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>,&quot; said <span class=\"lx\" data-t=\"oro\">Oro<\/span>.", "terms": ["unlisted", "registrar", "oro"]}, {"k": "p", "html": "&quot;Yes.&quot;", "terms": []}, {"k": "p", "html": "&quot;For a debt.&quot;", "terms": []}, {"k": "p", "html": "&quot;For nothing,&quot; said <span class=\"lx\" data-t=\"quell\">Quell<\/span>. &quot;For forty <span class=\"lx\" data-t=\"bud\">buds<\/span>.&quot;", "terms": ["quell", "bud"]}, {"k": "p", "html": "He thought about it for a long time. He told me he was tempted. He told me he thought about <span class=\"lx\" data-t=\"sefa\">Sefa<\/span>, who had made him a lie to keep him alive and said, from inside her own death, <i>I would do it again<\/i>. He told me he thought about <span class=\"lx\" data-t=\"corvane\">Corvane<\/span>, who was built of lies all the way down, and who was now exactly what <span class=\"lx\" data-t=\"oro\">Oro<\/span> was.", "terms": ["sefa", "corvane", "oro"]}, {"k": "p", "html": "&quot;No,&quot; he said. &quot;I won&#x27;t be built on a lie twice. <span class=\"lx\" data-t=\"sefa\">Sefa<\/span> paid enough for the first one.&quot;", "terms": ["sefa"]}, {"k": "p", "html": "So there was nowhere in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> for him to be.", "terms": ["sump-nine"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "And then, at the <span class=\"lx\" data-t=\"isotonic-rise\">Isotonic Rise<\/span>, <span class=\"lx\" data-t=\"old-mother-brine\">Old Mother Brine<\/span> came down the <span class=\"lx\" data-t=\"fork-of-the-second-flow\">Fork of the Second Flow<\/span>.", "terms": ["isotonic-rise", "old-mother-brine", "fork-of-the-second-flow"]}, {"k": "p", "html": "You know <span class=\"lx\" data-t=\"old-mother-brine\">Old Mother Brine<\/span>. Every <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> does. She is a <b><span class=\"lx\" data-t=\"host-city\">Host-City<\/span><\/b>: a Vast saline amoeboid, slow and motherly, carrying thirty thousand tenants in her body cavities and the <span class=\"lx\" data-t=\"flow-guilds\">Flow Guilds<\/span>&#x27; great headquarters in her left vacuole, migrating with the <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> from the <span class=\"lx\" data-t=\"great-flows\">Great Flows<\/span> to the <span class=\"lx\" data-t=\"cytoplasmic-mid-strata\">Mid-Strata<\/span> to <span class=\"lx\" data-t=\"peri-membrane-rim\">the Rim<\/span> and back again. She does not read <span class=\"lx\" data-t=\"register\">registers<\/span>. Her immune cells read <i>scent<\/i> — whether you have paid your rent, one <span class=\"lx\" data-t=\"atp\">ATP<\/span> a <span class=\"lx\" data-t=\"beat\">Beat<\/span> fed into her at the <span class=\"lx\" data-t=\"rent-well\">Rent Wells<\/span>, whether you smell of her tolerance or not. A <span class=\"lx\" data-t=\"host-city\">Host-City<\/span> does not care if you are <span class=\"lx\" data-t=\"register\">listed<\/span>. A <span class=\"lx\" data-t=\"host-city\">Host-City<\/span> cares if you are a good tenant.", "terms": ["old-mother-brine", "flagellan", "host-city", "flow-guilds", "osmotic-tide", "great-flows", "cytoplasmic-mid-strata", "peri-membrane-rim", "register", "atp", "beat", "rent-well"]}, {"k": "p", "html": "She anchored at <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>&#x27;s channel mouth for one <span class=\"lx\" data-t=\"beat\">Beat<\/span> — uninvited, as <span class=\"lx\" data-t=\"host-city\">Host-Cities<\/span> always are — and every <span class=\"lx\" data-t=\"swollen\">Swollen<\/span> <span class=\"lx\" data-t=\"hauler\">hauler<\/span> in the colony went down to the gate to look at her, because she was the size of a <span class=\"lx\" data-t=\"hab\">hab-hill<\/span> and warm as a <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> and full of the noise of thirty thousand lives.", "terms": ["sump-nine", "beat", "host-city", "swollen", "hauler", "hab", "hearth"]}, {"k": "p", "html": "&quot;She&#x27;ll take you,&quot; said <span class=\"lx\" data-t=\"grue\">Grue<\/span>. &quot;She takes anyone who pays.&quot;", "terms": ["grue"]}, {"k": "p", "html": "&quot;I know,&quot; said <span class=\"lx\" data-t=\"oro\">Oro<\/span>.", "terms": ["oro"]}, {"k": "p", "html": "He went to the <span class=\"lx\" data-t=\"contract-fair\">Contract Fair<\/span> first. That was the <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span> where he and <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> should have <span class=\"lx\" data-t=\"conjugation\">conjugated<\/span>, in front of everyone, at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>. They could not. A <span class=\"lx\" data-t=\"conjugation\">conjugation<\/span> needs a witness from each <span class=\"lx\" data-t=\"budline\">budline<\/span>, and an <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span> <span class=\"lx\" data-t=\"organism\">organism<\/span> has no <span class=\"lx\" data-t=\"budline\">budline<\/span>; and an <span class=\"lx\" data-t=\"immunan\">Immunan<\/span> who links their membrane with an <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span> body becomes, in the eyes of every <span class=\"lx\" data-t=\"warden-circles\">Warden<\/span> <span class=\"lx\" data-t=\"ward\">ward<\/span> in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span>, <i>not quite standard<\/i> themselves. <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> would have done it. <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said so, flatly, at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, in front of the whole <span class=\"lx\" data-t=\"pump\">Pump<\/span>: &quot;I&#x27;ll lose the <span class=\"lx\" data-t=\"register\">register<\/span>. I don&#x27;t care.&quot;", "terms": ["contract-fair", "mesk", "conjugation", "hearth", "budline", "unlisted", "organism", "immunan", "warden-circles", "ward", "the-osmotic-expanse", "pump", "register"]}, {"k": "p", "html": "And <span class=\"lx\" data-t=\"oro\">Oro<\/span>, who had learned from <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> what it costs to say a true thing out loud, said: &quot;<i>I<\/i> care. <span class=\"lx\" data-t=\"quell\">Quell<\/span> is stepping down. She told me. She wants you to have the shelves. A <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> who can&#x27;t lie. Do you know what that would mean for every <span class=\"lx\" data-t=\"bud\">bud<\/span> in that <span class=\"lx\" data-t=\"nursery\">nursery<\/span>? Every one of them would be written down <i>true<\/i>. Nobody would ever have to forge a line again.&quot; His lashes moved, very slightly, all the time. &quot;That&#x27;s worth more than me.&quot;", "terms": ["oro", "mesk", "quell", "registrar", "bud", "nursery"]}, {"k": "p", "html": "&quot;That&#x27;s a lie,&quot; said <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>.", "terms": ["mesk"]}, {"k": "p", "html": "&quot;Yes,&quot; said <span class=\"lx\" data-t=\"oro\">Oro<\/span>. &quot;It is. Take the shelves anyway.&quot;", "terms": ["oro"]}, {"k": "p", "html": "So instead of <span class=\"lx\" data-t=\"conjugation\">conjugating<\/span>, they swore <span class=\"lx\" data-t=\"oath\">Oaths<\/span>. That is allowed, even to the <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span>, if no <span class=\"lx\" data-t=\"register\">register<\/span> is asked; an <span class=\"lx\" data-t=\"oath\">Oath<\/span> is written in your own chromatin, and chromatin does not care about paperwork. It cost them nothing to swear, because it was the <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span>.", "terms": ["conjugation", "oath", "unlisted", "register", "contract-fair"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"mesk\">Mesk<\/span> swore: <i>I will write you down.<\/i>", "terms": ["mesk"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> swore: <i>I will come back to be read.<\/i>", "terms": ["oro"]}, {"k": "p", "html": "And they wrote a line in each other&#x27;s <span class=\"lx\" data-t=\"ledger\">Ledgers<\/span>, in the column that says <i>Owed to you<\/i>, witnessed by <span class=\"lx\" data-t=\"quell\">Quell<\/span> and <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> and <span class=\"lx\" data-t=\"grue\">Grue<\/span> and an <span class=\"lx\" data-t=\"reader\">Ash Reader<\/span> called <span class=\"lx\" data-t=\"varrow\">Varrow<\/span>:", "terms": ["ledger", "quell", "dunmore", "grue", "reader", "varrow"]}, {"k": "p", "html": "<i>Owed to <span class=\"lx\" data-t=\"oro\">Oro<\/span>: one true line, at the <span class=\"lx\" data-t=\"rereading\">Rereading<\/span>.<\/i>", "terms": ["oro", "rereading"]}, {"k": "p", "html": "<i>Owed to <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>: one body, at the end, to read.<\/i>", "terms": ["mesk"]}, {"k": "p", "html": "Then <span class=\"lx\" data-t=\"oro\">Oro-of-the-Seven-Ladders<\/span> paid one <span class=\"lx\" data-t=\"atp\">ATP<\/span> into <span class=\"lx\" data-t=\"old-mother-brine\">Old Mother Brine<\/span>&#x27;s <span class=\"lx\" data-t=\"rent-well\">Rent Well<\/span> and swam into her, and she lifted her anchor, and was gone up the <span class=\"lx\" data-t=\"fork-of-the-second-flow\">Fork of the Second Flow<\/span> with the <span class=\"lx\" data-t=\"isotonic-rise\">Rise<\/span>.", "terms": ["oro", "atp", "old-mother-brine", "rent-well", "fork-of-the-second-flow", "isotonic-rise"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "You can guess the rest. You have been guessing it since I told you my name.", "terms": []}, {"k": "p", "html": "He was a courier aboard <span class=\"lx\" data-t=\"old-mother-brine\">Old Mother Brine<\/span> for five <span class=\"lx\" data-t=\"osmotic-tide\">Tides<\/span>. A <span class=\"lx\" data-t=\"pheromological-messenger\">Pheromological Messenger<\/span>, in the end — the <span class=\"lx\" data-t=\"flow-guilds\">Guilds<\/span> took him on, because a <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> who has held still under a falling wall can carry anything anywhere. He carried trails across every region of <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span>. He carried them through <span class=\"lx\" data-t=\"hypertonic-zenith\">Hypertonic<\/span> storms and Lysosomal fogs and once, the story goes, through a <span class=\"lx\" data-t=\"warden-circles\">Warden<\/span> purge, with a whole colony&#x27;s <span class=\"lx\" data-t=\"register\">register<\/span> hidden in his fins so that the <span class=\"lx\" data-t=\"warden-circles\">Wardens<\/span> could not strike what they could not find. He signed a <span class=\"lx\" data-t=\"digestion-pact\">Digestion Pact<\/span> with <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> at the first <span class=\"lx\" data-t=\"rendering\">Rendering<\/span> he could reach, and paid fifty <span class=\"lx\" data-t=\"substrate\">S<\/span> into the <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span>&#x27; debt, against the principal. The debt was the Ladders&#x27;. He was a Ladder by <span class=\"lx\" data-t=\"rite\">Rite<\/span>, if not by <span class=\"lx\" data-t=\"register\">register<\/span>. He paid it down every <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> after that. He never stopped owing it. He never stopped paying.", "terms": ["old-mother-brine", "osmotic-tide", "pheromological-messenger", "flow-guilds", "flagellan", "the-osmotic-expanse", "hypertonic-zenith", "warden-circles", "register", "digestion-pact", "reclaimers-ash", "rendering", "substrate", "seven-ladders", "rite"]}, {"k": "p", "html": "And three <span class=\"lx\" data-t=\"osmotic-tide\">Tides<\/span> ago, in the warm left vacuole of <span class=\"lx\" data-t=\"old-mother-brine\">Old Mother Brine<\/span>, he <span class=\"lx\" data-t=\"division\">divided<\/span>.", "terms": ["osmotic-tide", "old-mother-brine", "division"]}, {"k": "p", "html": "You know what that means. One body becomes two, and both remember being one. The new <span class=\"lx\" data-t=\"bud\">bud<\/span> was born carrying every memory the old body had, up to the moment of division: the third ladder, the scout in the channel, the <span class=\"lx\" data-t=\"plasmid\">plasmid<\/span> at the <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span>, the <span class=\"lx\" data-t=\"incubation\">incubation<\/span> in the open water, the <span class=\"lx\" data-t=\"oath-duel\">duel<\/span>, the <span class=\"lx\" data-t=\"rendering\">Rendering<\/span>, the grey under the lattice, the <span class=\"lx\" data-t=\"long-note\">long note<\/span> at the bottom of it. Everything. And after the division, the two bodies went their separate ways, as <span class=\"lx\" data-t=\"division\">divisions<\/span> do, and made separate memories, and the <span class=\"lx\" data-t=\"bud\">bud<\/span> — being <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span>, being a drifter, being a body that could not stand still — became a messenger like the old one, and learned to tell trails at <span class=\"lx\" data-t=\"hearth\">Hearths<\/span> for money.", "terms": ["bud", "plasmid", "contract-fair", "incubation", "oath-duel", "rendering", "long-note", "division", "flagellan", "hearth"]}, {"k": "p", "html": "My name is <span class=\"lx\" data-t=\"lisk-of-the-seven-ladders\">Lisk-of-the-Seven-Ladders<\/span>. I was <span class=\"lx\" data-t=\"oro\">Oro<\/span>, until three <span class=\"lx\" data-t=\"osmotic-tide\">Tides<\/span> ago. Then I was me.", "terms": ["lisk-of-the-seven-ladders", "oro", "osmotic-tide"]}, {"k": "hr", "html": "", "terms": []}, {"k": "h2", "html": "THE HEARTH, AGAIN", "terms": []}, {"k": "p", "html": "There. You see now why the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> has not stopped me. They never could stop a true thing once it started.", "terms": ["registrar"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> died seven <span class=\"lx\" data-t=\"beat\">Beats<\/span> ago, in a <span class=\"lx\" data-t=\"hypertonic-zenith\">Hypertonic<\/span> squall in <span class=\"lx\" data-t=\"peri-membrane-rim\">the Rim<\/span>, carrying a trail he never finished. His body came here by the <span class=\"lx\" data-t=\"lipidpost\">Lipidpost<\/span> — <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span>&#x27;s corpse-wagons, which go one region a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> and stop at every <span class=\"lx\" data-t=\"rendering\">Rendering<\/span> ground and cannot be stopped or censored — because he had a <span class=\"lx\" data-t=\"digestion-pact\">Digestion Pact<\/span> with <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span>, and a line in a <span class=\"lx\" data-t=\"ledger\">Ledger<\/span> that said <i>Owed to <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>: one body, at the end, to read.<\/i> He is hanging in <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> Rows behind you. Between <span class=\"lx\" data-t=\"sefa\">Sefa<\/span>&#x27;s old husk-hook and <span class=\"lx\" data-t=\"yarrow\">Yarrow<\/span>&#x27;s.", "terms": ["oro", "beat", "hypertonic-zenith", "peri-membrane-rim", "lipidpost", "reclaimers-ash", "osmotic-tide", "rendering", "digestion-pact", "ledger", "mesk", "sefa", "yarrow"]}, {"k": "p", "html": "Yes. <span class=\"lx\" data-t=\"yarrow\">Yarrow<\/span>&#x27;s. She is still here. The <span class=\"lx\" data-t=\"reclaimers-ash\">Ash<\/span> kept her, as <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> said they would: <i>until the <span class=\"lx\" data-t=\"oath\">Oath<\/span> is paid, or until the <span class=\"lx\" data-t=\"rereading\">Rereading<\/span>, whichever comes first.<\/i>", "terms": ["yarrow", "reclaimers-ash", "varrow", "oath", "rereading"]}, {"k": "p", "html": "And this season — this very <span class=\"lx\" data-t=\"drift-season\">Drift Season<\/span>, friends, this one we are sitting in — is the <b><span class=\"lx\" data-t=\"rereading\">Rereading<\/span><\/b>. The <span class=\"lx\" data-t=\"great-cycle\">Great Cycle<\/span>&#x27;s turning. Sixteen <span class=\"lx\" data-t=\"osmotic-tide\">Tides<\/span>, and the <span class=\"lx\" data-t=\"register\">registers<\/span> are purged, and old debts are re-read, and every line in every <span class=\"lx\" data-t=\"ledger\">Ledger<\/span> in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> is read aloud as though it happened yesterday. And the <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span>, at the <span class=\"lx\" data-t=\"rereading\">Rereading<\/span>, may apply to be <span class=\"lx\" data-t=\"register\">listed<\/span> again.", "terms": ["drift-season", "rereading", "great-cycle", "osmotic-tide", "register", "ledger", "the-osmotic-expanse", "unlisted"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"registrar\">Registrar<\/span>. It&#x27;s your part now. Come and say it. I&#x27;ve carried it all this way.", "terms": ["registrar"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "<i>Here the bard falls silent, and the tellers at every <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> since have told it the same way: the <span class=\"lx\" data-t=\"immunan\">Immunan<\/span> <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> of <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> stands up from behind the <span class=\"lx\" data-t=\"muster\">Muster<\/span>, with the <span class=\"lx\" data-t=\"register\">register<\/span> crystal in their hands, and walks to <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> shelf, and reads the line aloud. <span class=\"lx\" data-t=\"immunan\">Immunans<\/span> cannot lie, so nobody has ever doubted the words.<\/i>", "terms": ["hearth", "immunan", "registrar", "sump-nine", "muster", "register", "reclaimers-ash"]}, {"k": "p", "html": "<i>&quot;<span class=\"lx\" data-t=\"oro\">Oro<\/span>. Brought as a <span class=\"lx\" data-t=\"brooding\">brooded<\/span> seed from a struck colony in the <span class=\"lx\" data-t=\"lysosomal-wastes\">Lysosomal Wastes<\/span> by <span class=\"lx\" data-t=\"yarrow\">Yarrow-who-went-ahead<\/span>. <span class=\"lx\" data-t=\"ward\">Ward<\/span> of <span class=\"lx\" data-t=\"sefa\">Sefa<\/span> of the <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span>, by <span class=\"lx\" data-t=\"rite\">Rite<\/span>. <span class=\"lx\" data-t=\"hauler\">Hauler<\/span> of <span class=\"lx\" data-t=\"pump\">the Pump<\/span> of <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>. Held the north wall of the <span class=\"lx\" data-t=\"gel-moat\">gel moat<\/span> at <span class=\"lx\" data-t=\"swell\">the Swell<\/span>, and forty <span class=\"lx\" data-t=\"bud\">buds<\/span> came out from under it alive. Listed — at the <span class=\"lx\" data-t=\"rereading\">Rereading<\/span>, by the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> of <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> — as a citizen of this colony, with all its rights, from the day he was carried in. The debt of the <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span> to the <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span>: paid in full, this <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span>, from his <span class=\"lx\" data-t=\"digestion-pact\">Digestion Pact<\/span>. Witnessed by the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>. Witnessed by <span class=\"lx\" data-t=\"pump\">the Pump<\/span>. Witnessed by <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span>.&quot;<\/i>", "terms": ["oro", "brooding", "lysosomal-wastes", "yarrow", "ward", "sefa", "seven-ladders", "rite", "hauler", "pump", "sump-nine", "gel-moat", "swell", "bud", "rereading", "registrar", "brine-office", "osmotic-tide", "digestion-pact", "reclaimers-ash"]}, {"k": "p", "html": "<i>And <span class=\"lx\" data-t=\"yarrow\">Yarrow<\/span>&#x27;s last <span class=\"lx\" data-t=\"oath-box\">Oath box<\/span> — &quot;to see the child <span class=\"lx\" data-t=\"register\">listed<\/span>&quot; — is spent, at last, and <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> render her that night beside him.<\/i>", "terms": ["yarrow", "oath-box", "register", "reclaimers-ash"]}, {"k": "p", "html": "<i>And the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> of <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> sits with the <span class=\"lx\" data-t=\"reader\">Reader<\/span> while <span class=\"lx\" data-t=\"oro\">Oro<\/span> is read, as the <span class=\"lx\" data-t=\"ledger\">Ledger<\/span> says they are owed, and nobody knows what the <span class=\"lx\" data-t=\"reader\">Reader<\/span> finds in his last memory, because the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> asks her not to say, and the <span class=\"lx\" data-t=\"reader\">Reader<\/span> is <span class=\"lx\" data-t=\"reclaimers-ash\">Ash<\/span>, and keeps it.<\/i>", "terms": ["registrar", "sump-nine", "reader", "oro", "ledger", "reclaimers-ash"]}, {"k": "p", "html": "<i>But the <span class=\"lx\" data-t=\"hauler\">haulers<\/span> say — and the <span class=\"lx\" data-t=\"hauler\">haulers<\/span> are not <span class=\"lx\" data-t=\"immunan\">Immunans<\/span>, and may be lying — that the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> breathed a lullaby over him while he was read. The <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span>&#x27; lullaby. A <span class=\"lx\" data-t=\"plasmid\">plasmid<\/span> that calms a frightened body. Given at a <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span>, a long time ago, to someone who would need it.<\/i>", "terms": ["hauler", "immunan", "registrar", "seven-ladders", "plasmid", "contract-fair"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "<i>Every body is a debt. Some are paid in <span class=\"lx\" data-t=\"substrate\">Substrate<\/span>, some in labour, some in <span class=\"lx\" data-t=\"oath\">Oath<\/span>.<\/i>", "terms": ["substrate", "oath"]}, {"k": "p", "html": "<i>The ones we sing about were paid in water.<\/i>", "terms": []}, {"k": "p", "html": "<i>— here ends the trail of <span class=\"lx\" data-t=\"oro\">Oro-of-the-Seven-Ladders<\/span>, as told at the <span class=\"lx\" data-t=\"rendering\">Rendering<\/span> of <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> in the year of the <span class=\"lx\" data-t=\"rereading\">Rereading<\/span>, and at every <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> since that would have it.<\/i>", "terms": ["oro", "rendering", "sump-nine", "rereading", "hearth"]}]}</script>

    el.style.transform = "translateX(" + (-pw - ow / 2) + "px)";
    // context: the sentence around the word
    var a = RS.i, z = RS.i; while (a > 0 && !/[.!?…]["”’]?$/.test(RS.words[a - 1].w) && RS.i - a < 25) a--; while (z < RS.words.length - 1 && !/[.!?…]["”’]?$/.test(RS.words[z].w) && z - RS.i < 25) z++;
    $("rsCtx").textContent = RS.on ? "" : RS.words.slice(a, z + 1).map(function (x) { return x.w; }).join(" ");
    $("rsInfo").textContent = Math.round(RS.i / RS.words.length * 100) + "% · " + S.wpm + " words a minute";
    if (!RS.on && it.t) showCard(it.t, $("rsStage"), false); else hideCard(true);
  }
  function rsvpTick() {
    if (!RS.on) return;
    var it = RS.words[RS.i]; if (!it) { rsvpPause(); return; }
    rsvpShow();
    var ms = 60000 / S.wpm; if (/[,;:—]$/.test(it.w)) ms *= 1.6; if (/[.!?…]["”’]?$/.test(it.w)) ms *= 2.3; if (it.w.length > 9) ms *= 1.3; if (it.para) ms *= 2.6; if (it.t && !KNOWN[it.t]) ms *= 1.4;
    RS.i++; RS.timer = setTimeout(rsvpTick, ms);
  }
  function rsvpPlay() { RS.on = true; hideCard(true); $("rsPlay").textContent = "⏸ Pause"; rsvpTick(); }
  function rsvpPause() { RS.on = false; clearTimeout(RS.timer); if (RS.i > 0) RS.i--; $("rsPlay").textContent = "▶ Play"; rsvpShow(); }
  function rsvpExit() {
    rsvpPause(); hideCard(true); var it = RS.words[RS.i]; $("rsvp").hidden = true;
    if (it) { setCur(BLOCKS[it.b]); BLOCKS[it.b].scrollIntoView({ block: "center" }); }
  }
  function rsvpJump(dir) {
    var i = RS.i + dir;
    if (dir < 0) { i = Math.max(0, RS.i - 2); while (i > 0 && !/[.!?…]["”’]?$/.test(RS.words[i - 1].w)) i--; }
    else { while (i < RS.words.length - 1 && !/[.!?…]["”’]?$/.test(RS.words[i - 1] ? RS.words[i - 1].w : "")) i++; }
    RS.i = Math.max(0, Math.min(RS.words.length - 1, i)); rsvpShow();
  }
  $("bRsvp").onclick = function () {
    closePanels(); ttsStop();
    var start = cur || blockAtView();
    RS.words = collectWords(+start.dataset.i); RS.i = 0;
    $("rsvp").innerHTML = '<div class="stage" id="rsStage"><span class="w" id="rsW"></span></div><div class="ctx" id="rsCtx"></div>' +
      '<div class="ctl"><button id="rsBack">⏪ Sentence</button><button id="rsPlay">▶ Play</button><button id="rsFwd">Sentence ⏩</button>' +
      '<label class="info">Speed <input id="rsWpm" type="range" min="120" max="800" step="20" value="' + S.wpm + '"></label><button id="rsExit">✕ Back to the page</button></div>' +
      '<div class="info" id="rsInfo"></div><div class="info">Space: play / pause · ← → sentence · Esc: back to the page. Coloured underline = a term; pause on it to see its card.</div>';
    $("rsvp").hidden = false; rsvpShow();
  };
  $("rsvp").addEventListener("click", function (e) {
    var id = e.target.id;
    if (id === "rsPlay") RS.on ? rsvpPause() : rsvpPlay();
    if (id === "rsBack") rsvpJump(-1); if (id === "rsFwd") rsvpJump(1); if (id === "rsExit") rsvpExit();
  });
  $("rsvp").addEventListener("input", function (e) { if (e.target.id === "rsWpm") { S.wpm = +e.target.value; save(); if (!RS.on) rsvpShow(); } });
  document.addEventListener("keydown", function (e) {
    if ($("rsvp").hidden) return;
    if (e.key === " ") { e.preventDefault(); RS.on ? rsvpPause() : rsvpPlay(); }
    else if (e.key === "ArrowLeft") rsvpJump(-1); else if (e.key === "ArrowRight") rsvpJump(1); else if (e.key === "Escape") rsvpExit();
  });

  /* ---------- download the complete web page ---------- */
  $("bDl").onclick = function () {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([SRC], { type: "text/html" }));
    a.download = (DOC.id || "osmotic-reader") + ".html"; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  };

  /* ---------- inside the apps: full-window toggle ---------- */
  if (window.parent !== window) {
    var full = false, fb = document.createElement("button");
    fb.className = "tb"; fb.id = "bFull"; fb.title = "Full window (F)"; fb.textContent = "⛶ Full window";
    $("bDl").parentNode.insertBefore(fb, $("bDl"));
    fb.onclick = function () { full = !full; fb.textContent = full ? "⤡ Exit full window" : "⛶ Full window"; fb.setAttribute("aria-pressed", full ? "true" : "false"); try { parent.postMessage({ oxReaderFull: full }, "*"); } catch (e) {} };
    document.addEventListener("keydown", function (e) { if (e.target.matches("input,select,textarea") || !$("rsvp").hidden || e.ctrlKey || e.metaKey) return; if (e.key.toLowerCase() === "f") fb.click(); });
  }

  apply();
  window.OXREADER = { doc: DOC, settings: S, showCard: showCard };   // for tests
})();

</script>
</body></html>
