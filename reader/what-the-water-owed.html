/* Osmotic Expanse Reader */
:root{--fs:19px;--lh:1.7;--mw:46rem;--font:'Literata',Georgia,'Times New Roman',serif;
  --bg:#0b1118;--panel:#121b26;--ink:#e6edf4;--dim:#9aaabb;--line:#253445;--acc:#5ee6d0;--hl:rgba(94,230,208,.18);--word:#ffe28a;--wordink:#1a1205}
body[data-theme=paper]{--bg:#fbf8f1;--panel:#f1ece0;--ink:#1d1a16;--dim:#5f584d;--line:#d8cfbc;--acc:#0d7b6c;--hl:rgba(13,123,108,.14);--word:#ffd84a;--wordink:#1a1205}
body[data-theme=sepia]{--bg:#f3e6cf;--panel:#eadbc0;--ink:#3b2d1c;--dim:#6e5a40;--line:#d4c09d;--acc:#8a4b12;--hl:rgba(138,75,18,.14);--word:#f7c948;--wordink:#2b1d0c}
body[data-theme=contrast]{--bg:#000;--panel:#0d0d0d;--ink:#fff;--dim:#e0e0e0;--line:#888;--acc:#ffff00;--hl:rgba(255,255,0,.25);--word:#ffff00;--wordink:#000}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font-weight:400;color:var(--dim);margin-left:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ib,.tb{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:38px}
.ib{font-size:18px;width:42px}
.tb[aria-pressed=true],.ib[aria-pressed=true]{border-color:var(--acc);color:var(--acc);background:var(--hl)}
.tb:focus-visible,.ib:focus-visible,.lx:focus-visible,.chip:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (max-width:820px){.tb span{display:none}}
.legend{position:sticky;top:55px;z-index:25;display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px}
.legend .lg{border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center;background:transparent}
.legend .lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend .lg[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.legend .sp{flex:1}
main{padding:28px 18px 120px}
.doc{max-width:var(--mw);margin:0 auto;font-family:var(--font);font-size:var(--fs);line-height:var(--lh)}
.doc h1{font-size:2.1em;line-height:1.15;margin:.2em 0 .1em;letter-spacing:.01em}
.doc h2{font-size:1.45em;line-height:1.25;margin:2.2em 0 .2em;border-top:1px solid var(--line);padding-top:1.1em}
.doc h3{font-size:1.02em;font-weight:400;font-style:italic;color:var(--dim);margin:.2em 0 1em}
.doc blockquote{margin:1.2em 0;padding:.2em 1.1em;border-left:3px solid var(--acc);color:var(--dim);font-style:italic}
.doc hr{border:0;text-align:center;margin:2em 0}
.doc hr::after{content:'· · ·';color:var(--dim);letter-spacing:.6em}
.doc p,.doc li{margin:0 0 1em}
.doc table{border-collapse:collapse;width:100%;font-size:.85em;margin:1em 0}
.doc td,.doc th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.doc pre{white-space:pre-wrap;font-size:.8em;background:var(--panel);padding:10px;border-radius:8px}
.blk{position:relative;border-radius:8px;transition:opacity .2s}
/* terms */
.lx{border-radius:3px;cursor:help;transition:background .15s}
body.uline .lx.first{text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:var(--c,var(--acc))}
body.uline-all .lx{text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:var(--c,var(--acc))}
body.hi .lx.on{background:color-mix(in srgb,var(--c) 26%,transparent);box-shadow:inset 0 -2px 0 var(--c);padding:0 1px}
body.hi.known-fade .lx.on.known{background:transparent;box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--c) 45%,transparent)}
.lx.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{background:var(--c);color:#000}}
/* paragraph chips */
.chips{display:none;flex-wrap:wrap;gap:4px;margin:-.6em 0 1em;font-family:system-ui,sans-serif;font-size:12px;line-height:1.2}
body.chips-on .chips{display:flex}
.chip{border:1px solid var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:999px;padding:2px 8px}
@media (min-width:1180px){body.chips-on .chips{position:absolute;left:calc(-12.5rem);top:.2em;width:11.5rem;margin:0;justify-content:flex-end}}
/* card */
.card{position:fixed;z-index:60;max-width:min(26rem,92vw);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--c,var(--acc));border-radius:12px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.45);font:14.5px/1.45 system-ui,sans-serif}
.card h4{margin:0 26px 2px 0;font:700 18px/1.25 var(--font)}
.card .cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--acc));font-weight:700}
.card p{margin:.5em 0}
.card .src{font-size:12px;color:var(--dim)}
.card .see{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.card .x{position:absolute;right:8px;top:6px;border:0;background:transparent;font-size:18px;color:var(--dim)}
.card .acts{display:flex;gap:6px;margin-top:8px}
.card .acts button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 8px;font-size:12px}
/* panels */
.panel{position:fixed;top:55px;bottom:0;z-index:40;width:min(21rem,88vw);overflow:auto;background:var(--panel);border:1px solid var(--line);padding:10px 12px 40px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.panel.left{left:0}.panel.right{right:0}
.panel h3{margin:4px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.panel a,.panel button.row{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:6px 8px;color:var(--ink);text-decoration:none}
.panel a:hover,.panel button.row:hover,.panel a.cur{background:var(--hl)}
.panel .grp{margin:10px 0 2px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
.panel .grp i{width:10px;height:10px;border-radius:50%}
.panel .row small{color:var(--dim);margin-left:6px}
/* display settings */
.pop{position:fixed;top:58px;right:10px;z-index:45;width:min(23rem,94vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.pop h3{margin:0 0 8px;font-size:14px}
.pop .r{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}
.pop label{min-width:6.5rem;color:var(--dim);font-size:13px}
.pop input[type=range]{flex:1}
.pop select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;flex:1}
.seg{display:flex;flex:1;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--bg)}
.pop .note{font-size:12px;color:var(--dim)}
/* reading focus */
body.focus-para .blk{opacity:.35}
body.focus-para .blk.cur{opacity:1}
.ruler{position:fixed;left:0;right:0;height:calc(var(--fs) * var(--lh) + 6px);pointer-events:none;z-index:20;background:var(--hl);border-top:1px solid var(--acc);border-bottom:1px solid var(--acc)}
/* read aloud */
.tts{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 12px 40px rgba(0,0,0,.45);max-width:96vw}
.tts button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 10px;min-height:36px}
.tts select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px;max-width:12rem}
.tts label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px}
::highlight(tts-word){background-color:var(--word);color:var(--wordink)}
.blk.reading{background:var(--hl)}
.tts-word-fallback{background:var(--word);color:var(--wordink);border-radius:3px}
/* speed read */
.rsvp{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px}
.rsvp .stage{position:relative;width:min(44rem,94vw);height:7.5rem;border-top:2px solid var(--line);border-bottom:2px solid var(--line);display:flex;align-items:center}
.rsvp .stage::before,.rsvp .stage::after{content:'';position:absolute;left:38%;width:2px;height:14px;background:var(--acc)}
.rsvp .stage::before{top:0}.rsvp .stage::after{bottom:0}
.rsvp .w{position:absolute;left:38%;white-space:pre;font:600 calc(var(--fs) * 2.4)/1 var(--font)}
.rsvp .w b{color:#ff5d5d}
.rsvp .w.term{text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:4px;text-underline-offset:8px}
.rsvp .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.rsvp .ctl button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px}
.rsvp .info{color:var(--dim);font-size:13px;text-align:center;max-width:40rem}
.rsvp .ctx{max-width:40rem;color:var(--dim);font:15px/1.5 var(--font);text-align:center;min-height:3em}
@media print{.bar,.legend,.panel,.pop,.tts,.card,.ruler,.rsvp,.chips{display:none!important}body{background:#fff;color:#000}}

[hidden]{display:none!important}
@media (max-width:640px){.legend,#legend{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none}.legend .lg,#legend .lg{flex:0 0 auto;white-space:nowrap}}

.doc p.li{margin:.25em 0 .25em 1.2em;text-indent:-1.1em;padding-left:.1em}.doc p.li.sub{margin-left:2.6em}

<script id="docdata" type="application/json">{"id": "what-the-water-owed", "title": "WHAT THE WATER OWED", "level": "player", "cats": {"person": {"label": "People", "color": "#f2b36b"}, "place": {"label": "Places", "color": "#6fc3df"}, "time": {"label": "Time", "color": "#b49cf2"}, "lineage": {"label": "Lineages & bodies", "color": "#7ee0a1"}, "faction": {"label": "Factions & offices", "color": "#f08a8a"}, "society": {"label": "Society & custom", "color": "#e5d36a"}, "rule": {"label": "Rules & mechanics", "color": "#5ee6d0"}}, "terms": {"pulse-cycle": {"name": "Pulse Cycle", "cat": "time", "def": "About six seconds — one round of a fight, in which every organism takes its turn.", "see": ["metabolic-time"], "src": "CORE §4.2, §8.1"}, "fugue-interval": {"name": "Fugue Interval", "cat": "time", "def": "About an hour. A short rest, one leg of travel, or most of a scene takes one Fugue Interval.", "see": ["beat"], "src": "CORE §8.1"}, "beat": {"name": "Beat", "cat": "time", "def": "A day: 24 Fugue Intervals, 20 of them lit and 4 of them dim. Wages, rent and rations are counted by the Beat.", "see": ["dim", "fugue-interval"], "src": "CORE §8.1"}, "dim": {"name": "dim", "cat": "time", "def": "The four dark hours at the end of every Beat: curfew, sleep, and the time when smugglers, lovers and the night pumps move.", "see": ["beat"], "src": "CORE §8.1; QUORUM §16.1"}, "pulse-ten": {"name": "Pulse Ten", "cat": "time", "def": "Ten Beats — the colonies' week. Three Pulse Tens make a Drift Season.", "see": ["drift-season"], "src": "QUORUM §12.1 (an app and colony convention)"}, "drift-season": {"name": "Drift Season", "cat": "time", "def": "About 30 Beats — a season. Currents reroute and contracts rewrite. Each phase of the Tide lasts one Drift Season.", "see": ["osmotic-tide"], "src": "CORE §8.1"}, "osmotic-tide": {"name": "Osmotic Tide", "cat": "time", "def": "The year: four Drift Seasons in which the whole world's saltiness swings — Isotonic Rise, Hypertonic Zenith, Isotonic Fall, Hypotonic Zenith — and every region changes with it.", "see": ["isotonic-rise", "hypertonic-zenith", "isotonic-fall", "hypotonic-zenith"], "src": "CORE §8.1; CODEX §5.3"}, "great-cycle": {"name": "Great Cycle", "cat": "time", "def": "Sixteen Tides — a generation. At its end comes the Rereading, when registers are purged and old debts re-read.", "see": ["rereading"], "src": "CODEX §5.1"}, "isotonic-rise": {"name": "Isotonic Rise", "cat": "time", "def": "The spring of the Tide: the water is gentle, travel is cheap, and everyone signs contracts. Its festival is the Contract Fair.", "see": ["contract-fair"], "src": "CODEX §5.3"}, "hypertonic-zenith": {"name": "Hypertonic Zenith", "cat": "time", "def": "The salt season: the whole world turns salty and water leaves every body that cannot hold it. The dense rich thrive; the watery poor shrink. Its festival is the Salt Vigil.", "see": ["salt-vigil", "dry", "swollen"], "src": "CODEX §5.3; QUORUM §5.3"}, "isotonic-fall": {"name": "Isotonic Fall", "cat": "time", "def": "The autumn of the Tide: recovery, harvest and mourning. Its festival is the Rendering.", "see": ["rendering"], "src": "CODEX §5.3"}, "hypotonic-zenith": {"name": "Hypotonic Zenith", "cat": "time", "def": "The wet season: water floods into every body. The poor grow strong, the rich bloat, raids and swarms spread. Its festival is the Swell.", "see": ["swell"], "src": "CODEX §5.3; QUORUM §5.3"}, "contract-fair": {"name": "Contract Fair", "cat": "society", "def": "The Isotonic Rise festival (3 Beats): debts signed, Oaths sworn, couples conjugate, offices are chosen for the Tide. An Oath sworn here costs nothing to swear.", "see": ["oath", "conjugation"], "src": "QUORUM §12.1"}, "salt-vigil": {"name": "Salt Vigil", "cat": "society", "def": "The Hypertonic Zenith festival: fasting and rationing, water rights read aloud, the Deep Choir's long note, arrears audited and duels fought in the open.", "see": ["oath-duel", "long-note"], "src": "QUORUM §12.1"}, "rendering": {"name": "Rendering", "cat": "society", "def": "The Isotonic Fall festival (2 Beats): the year's dead are read by the Ash and rendered, so nothing of them is wasted, and their last memories are honoured.", "see": ["reclaimers-ash", "reader"], "src": "QUORUM §12.1"}, "swell": {"name": "Swell", "cat": "society", "def": "The Hypotonic Zenith carnival (a Pulse Ten): masks are lawful, the poor rule the streets, current-races run, and every Issue the Pump backs starts stronger.", "see": ["hypotonic-zenith", "pump"], "src": "QUORUM §12.1"}, "rereading": {"name": "Rereading", "cat": "society", "def": "Once every Great Cycle, every register is purged and every old debt re-read. The Unlisted may ask to be listed again.", "see": ["great-cycle", "unlisted"], "src": "CODEX §5.1; QUORUM §12.1"}, "hearth": {"name": "Hearth", "cat": "society", "def": "The shared warm heart of a household, hab or colony: where meals are eaten together, Rites are breathed and news is shared. Lower-case, a hearth is a registered household.", "see": ["rite", "chemotactic-rite"], "src": "QUORUM §2.1"}, "rite": {"name": "Rite", "cat": "society", "def": "A ritual with chemical weight — a shared meal, a naming, a registration, a mourning. Rites change Cohesion, moods and standing.", "see": ["chemotactic-rite"], "src": "CORE §11.6"}, "chemotactic-rite": {"name": "Chemotactic Rite", "cat": "society", "def": "A shared meal of rendered Substrate at a Hearth (1 Fugue Interval): it clears everyone's Stress, builds Cohesion and warms moods.", "see": ["hearth", "stress"], "src": "CORE §11.6"}, "oath-duel": {"name": "Oath-duel", "cat": "society", "def": "A formal duel fought in the open to settle a sworn Motion. Killing either duellist is a crime, interrupting is a scandal, watching is a legal act.", "see": ["yield", "salt-vigil"], "src": "CODEX §5.5; QUORUM §12.4"}, "long-note": {"name": "Long note", "cat": "society", "def": "The Deep Choir's pressure-song: one note sustained by Barophil throats for a whole Beat, sung at the Salt Vigil.", "see": ["deep-choir", "barophil"], "src": "QUORUM §14.1"}, "current-race": {"name": "Current-race", "cat": "society", "def": "The Swell's great sport: riding a channel current through a marked course of three checkpoints, with big bets.", "see": ["swell"], "src": "QUORUM §14.5"}, "masks": {"name": "Masks", "cat": "society", "def": "Scent-masks hide what an organism is. Normally a crime against the Sacred Code's fourth Precept; lawful during the Swell.", "see": ["swell", "sacred-code"], "src": "QUORUM §12.1"}, "stress": {"name": "Stress", "cat": "rule", "def": "Metabolic Stress: the fraying of a body's chemistry, marked on a track of 8. Too much slows you down; at 8 the body starts eating itself. Rest, a Vent or a shared meal clears it.", "see": ["vent", "chemotactic-rite"], "src": "CORE §5.8"}, "vent": {"name": "Vent", "cat": "rule", "def": "A hard exhalation of spent chemistry that clears some Stress at the cost of energy (ATP).", "see": ["stress", "atp"], "src": "CORE §5.8"}, "atp": {"name": "ATP", "cat": "rule", "def": "An organism's energy — what it burns to move, fight and work. Also a living currency: Host-Cities take their rent in it.", "see": ["vent", "host-city"], "src": "CORE §2.1"}, "substrate": {"name": "Substrate", "cat": "rule", "def": "Matter, and the Expanse's money, counted in S. A colonist's whole Beat of work is worth about 5 S.", "see": [], "src": "CORE §2.2; QUORUM §9.5"}, "cohesion": {"name": "Cohesion", "cat": "rule", "def": "How well a group's chemistry agrees, 0–10. A Cohort builds it by shared meals and kept promises; a colony has its own Colony Cohesion.", "see": ["hearth"], "src": "CORE §2.5; QUORUM §2.4"}, "oath": {"name": "Oath", "cat": "rule", "def": "A promise folded into your own chromatin, so breaking it damages your body. The Expanse's whole social contract.", "see": ["oath-box", "ledger"], "src": "CORE §11.4"}, "oath-box": {"name": "Oath box", "cat": "rule", "def": "Each organism can hold a few Oaths at once (one box each). An unspent box is a promise still waiting to be kept — and the Ash will not render a body with one.", "see": ["oath", "reclaimers-ash"], "src": "CORE §11.4; CODEX §7.4"}, "ledger": {"name": "Ledger", "cat": "rule", "def": "One page of who owes whom: owed to you, you owe, and who witnessed it. Every line is one sentence.", "see": ["oath", "digestion-pact"], "src": "QUORUM Ch. 6"}, "quorum": {"name": "Quorum", "cat": "society", "def": "How a colony decides: everyone who cares breathes signal into the Hearth air, and when the air is thick enough with one answer the whole colony knows it at once.", "see": ["quorum-speaker", "signal", "quench"], "src": "QUORUM Ch. 4"}, "signal": {"name": "Signal", "cat": "rule", "def": "The molecule organisms breathe into the air to argue a Quorum. The rich can pay for more of it — 'breathing heavily'.", "see": ["quorum"], "src": "QUORUM §4.2"}, "quench": {"name": "Quench", "cat": "rule", "def": "A political crime: an enzyme breathed into the air that destroys the other side's signal, so the Quorum is stolen. It leaves a residue that can be hunted afterwards.", "see": ["quorum"], "src": "QUORUM §4.5"}, "issue": {"name": "Issue", "cat": "rule", "def": "A question before a colony's Quorum, argued on a track until the air reaches Quorum one way or the other.", "see": ["quorum"], "src": "QUORUM §4.1"}, "convocation": {"name": "Convocation", "cat": "rule", "def": "An argument in a room with three to six parties and one Motion on the table — a market, council, trial or treaty.", "see": ["reveal", "walk"], "src": "QUORUM §4.9"}, "reveal": {"name": "Reveal", "cat": "rule", "def": "A Convocation move: produce evidence — a witnessed line, a register entry, a memory — and win a step without arguing.", "see": ["convocation"], "src": "QUORUM §4.10"}, "yield": {"name": "Yield", "cat": "rule", "def": "A chemical white flag an organism cannot fake. Whoever kills a yielding organism marks Stress on every witness — so fights and duels can end.", "see": ["oath-duel"], "src": "CORE §4.14"}, "assay": {"name": "Assay", "cat": "rule", "def": "A chemical trial: the Lysosome reads the accused's body for the truth, and the colony decides what the reading means.", "see": ["lysosome", "unlisted"], "src": "QUORUM §10.2"}, "unlisted": {"name": "Unlisted", "cat": "society", "def": "An organism struck from (or never written into) the registers: no rights, no water ration, no lawful contracts, and invisible to every tax — which is why rebels and smugglers move through them.", "see": ["register", "rereading"], "src": "CODEX §7.2; QUORUM §5.5"}, "register": {"name": "Register", "cat": "society", "def": "A colony's living record of who is 'self' — who belongs, with what lineage and Oaths. To be listed is to have rights.", "see": ["registrar", "unlisted"], "src": "CODEX §7.2"}, "dormant-cycle": {"name": "Dormant Cycle", "cat": "rule", "def": "Six hours of true sleep in a safe nest or cyst: the long rest that restores a body.", "see": [], "src": "CORE §5.10"}, "dormant": {"name": "Dormant", "cat": "rule", "def": "Unconscious: an organism with no Membrane Integrity left. A Dormant body is alive but cannot act.", "see": [], "src": "CORE §5.4"}, "frailty": {"name": "Frailty", "cat": "lineage", "def": "The weakness every lineage is born with, as much a social fact as a physical one.", "see": ["literal", "obligate-drifter"], "src": "ATLAS §2"}, "literal": {"name": "Literal", "cat": "lineage", "def": "The Immunan Frailty: they cannot be deceived by words and cannot deceive. Asked a direct question, they must answer truthfully unless an Oath forbids it — and even refusing hurts.", "see": ["immunan"], "src": "ATLAS §2"}, "obligate-drifter": {"name": "Obligate Drifter", "cat": "lineage", "def": "The Flagellan Frailty: a Flagellan that stops moving loses its strength. They cannot hold a still post, and long stillness brings 'the ache'.", "see": ["flagellan"], "src": "ATLAS §2"}, "budline": {"name": "Budline", "cat": "society", "def": "A family: everyone descended from one founding division. Budlines share a scent-root, a root name, debts and Oaths.", "see": ["bud", "root-elder", "root-name"], "src": "QUORUM §7.1"}, "bud": {"name": "Bud", "cat": "society", "def": "A new organism, made when a body divides. Buds are dependents until they come of age.", "see": ["division", "budline"], "src": "QUORUM §7.5"}, "division": {"name": "Division", "cat": "society", "def": "How organisms reproduce: one body becomes two, and both remember being one — every memory up to that moment.", "see": ["bud"], "src": "QUORUM §7.5"}, "root-elder": {"name": "Root-elder", "cat": "society", "def": "The oldest living member of a budline, who can call any member home once a Tide.", "see": ["budline"], "src": "QUORUM §7.1"}, "root-name": {"name": "Root name", "cat": "society", "def": "The ritual family part of a name — 'of the Seven Ladders' — given at the budline's Hearth.", "see": ["budline"], "src": "QUORUM §7.2"}, "ward": {"name": "Ward", "cat": "society", "def": "A dependent taken in by Rite (Wardship) and raised as one's own. At gates, 'wards' are also the living sensors that read who is self.", "see": ["register"], "src": "QUORUM §7.6"}, "plasmid": {"name": "Plasmid", "cat": "society", "def": "A small, giftable sequence — a knack or habit (like a lullaby that calms the frightened), passed body to body at a Hearth. Giving one is the deepest courtesy.", "see": ["hearth"], "src": "QUORUM §7.4"}, "conjugation": {"name": "Conjugation", "cat": "society", "def": "Two organisms linking membranes and exchanging sequence: marriage, contract and shared inheritance at once, sworn at a Hearth before both budlines.", "see": ["budline", "contract-fair"], "src": "QUORUM §7.3"}, "incubation": {"name": "Incubation", "cat": "society", "def": "Keeping watch while another organism takes its Dormant Cycle in the open — an intimate favour, because a sleeping body cannot mask what it is.", "see": ["dormant-cycle"], "src": "QUORUM §7.6"}, "cleaner-pact": {"name": "Cleaner Pact", "cat": "society", "def": "A paid arrangement with a grooming guild that keeps parasites out of your membranes.", "see": [], "src": "QUORUM §7.6"}, "brooding": {"name": "Brooding", "cat": "society", "def": "Carrying a child, sequence or seed inside your own body across water it could not cross alone.", "see": ["bud"], "src": "QUORUM §7.6"}, "digestion-pact": {"name": "Digestion Pact", "cat": "society", "def": "Selling your own future body to the Ash while you live: half its harvest value now, and they read and render you when you die.", "see": ["reclaimers-ash", "rendering"], "src": "QUORUM §7.6"}, "memory-strand": {"name": "Memory strand", "cat": "society", "def": "A sealed crystal of an organism's recorded memories, kept as an heirloom or a last message. Some open only once.", "see": ["reader"], "src": "CORE §11.7; QUORUM §14.3"}, "trail-script": {"name": "Trail-script", "cat": "society", "def": "Writing: scent laid down in sequence along a surface, read by following it.", "see": [], "src": "QUORUM §11.5"}, "dry": {"name": "Dry", "cat": "society", "def": "The rich: dense, salted organisms living in sealed pockets kept steady by pumps others work.", "see": ["condition", "hypertonic-zenith"], "src": "QUORUM §5.1"}, "settled": {"name": "Settled", "cat": "society", "def": "The middle condition: a trade, a Hearth, a little saved.", "see": ["condition"], "src": "QUORUM §5.1"}, "swollen": {"name": "Swollen", "cat": "society", "def": "The poor: dilute, water-heavy organisms in the low, wet districts — strong in the wet season, shrinking in the salt.", "see": ["condition", "pump"], "src": "QUORUM §5.1"}, "hauler": {"name": "Hauler", "cat": "society", "def": "A worker of the Pump who carries water and goods uphill. A hauler earns about 4 S a Beat.", "see": ["pump"], "src": "QUORUM §9.3"}, "nursery": {"name": "Nursery", "cat": "society", "def": "Where a colony's young buds are cared for. In many colonies every hab must feed one nursery shift.", "see": ["bud"], "src": "QUORUM §2.8"}, "hab": {"name": "Hab", "cat": "place", "def": "A dwelling cluster in a colony — a 'hab-hill' in the Mid-Strata can be the size of a hill.", "see": [], "src": "CODEX §6.3"}, "sacred-code": {"name": "Sacred Code", "cat": "society", "def": "Seven Precepts enforced as law across the Expanse — for example, nothing crosses a colony's membrane unread; the dead must be harvested; you may not lie about what you are.", "see": [], "src": "CODEX §8.2"}, "charter": {"name": "Charter", "cat": "society", "def": "A colony's founding promises — or a licence that lets a band of adventurers work outside the membrane.", "see": [], "src": "QUORUM §2.6, Ch. 15"}, "channel": {"name": "Channel", "cat": "society", "def": "An illegal pore in a colony's membrane that lets goods (or water) leak through unread. Smugglers are 'channel-makers'.", "see": ["sacred-code"], "src": "QUORUM §9.4"}, "host-city": {"name": "Host-City", "cat": "place", "def": "A Vast living organism that carries thousands of tenants in its body and migrates with the Tide. Rent is paid in ATP; its immune cells are the police.", "see": ["old-mother-brine", "rent-well"], "src": "QUORUM Ch. 13"}, "rent-well": {"name": "Rent Well", "cat": "place", "def": "Where a Host-City's tenants feed it their rent, one ATP a Beat.", "see": ["host-city"], "src": "QUORUM §13.2"}, "organ": {"name": "Organ", "cat": "society", "def": "A colony is a body with six organs — the Membrane, Pump, Vacuole, Nucleolus, Hearth and Lysosome. Every organism belongs to one.", "see": ["pump", "lysosome"], "src": "QUORUM Ch. 2"}, "membrane": {"name": "Membrane", "cat": "society", "def": "The colony's border organ: gates, registers, and who is let in.", "see": ["porter", "registrar"], "src": "QUORUM §2.1"}, "pump": {"name": "Pump", "cat": "society", "def": "The colony's labour organ: the haulers who carry goods and water uphill.", "see": ["hauler"], "src": "QUORUM §2.1, §9.3"}, "vacuole": {"name": "Vacuole", "cat": "society", "def": "The colony's stores: water rights, rations and the treasury.", "see": ["tally-keeper", "steward"], "src": "QUORUM §2.1"}, "nucleolus": {"name": "Nucleolus", "cat": "society", "def": "The colony's council organ, which reads the Quorum and keeps the colony's sequence.", "see": ["assembly", "quorum-speaker"], "src": "QUORUM §2.1"}, "lysosome": {"name": "Lysosome", "cat": "society", "def": "The colony's organ of waste, the dead and justice — where bodies are read, rendered and assayed.", "see": ["reader", "assay"], "src": "QUORUM §2.1"}, "assembly": {"name": "Assembly", "cat": "faction", "def": "The colony's seven office-holders deciding ordinary business: fifteen voices, eight to pass.", "see": ["nucleolus"], "src": "QUORUM §3.3"}, "porter": {"name": "Porter", "cat": "faction", "def": "The office that commands a colony's gates and decides who is read. Also a Warden rank.", "see": ["membrane"], "src": "CODEX §7.2; QUORUM §3.1"}, "registrar": {"name": "Registrar", "cat": "faction", "def": "The office that keeps the register — entering and erasing who is listed — and witnesses every Oath.", "see": ["register"], "src": "QUORUM §3.1"}, "tally-keeper": {"name": "Tally-Keeper", "cat": "faction", "def": "The office that sets and audits the water tally. If the tally fails, the colony can default.", "see": ["tally"], "src": "CODEX §12.2; QUORUM §3.1"}, "tally": {"name": "Tally", "cat": "society", "def": "The colony's tax and water account, assessed by hearth.", "see": ["tally-keeper"], "src": "CODEX §6.3; QUORUM §2.6"}, "steward": {"name": "Steward", "cat": "faction", "def": "The office that feeds the colony from its store and can pay a poor household's arrears.", "see": ["vacuole"], "src": "QUORUM §3.1"}, "muster": {"name": "Muster", "cat": "faction", "def": "The office that calls the colony's militia.", "see": [], "src": "QUORUM §3.1"}, "printwright": {"name": "Printwright", "cat": "faction", "def": "The office holding a colony's leased Hegemony print shop.", "see": ["ribosome-hegemony"], "src": "QUORUM §3.1"}, "reader": {"name": "Reader", "cat": "faction", "def": "An Ash reader of the dead: they open their own body around a dead one and read its last memories.", "see": ["reclaimers-ash", "rendering"], "src": "CODEX §7.4"}, "quorum-speaker": {"name": "Quorum Speaker", "cat": "faction", "def": "The organism trusted to taste the Hearth air and announce what the colony has decided. Not every Speaker is perfectly honest.", "see": ["quorum"], "src": "QUORUM §4.4"}, "ribosome-hegemony": {"name": "Ribosome Hegemony", "cat": "faction", "def": "The industrial power: foundries, licences and loans. It never breaks a contract in writing — it reinterprets one.", "see": ["brine-office"], "src": "CODEX §7.1"}, "brine-office": {"name": "Brine Office", "cat": "faction", "def": "The Hegemony's waste-logistics desk — quietly its most powerful, because it decides who gets feedstock. It also lends money.", "see": ["ribosome-hegemony"], "src": "CODEX §7.1"}, "warden-circles": {"name": "Warden Circles", "cat": "faction", "def": "The gate-keepers and register-keepers: 'nothing enters a colony that has not been read'. To be unlisted is to be outside their law.", "see": ["register"], "src": "CODEX §7.2"}, "flow-guilds": {"name": "Flow Guilds", "cat": "faction", "def": "The Flagellan currents-people: couriers, tolls and open water. They run the Currentpost.", "see": ["currentpost"], "src": "CODEX §7.3"}, "reclaimers-ash": {"name": "Reclaimers' Ash", "cat": "faction", "def": "The faith and trade of the dead: they harvest and read bodies, believing an unharvested body is a soul wasted. They will not render a body with an unkept Oath.", "see": ["reader", "rendering", "lipidpost"], "src": "CODEX §7.4"}, "deep-choir": {"name": "Deep Choir", "cat": "faction", "def": "The Barophil faith of the world's slow hardening; they sing the long note.", "see": ["long-note"], "src": "CODEX §7.6"}, "currentpost": {"name": "Currentpost", "cat": "society", "def": "The Flow Guilds' messages and passage along charted currents: one region a Beat, for a toll.", "see": ["flow-guilds"], "src": "QUORUM §11.1"}, "lipidpost": {"name": "Lipidpost", "cat": "society", "def": "The Ash's corpse-wagons: slow (a region a Tide) but impossible to search or stop, because censoring a funeral breaks the Sacred Code.", "see": ["reclaimers-ash"], "src": "QUORUM §11.1"}, "bridge-post": {"name": "Bridge post", "cat": "society", "def": "The Hegemony's registered mail on the Ribbon Bridges — reliable, and read.", "see": ["ribosome-hegemony"], "src": "QUORUM §11.1"}, "lineage": {"name": "Lineage", "cat": "lineage", "def": "One of the six peoples of the Expanse, each a body plan and a politics: Amoeban, Epithalian, Flagellan, Lysosan, Immunan, Barophil.", "see": ["frailty"], "src": "ATLAS §2"}, "amoeban": {"name": "Amoeban", "cat": "lineage", "def": "'The Unfinished': shapeless, flowing chemists, digesters and actors. Useful, never quite trusted.", "see": ["lineage"], "src": "ATLAS §2"}, "epithalian": {"name": "Epithalian", "cat": "lineage", "def": "'The Walled': sheet-bodied builders, architects and contract-signers — the lineage others call civilisation.", "see": ["lineage"], "src": "ATLAS §2"}, "flagellan": {"name": "Flagellan", "cat": "lineage", "def": "'The Rowed': finned, lashed swimmers born in the Great Flows — couriers, navigators, smugglers. They cannot keep still.", "see": ["obligate-drifter"], "src": "ATLAS §2"}, "lysosan": {"name": "Lysosan", "cat": "lineage", "def": "'The Latent': library-bodies that carry sequences not their own — brokers, spies, archivists, distrusted by Wardens.", "see": ["registered"], "src": "ATLAS §2"}, "immunan": {"name": "Immunan", "cat": "lineage", "def": "'The Registered': the lineage of recognising — wardens, registrars, witnesses. They cannot lie.", "see": ["literal"], "src": "ATLAS §2"}, "barophil": {"name": "Barophil", "cat": "lineage", "def": "'The Hardened': dense, slow, pressure-proof extremophiles who outlast everyone; the Deep Choir's singers.", "see": ["slow-reaction", "deep-choir"], "src": "ATLAS §2"}, "pheromological-messenger": {"name": "Pheromological Messenger", "cat": "lineage", "def": "A Flagellan calling: carrier of words and scents across the water, and often a storyteller.", "see": ["flagellan"], "src": "ATLAS §3"}, "pathogen-scout": {"name": "Pathogen Scout", "cat": "lineage", "def": "A Lysosan calling: a scout who can slip through a region's defences unread.", "see": ["lysosan"], "src": "ATLAS §3"}, "kinetic-striker": {"name": "Kinetic Striker", "cat": "lineage", "def": "A Flagellan fighter whose speed seems to let it arrive twice: it turns Momentum into impact, and is the reason walls have short lives.", "see": ["flagellan", "momentum"], "src": "ATLAS §3"}, "organism": {"name": "Organism", "cat": "lineage", "def": "Every person in the Expanse is an organism — a single living cell-being.", "see": ["lineage"], "src": "CORE"}, "the-osmotic-expanse": {"name": "The Osmotic Expanse", "cat": "place", "def": "The world: an interior ocean of living chemistry — the Great Vesicle — where every person is a cell-being and every law is also physics.", "see": [], "src": "CORE"}, "sump-nine": {"name": "Sump Nine", "cat": "place", "def": "A poor salvage settlement of about 1,800 organisms at a channel mouth on the Fork of the Second Flow, where wrecks wash up.", "see": ["fork-of-the-second-flow"], "src": "CORE §8.2; QUORUM §17.2"}, "fork-of-the-second-flow": {"name": "Fork of the Second Flow", "cat": "place", "def": "A branch of the Second Flow's current, running down to Sump Nine.", "see": ["sump-nine"], "src": "CORE §8.2"}, "gel-moat": {"name": "Gel moat", "cat": "place", "def": "A colony defence of thick gel; in Sump Nine the nursery sits at the warm bottom of it.", "see": [], "src": "CORE §7.5"}, "somatic-gate": {"name": "Somatic gate", "cat": "place", "def": "A living gate that reads who passes and can be talked to.", "see": ["porter"], "src": "CORE §7.5"}, "cytoplasmic-mid-strata": {"name": "Cytoplasmic Mid-Strata", "cat": "place", "def": "The heartland: suspended colony-habs tethered by cables, home to most living organisms.", "see": [], "src": "CODEX §6.3"}, "lysosomal-wastes": {"name": "Lysosomal Wastes", "cat": "place", "def": "The render-pit deserts where the Ash are strong and the dead are processed.", "see": [], "src": "CODEX §6.7"}, "lipid-plateaus": {"name": "Lipid Plateaus", "cat": "place", "def": "A desert of fat: pale congealed plateaus walked by Barophil herds.", "see": [], "src": "CODEX §6.2"}, "tallow-market": {"name": "Tallow Market", "cat": "place", "def": "A floating bazaar on the Lipid Plateaus with no registers, where you can buy someone else's Oath — and be bound by it.", "see": ["oath", "ledger"], "src": "CODEX §6.2"}, "great-flows": {"name": "Great Flows", "cat": "place", "def": "The great nutrient currents of the Expanse; the Flagellans' birthplace.", "see": ["flagellan"], "src": "CODEX §6.4"}, "peri-membrane-rim": {"name": "Peri-Membrane Rim", "cat": "place", "def": "The edge of the world, where the outer membrane is close enough to feel.", "see": [], "src": "CODEX §6.1"}, "knot-nine": {"name": "Knot Nine", "cat": "place", "def": "A city where seven Ribbon Bridges cross: a market and a courtroom.", "see": [], "src": "CODEX §6.5"}, "old-mother-brine": {"name": "Old Mother Brine", "cat": "place", "def": "A great Host-City: a slow, motherly saline giant carrying thirty thousand tenants and the Flow Guilds' headquarters.", "see": ["host-city"], "src": "QUORUM §13.5"}, "momentum": {"name": "Momentum", "cat": "rule", "def": "The charge an organism builds by moving fast: +1 die and a stronger push on its next Strike.", "see": ["kinetic-striker"], "src": "CORE §4.3"}, "vat-crew": {"name": "Vat Crew", "cat": "faction", "def": "The Ash's hard-harvest labourers: unionised, dangerous work in the render vats. Rivals of the scholarly Ash Readers.", "see": ["reclaimers-ash"], "src": "CODEX §7"}, "motion": {"name": "Motion", "cat": "society", "def": "The one question on the table in a Convocation or Quorum — the thing the room must decide.", "see": ["convocation", "oath"], "src": "QUORUM §4.9"}, "pressure": {"name": "Pressure", "cat": "rule", "def": "A Convocation move: lean on someone with threat or status. It can win a rung — but if it fails, the room turns toward Hostile and the colony's Clock advances.", "see": ["convocation", "walk"], "src": "QUORUM §4.10"}, "interior": {"name": "Interior", "cat": "society", "def": "A colony's unrest, 0–8: its Stress. It climbs when organs die, when a Quorum is stolen, when strikes begin.", "see": ["cohesion"], "src": "QUORUM §2.6"}, "room-mood": {"name": "Room mood", "cat": "rule", "def": "A Convocation room has a mood — Hungry, Grieving, Hostile and so on — that helps moves which suit it and hinders moves which don't.", "see": ["convocation"], "src": "QUORUM §4.9; CORE §11.3"}, "lisk-of-the-seven-ladders": {"name": "Lisk-of-the-Seven-Ladders", "cat": "person", "def": "The narrator: a young Flagellan messenger who tells this tale at the Rendering.", "see": ["oro"], "src": ""}, "oro": {"name": "Oro", "cat": "person", "def": "Oro-of-the-Seven-Ladders: a Swollen Flagellan hauler of Sump Nine's Pump, ward of Sefa.", "see": ["sefa", "mesk"], "src": ""}, "sefa": {"name": "Sefa", "cat": "person", "def": "Old Sefa: root-elder of the Seven Ladders budline, who leads the haulers' Hearth Rite.", "see": ["oro"], "src": ""}, "seven-ladders": {"name": "Seven Ladders", "cat": "person", "def": "A hauling budline of Sump Nine; its founder cut seven ladders up the sump's north wall.", "see": ["budline"], "src": ""}, "mesk": {"name": "Mesk", "cat": "person", "def": "Mesk-of-the-Clean-Count: an Immunan, apprentice to the Registrar — and unable to lie.", "see": ["literal", "quell"], "src": ""}, "quell": {"name": "Quell", "cat": "person", "def": "Sump Nine's Registrar: a Lysosan struck from the register in a purge, who went on keeping it anyway.", "see": ["registrar", "unlisted"], "src": ""}, "varrow": {"name": "Varrow", "cat": "person", "def": "An Amoeban Ash Reader of great age and kindness.", "see": ["reader"], "src": ""}, "yarrow": {"name": "Yarrow", "cat": "person", "def": "Yarrow-who-went-ahead: a Lysosan Pathogen Scout whose body washes into Sump Nine's channel.", "see": ["pathogen-scout"], "src": ""}, "corvane": {"name": "Corvane", "cat": "person", "def": "Corvane of the Sealed Pocket: a Dry Epithalian who wants the empty Steward's office.", "see": ["steward", "dry"], "src": ""}, "henn": {"name": "Henn", "cat": "person", "def": "Sump Nine's frightened Tally-Keeper, behind on the colony's loan.", "see": ["tally-keeper"], "src": ""}, "grue": {"name": "Grue", "cat": "person", "def": "Sump Nine's Muster: a vast, slow Barophil who sings the long note.", "see": ["muster", "barophil"], "src": ""}, "dunmore": {"name": "Dunmore", "cat": "person", "def": "A scarred old Barophil hauler of the Pump.", "see": ["hauler"], "src": ""}, "tannet": {"name": "Tannet", "cat": "person", "def": "The Epithalian keeper of Sump Nine's nursery.", "see": ["nursery"], "src": ""}, "ket": {"name": "Ket", "cat": "person", "def": "Sump Nine's Porter: a stiff Immunan at the somatic gate.", "see": ["porter"], "src": ""}, "wend": {"name": "Wend", "cat": "person", "def": "Sump Nine's Quorum Speaker: an old Lysosan, honest enough most of the time.", "see": ["quorum-speaker"], "src": ""}, "lune": {"name": "Lune", "cat": "person", "def": "A Hegemony factor from the Brine Office.", "see": ["brine-office"], "src": ""}, "drift": {"name": "Drift", "cat": "rule", "def": "~2 m of fluid, and the unit of movement.", "see": [], "src": "CORE Appendix B"}, "gene-debt": {"name": "Gene-Debt", "cat": "rule", "def": "The price a Relic takes.", "see": [], "src": "CORE Appendix B"}, "metabolic-time": {"name": "Metabolic Time", "cat": "time", "def": "How the Expanse counts time — by what bodies do: a Pulse Cycle, a Fugue Interval, a Beat, a Drift Season, a Tide. Organisms call it the Rhythm.", "see": ["beat", "osmotic-tide"], "src": "CORE §8.1"}, "walk": {"name": "Walk", "cat": "rule", "def": "A Convocation move: withdraw from the room in front of everyone, so all must answer why you left.", "see": ["convocation"], "src": "QUORUM §4.10"}, "slow-reaction": {"name": "Slow Reaction", "cat": "lineage", "def": "The Barophil Frailty: always a beat behind a fast room or a fast fight.", "see": ["barophil"], "src": "ATLAS §2"}, "registered": {"name": "Registered", "cat": "lineage", "def": "The Lysosan Frailty: every ward and gate can see they are 'not quite standard', so Wardens distrust them.", "see": ["lysosan"], "src": "ATLAS §2"}, "condition": {"name": "Condition", "cat": "society", "def": "Class, measured as concentration: the Dry (dense and rich), the Settled (the middle) and the Swollen (watery and poor).", "see": ["dry", "settled", "swollen"], "src": "QUORUM Ch. 5"}}, "blocks": [{"k": "h1", "html": "WHAT THE WATER OWED", "terms": []}, {"k": "h2", "html": "A Tale of Sump Nine, as told at the Rendering", "terms": []}, {"k": "h3", "html": "<i>The Osmotic Expanse<\/i> — a story of one Osmotic Tide", "terms": []}, {"k": "q", "html": "<i>Every body is a debt. Some are paid in <span class=\"lx\" data-t=\"substrate\">Substrate<\/span>, some in labour, some in <span class=\"lx\" data-t=\"oath\">Oath<\/span>. The ones we sing about were paid in water.<\/i><br>— a proverb of <span class=\"lx\" data-t=\"pump\">the Pump<\/span>", "terms": ["substrate", "oath", "pump"]}, {"k": "hr", "html": "", "terms": []}, {"k": "h2", "html": "THE HEARTH", "terms": []}, {"k": "p", "html": "Sit closer. No — closer than that; the old ones at the back need to smell the beginning, and a beginning is the faintest part of any trail.", "terms": []}, {"k": "p", "html": "You know where you are. This is the <span class=\"lx\" data-t=\"rendering\">Rendering<\/span>, the second <span class=\"lx\" data-t=\"beat\">Beat<\/span> of it, the <span class=\"lx\" data-t=\"isotonic-fall\">Isotonic Fall<\/span>, and the dead of <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> are hanging in <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> Rows behind you, waiting their turn to be read. You have eaten. Your <span class=\"lx\" data-t=\"stress\">Stress<\/span> is gone; the meal took it, as the meal is meant to. The <span class=\"lx\" data-t=\"reader\">Reader<\/span> is busy and the <span class=\"lx\" data-t=\"warden-circles\">Wardens<\/span> are drunk on salt-tea and the <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; children are asleep in a pile by the warm wall, and there is nothing left to do <span class=\"lx\" data-t=\"dim\">this dim<\/span> but listen.", "terms": ["rendering", "beat", "isotonic-fall", "sump-nine", "reclaimers-ash", "stress", "reader", "warden-circles", "hauler", "dim"]}, {"k": "p", "html": "So I will give you a trail.", "terms": []}, {"k": "p", "html": "My name is <span class=\"lx\" data-t=\"lisk-of-the-seven-ladders\">Lisk-of-the-Seven-Ladders<\/span>. I am a <span class=\"lx\" data-t=\"pheromological-messenger\">Pheromological Messenger<\/span>, which is a grand way of saying that I carry other people&#x27;s words across the water for money, and sometimes, when the money is bad and the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> is good, I carry one of my own. You can taste my <span class=\"lx\" data-t=\"lineage\">lineage<\/span> — the fins, the wake, the salt of the <span class=\"lx\" data-t=\"great-flows\">Great Flows<\/span> on everything I say. <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span>. A drifter. I have not stood still for more than a <span class=\"lx\" data-t=\"fugue-interval\">Fugue Interval<\/span> since I was <span class=\"lx\" data-t=\"bud\">budded<\/span>, and I will be pacing behind you before this is done. Forgive me. It is in the body.", "terms": ["lisk-of-the-seven-ladders", "pheromological-messenger", "hearth", "lineage", "great-flows", "flagellan", "fugue-interval", "bud"]}, {"k": "p", "html": "This trail belongs to <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>. Some of you were alive for it. Some of you were children in the pile by that wall. One of you — I can smell you, <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>, don&#x27;t hide behind the <span class=\"lx\" data-t=\"muster\">Muster<\/span> — one of you is <i>in<\/i> it. When I get to the part that is yours, you may stop me. You won&#x27;t. You never could stop a true thing once it started.", "terms": ["sump-nine", "registrar", "muster"]}, {"k": "p", "html": "It is the story of a <span class=\"lx\" data-t=\"hauler\">hauler<\/span> named <span class=\"lx\" data-t=\"oro\">Oro<\/span>, and the <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> that took everything from him except the one thing nobody can take from a body: what it is owed.", "terms": ["hauler", "oro", "osmotic-tide"]}, {"k": "p", "html": "Breathe in. Here is the first scent.", "terms": []}, {"k": "hr", "html": "", "terms": []}, {"k": "h2", "html": "I · THE SEVENTH LADDER", "terms": []}, {"k": "h3", "html": "<i>Isotonic Rise<\/i>", "terms": []}, {"k": "q", "html": "<i>A colony is a body. Find the <span class=\"lx\" data-t=\"organ\">organ<\/span> that is hurting, and you will find the story.<\/i><br>— the <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; Hearth-saying", "terms": ["organ", "hauler"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"pump\">Pump<\/span> woke <span class=\"lx\" data-t=\"oro\">Oro<\/span> the way it woke every <span class=\"lx\" data-t=\"hauler\">hauler<\/span> in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>: not with sound, because nobody in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> has ears worth the name, but with <i>pressure<\/i>. At the first <span class=\"lx\" data-t=\"fugue-interval\">Fugue Interval<\/span> of every lit <span class=\"lx\" data-t=\"beat\">Beat<\/span> the great <span class=\"lx\" data-t=\"somatic-gate\">somatic gate<\/span> at the channel mouth flexes, and the whole sump shudders with the water it lets in, and every body in every <span class=\"lx\" data-t=\"hab\">hab<\/span> feels the colony draw breath.", "terms": ["pump", "oro", "hauler", "sump-nine", "the-osmotic-expanse", "fugue-interval", "beat", "somatic-gate", "hab"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> was already moving when it came. He was always already moving. He had slept — if you can call it sleep — wedged in the hauler-racks of <span class=\"lx\" data-t=\"hab\">Hab<\/span> Four with his lashes trailing in the outflow, because a <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> who lies still too long wakes up with nothing in him: no strength, no Pulse, nothing but a dull grey need to be going somewhere. The old <span class=\"lx\" data-t=\"hauler\">haulers<\/span> called it <i><span class=\"lx\" data-t=\"obligate-drifter\">the ache<\/span><\/i>. <span class=\"lx\" data-t=\"oro\">Oro<\/span> had never in his life gone long enough without moving to find out what came after <span class=\"lx\" data-t=\"obligate-drifter\">the ache<\/span>. He suspected it was death, and he suspected it was boring.", "terms": ["oro", "hab", "flagellan", "hauler", "obligate-drifter"]}, {"k": "p", "html": "He was nineteen <span class=\"lx\" data-t=\"drift-season\">Drift Seasons<\/span> old that <span class=\"lx\" data-t=\"isotonic-rise\">Rise<\/span>. Young for a <span class=\"lx\" data-t=\"hauler\">hauler<\/span>, old for a <span class=\"lx\" data-t=\"ward\">ward<\/span>. He was long and pale-finned and had the narrow, hungry body of the <b><span class=\"lx\" data-t=\"swollen\">Swollen<\/span><\/b> — the water-heavy poor who lived in the low <span class=\"lx\" data-t=\"hab\">habs<\/span> by the outflows, where everything was cheap because everything was wet. You could see his condition from across the sump. Everyone could. That was the point of conditions.", "terms": ["drift-season", "isotonic-rise", "hauler", "ward", "swollen", "hab"]}, {"k": "p", "html": "The morning <span class=\"lx\" data-t=\"rite\">Rite<\/span> at the <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> was short, because <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; <span class=\"lx\" data-t=\"rite\">Rites<\/span> always were. <span class=\"lx\" data-t=\"sefa\">Old Sefa<\/span> led it, as she had led it for longer than <span class=\"lx\" data-t=\"oro\">Oro<\/span> had been alive: a slow turn around the warm stone, every body brushing every other body, a shared breath of the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>&#x27;s scent so that the day would begin with everyone smelling, a little, of each other. <i>We are one <span class=\"lx\" data-t=\"organ\">organ<\/span><\/i>, said the scent. <i>We carry what the colony cannot carry itself.<\/i>", "terms": ["rite", "hauler", "hearth", "sefa", "oro", "organ"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"sefa\">Sefa<\/span> was <span class=\"lx\" data-t=\"oro\">Oro<\/span>&#x27;s <span class=\"lx\" data-t=\"root-elder\">root-elder<\/span>. She was the oldest living <span class=\"lx\" data-t=\"organism\">organism<\/span> of the <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span> <span class=\"lx\" data-t=\"budline\">budline<\/span> — the hauling family whose founder, six <span class=\"lx\" data-t=\"great-cycle\">Great Cycles<\/span> ago, had cut seven ladders up the sump&#x27;s north wall so that water could be carried to the <span class=\"lx\" data-t=\"hab\">habs<\/span> above without waiting for the gate. There were still seven ladders. There were not many <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span> left: <span class=\"lx\" data-t=\"sefa\">Sefa<\/span>, two cousins in <span class=\"lx\" data-t=\"lysosomal-wastes\">the Wastes<\/span>, a quarrelsome aunt in <span class=\"lx\" data-t=\"knot-nine\">Knot Nine<\/span>, and <span class=\"lx\" data-t=\"oro\">Oro<\/span>. And <span class=\"lx\" data-t=\"oro\">Oro<\/span>, everyone agreed, did not smell much like a <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span>, though nobody ever said so to <span class=\"lx\" data-t=\"sefa\">Sefa<\/span>&#x27;s face.", "terms": ["sefa", "oro", "root-elder", "organism", "seven-ladders", "budline", "great-cycle", "hab", "lysosomal-wastes", "knot-nine"]}, {"k": "p", "html": "&quot;You&#x27;re thinking,&quot; she said as the <span class=\"lx\" data-t=\"rite\">Rite<\/span> broke up. Her lashes were grey and slow now; she moved like water in a cold pipe. &quot;I can smell it. It smells like rust.&quot;", "terms": ["rite"]}, {"k": "p", "html": "&quot;I&#x27;m counting,&quot; <span class=\"lx\" data-t=\"oro\">Oro<\/span> said.", "terms": ["oro"]}, {"k": "p", "html": "&quot;Counting what?&quot;", "terms": []}, {"k": "p", "html": "&quot;What we owe.&quot;", "terms": []}, {"k": "p", "html": "She made the sound that, in an old <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span>, passes for laughter: a puff of sour bubbles. &quot;You&#x27;ll never finish. Go and haul.&quot;", "terms": ["flagellan"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "Here is a <span class=\"lx\" data-t=\"beat\">Beat<\/span> in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>. I want you to have it whole, because nobody ever writes the ordinary down, and then the ordinary is gone and nobody remembers what all the songs were <i>for<\/i>.", "terms": ["beat", "sump-nine"]}, {"k": "p", "html": "Twenty <span class=\"lx\" data-t=\"fugue-interval\">Fugue Intervals<\/span> of light and four of <span class=\"lx\" data-t=\"dim\">dim<\/span>; that is a <span class=\"lx\" data-t=\"beat\">Beat<\/span>. In the first two the <span class=\"lx\" data-t=\"hearth\">Hearths<\/span> wake, the <span class=\"lx\" data-t=\"rite\">Rites<\/span> are breathed, and the <span class=\"lx\" data-t=\"membrane\">Membrane<\/span> opens its <span class=\"lx\" data-t=\"register\">registers<\/span> — the <span class=\"lx\" data-t=\"porter\">Porter<\/span>, a stiff <span class=\"lx\" data-t=\"immunan\">Immunan<\/span> called <span class=\"lx\" data-t=\"ket\">Ket<\/span>, stands at the <span class=\"lx\" data-t=\"somatic-gate\">somatic gate<\/span> and reads every <span class=\"lx\" data-t=\"organism\">organism<\/span> in or out, and the gate itself, being alive, reads them too. From the third to the tenth is the first shift. That is when <span class=\"lx\" data-t=\"pump\">the Pump<\/span> works.", "terms": ["fugue-interval", "dim", "beat", "hearth", "rite", "membrane", "register", "porter", "immunan", "ket", "somatic-gate", "organism", "pump"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"pump\">Pump<\/span> is not a machine. It is <i>us<\/i>. It is a hundred and forty <span class=\"lx\" data-t=\"hauler\">haulers<\/span> on the seven ladders and the four tow-lines, carrying sealed cysts of fresh water from the channel mouth up to the <span class=\"lx\" data-t=\"hab\">habs<\/span> on the high wall, where <span class=\"lx\" data-t=\"settled\">the Settled<\/span> live, and higher still to the sealed pockets where <span class=\"lx\" data-t=\"dry\">the Dry<\/span> live — the dense, salted, comfortable few who keep their interiors concentrated and their doors shut. Water flows down on its own. Everyone knows that. Getting it to go <i>up<\/i> costs a body.", "terms": ["pump", "hauler", "hab", "settled", "dry"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> hauled four cysts up the third ladder that morning before the shudder of the gate had faded from his skin. Each cyst was half his own weight. Each rung was a little argument between his lashes and the drift. <span class=\"lx\" data-t=\"hauler\">Haulers<\/span> learn early that you do not carry water uphill with your body; you carry it with your <i>metabolism<\/i>, <span class=\"lx\" data-t=\"atp\">ATP<\/span> burning like a lamp in your chest, and when the lamp runs low you start paying in something worse. By the fifth cyst his <span class=\"lx\" data-t=\"stress\">Stress<\/span> was rising, the faint fizzing wrongness in the membranes that every <span class=\"lx\" data-t=\"organism\">organism<\/span> learns to read in itself, and he stopped on the fourth landing to <span class=\"lx\" data-t=\"vent\">Vent<\/span> — a hard, ugly exhalation of spent chemistry that cleared his head and cost him energy he&#x27;d need later.", "terms": ["oro", "hauler", "atp", "stress", "organism", "vent"]}, {"k": "p", "html": "&quot;Don&#x27;t,&quot; said the <span class=\"lx\" data-t=\"hauler\">hauler<\/span> above him on the ladder, a scarred <span class=\"lx\" data-t=\"barophil\">Barophil<\/span> called <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> who had been hauling since before the last <span class=\"lx\" data-t=\"rereading\">Rereading<\/span> and moved like geology. &quot;<span class=\"lx\" data-t=\"vent\">Vent<\/span> at the top. Not halfway. Halfway, your body learns that halfway is where you stop.&quot;", "terms": ["hauler", "barophil", "dunmore", "rereading", "vent"]}, {"k": "p", "html": "&quot;My body learns everything,&quot; <span class=\"lx\" data-t=\"oro\">Oro<\/span> said. &quot;That&#x27;s the problem.&quot;", "terms": ["oro"]}, {"k": "p", "html": "Four <span class=\"lx\" data-t=\"substrate\">S<\/span> a <span class=\"lx\" data-t=\"beat\">Beat<\/span>, a <span class=\"lx\" data-t=\"hauler\">hauler<\/span> earns. Six if he carries uphill all shift. A colonist&#x27;s whole <span class=\"lx\" data-t=\"beat\">Beat<\/span> of work is worth five <span class=\"lx\" data-t=\"substrate\">S<\/span> to the colony; that is what the <span class=\"lx\" data-t=\"tally-keeper\">Tally-Keeper<\/span> writes in the book, and every price in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> is read against it. Four <span class=\"lx\" data-t=\"substrate\">S<\/span> feeds a <span class=\"lx\" data-t=\"swollen\">Swollen<\/span> <span class=\"lx\" data-t=\"hauler\">hauler<\/span>, if he eats at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> and sleeps in the racks and buys nothing. It does not pay a debt.", "terms": ["substrate", "beat", "hauler", "tally-keeper", "sump-nine", "swollen", "hearth"]}, {"k": "p", "html": "And the <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span> had a debt. Every <span class=\"lx\" data-t=\"budline\">budline<\/span> has a debt. Ours — I mean theirs; forgive me, the trail gets into my mouth — was a hundred <span class=\"lx\" data-t=\"substrate\">S<\/span> borrowed from the <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span>&#x27;s <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span> two <span class=\"lx\" data-t=\"great-cycle\">Great Cycles<\/span> ago, at five <span class=\"lx\" data-t=\"substrate\">S<\/span> a <span class=\"lx\" data-t=\"beat\">Beat<\/span>, to rebuild the ladders after a collapse. The principal had never been paid. The interest had been paid, <span class=\"lx\" data-t=\"beat\">Beat<\/span> after <span class=\"lx\" data-t=\"beat\">Beat<\/span>, by <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span> after <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span>, for longer than anyone alive could remember. <i>A <span class=\"lx\" data-t=\"budline\">budline<\/span>&#x27;s debt <span class=\"lx\" data-t=\"division\">divides<\/span> with it<\/i>, the saying goes, <i>and never gets smaller.<\/i> When <span class=\"lx\" data-t=\"oro\">Oro<\/span> had come of age four <span class=\"lx\" data-t=\"drift-season\">Drift Seasons<\/span> before — when <span class=\"lx\" data-t=\"sefa\">Sefa<\/span> had stood him at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> and spoken his <span class=\"lx\" data-t=\"root-name\">root name<\/span> aloud for the first time, <i><span class=\"lx\" data-t=\"oro\">Oro-of-the-Seven-Ladders<\/span><\/i> — he had inherited his share. It was written in his <span class=\"lx\" data-t=\"ledger\">Ledger<\/span> now: one line, in the column that says <i>You owe<\/i>.", "terms": ["seven-ladders", "budline", "substrate", "ribosome-hegemony", "brine-office", "great-cycle", "beat", "division", "oro", "drift-season", "sefa", "hearth", "root-name", "ledger"]}, {"k": "p", "html": "<i><span class=\"lx\" data-t=\"oro\">Oro<\/span> owes the <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span> his share of the Ladders&#x27; debt: five <span class=\"lx\" data-t=\"substrate\">S<\/span> a <span class=\"lx\" data-t=\"beat\">Beat<\/span> until the principal is paid. Witnessed by the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>.<\/i>", "terms": ["oro", "brine-office", "substrate", "beat", "registrar"]}, {"k": "p", "html": "He had read that line so many times he could smell it in his sleep.", "terms": []}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "The eleventh and twelfth <span class=\"lx\" data-t=\"fugue-interval\">Intervals<\/span> are the <span class=\"lx\" data-t=\"chemotactic-rite\">shared meal<\/span>, and in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> the <span class=\"lx\" data-t=\"charter\">charter<\/span> says that every <span class=\"lx\" data-t=\"hab\">hab<\/span> feeds one <span class=\"lx\" data-t=\"nursery\">nursery<\/span> shift, so that day <span class=\"lx\" data-t=\"oro\">Oro<\/span> ate fast and then went to the <span class=\"lx\" data-t=\"nursery\">nursery<\/span> <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> to feed the young.", "terms": ["fugue-interval", "chemotactic-rite", "sump-nine", "charter", "hab", "nursery", "oro", "hearth"]}, {"k": "p", "html": "I want to tell you about the <span class=\"lx\" data-t=\"nursery\">nursery<\/span>, because it matters later, and because if you have never fed a <span class=\"lx\" data-t=\"nursery\">nursery<\/span> you have not lived in a colony.", "terms": ["nursery"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>&#x27;s <span class=\"lx\" data-t=\"nursery\">nursery<\/span> sat at the bottom of the <span class=\"lx\" data-t=\"gel-moat\">gel moat<\/span>, where the water was warmest and the currents gentlest — forty-odd <span class=\"lx\" data-t=\"bud\">buds<\/span> of every <span class=\"lx\" data-t=\"lineage\">lineage<\/span>, none older than a <span class=\"lx\" data-t=\"drift-season\">Drift Season<\/span> or two, all of them dependents, all of them rolling through the world a little clumsier than they would one day be. They could not swear <span class=\"lx\" data-t=\"oath\">Oaths<\/span>. They could not be <span class=\"lx\" data-t=\"register\">listed<\/span> yet. They existed in the colony&#x27;s <span class=\"lx\" data-t=\"ledger\">Ledger<\/span> only as lines on their parents&#x27; pages: <i>owed care<\/i>. They smelled of milk-chemistry and fear and delight, and they were the only <span class=\"lx\" data-t=\"organism\">organisms<\/span> in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> who did not know what condition they were.", "terms": ["sump-nine", "nursery", "gel-moat", "bud", "lineage", "drift-season", "oath", "register", "ledger", "organism"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> liked them. Buds don&#x27;t ask what you are. They ask <i>what are you doing<\/i>, which is a much better question.", "terms": ["oro"]}, {"k": "p", "html": "He was teaching a squall of <span class=\"lx\" data-t=\"amoeban\">Amoeban<\/span> <span class=\"lx\" data-t=\"bud\">buds<\/span> to roll a food-cyst between them without dissolving it — <span class=\"lx\" data-t=\"amoeban\">Amoebans<\/span> are born wanting to eat everything, and the trick is to teach them that some things are for <i>passing<\/i> — when the <span class=\"lx\" data-t=\"nursery\">nursery<\/span>&#x27;s keeper, a broad-sheeted <span class=\"lx\" data-t=\"epithalian\">Epithalian<\/span> called <span class=\"lx\" data-t=\"tannet\">Tannet<\/span>, drifted over and said quietly, &quot;The protein supports are cut.&quot;", "terms": ["amoeban", "bud", "nursery", "epithalian", "tannet"]}, {"k": "p", "html": "&quot;What?&quot;", "terms": []}, {"k": "p", "html": "&quot;The lattice under the north wall of the moat. Somebody&#x27;s cut the supports. For salvage, I&#x27;d guess. Protein lattice sells.&quot; <span class=\"lx\" data-t=\"tannet\">Tannet<\/span>&#x27;s sheets were tight with anger. &quot;It&#x27;ll hold for now. If the gate flexes hard it won&#x27;t.&quot;", "terms": ["tannet"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> looked at the lattice. Somebody <i>had<\/i> cut it — neat, deliberate, the way a <span class=\"lx\" data-t=\"vat-crew\">Vat Crew<\/span> would cut a carcass. You could still smell the tool.", "terms": ["oro", "vat-crew"]}, {"k": "p", "html": "&quot;Tell the <span class=\"lx\" data-t=\"steward\">Steward<\/span>,&quot; he said.", "terms": ["steward"]}, {"k": "p", "html": "&quot;There <i>is<\/i> no <span class=\"lx\" data-t=\"steward\">Steward<\/span>,&quot; <span class=\"lx\" data-t=\"tannet\">Tannet<\/span> said. &quot;There hasn&#x27;t been since the last one went <span class=\"lx\" data-t=\"dormant\">Dormant<\/span> at the <span class=\"lx\" data-t=\"rendering\">Rendering<\/span>. Two claimants, and the <span class=\"lx\" data-t=\"assembly\">Assembly<\/span> can&#x27;t find eight voices for either. The office is empty and so is the store.&quot; The <span class=\"lx\" data-t=\"epithalian\">Epithalian<\/span>&#x27;s sheets rippled. &quot;Tell the <span class=\"lx\" data-t=\"muster\">Muster<\/span>, then. Tell the <span class=\"lx\" data-t=\"tally-keeper\">Tally-Keeper<\/span>. Tell anyone who&#x27;ll smell it. I&#x27;m not leaving forty <span class=\"lx\" data-t=\"bud\">buds<\/span> under a wall nobody&#x27;s holding up.&quot;", "terms": ["steward", "tannet", "dormant", "rendering", "assembly", "epithalian", "muster", "tally-keeper", "bud"]}, {"k": "p", "html": "That was <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>, that <span class=\"lx\" data-t=\"isotonic-rise\">Rise<\/span>. An <span class=\"lx\" data-t=\"organ\">organ<\/span> was hurting. Nobody was in charge of it. That is how most stories begin, in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span>, and how most colonies end.", "terms": ["sump-nine", "isotonic-rise", "organ", "the-osmotic-expanse"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "The second shift runs from the thirteenth <span class=\"lx\" data-t=\"fugue-interval\">Interval<\/span> to the twentieth, and at the end of it, in every colony large enough to have one, the <b><span class=\"lx\" data-t=\"quorum-speaker\">Quorum Speaker<\/span><\/b> reads the air.", "terms": ["fugue-interval", "quorum-speaker"]}, {"k": "p", "html": "You young ones from <span class=\"lx\" data-t=\"lysosomal-wastes\">the Wastes<\/span> may not have seen a <span class=\"lx\" data-t=\"quorum\">Quorum<\/span>. Let me tell you, because it is the most beautiful and the most unfair thing in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span>.", "terms": ["lysosomal-wastes", "quorum", "the-osmotic-expanse"]}, {"k": "p", "html": "A colony does not vote. A colony <i>breathes<\/i>. When there is a question before it — <i>open the gate to the refugees? sell the water rights? let the <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> build?<\/i> — every <span class=\"lx\" data-t=\"organism\">organism<\/span> who cares breathes its <span class=\"lx\" data-t=\"signal\">signal<\/span> into the air of the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>. <span class=\"lx\" data-t=\"signal\">Signal<\/span> is a molecule; it accumulates. And when the air is thick enough with one answer, the colony <i>knows<\/i> — all at once, every body, in the chemistry under its skin. The <span class=\"lx\" data-t=\"quorum-speaker\">Quorum Speaker<\/span> only says it aloud.", "terms": ["ribosome-hegemony", "organism", "signal", "hearth", "quorum-speaker"]}, {"k": "p", "html": "That <span class=\"lx\" data-t=\"isotonic-rise\">Rise<\/span>, the question on <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>&#x27;s air was the question of the empty office: <i>who will be <span class=\"lx\" data-t=\"steward\">Steward<\/span>?<\/i> And the air was thick with one name.", "terms": ["isotonic-rise", "sump-nine", "steward"]}, {"k": "p", "html": "<i><span class=\"lx\" data-t=\"corvane\">Corvane<\/span>.<\/i>", "terms": ["corvane"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"corvane\">Corvane of the Sealed Pocket<\/span> was <span class=\"lx\" data-t=\"epithalian\">Epithalian<\/span> and <span class=\"lx\" data-t=\"dry\">Dry<\/span> — so <span class=\"lx\" data-t=\"dry\">Dry<\/span> you could taste the salt of him from the bottom of the ladders. He lived in the highest pocket on the wall, behind a pump he did not work, and he had wanted the <span class=\"lx\" data-t=\"steward\">Steward<\/span>&#x27;s office for six <span class=\"lx\" data-t=\"osmotic-tide\">Tides<\/span>. That <span class=\"lx\" data-t=\"isotonic-rise\">Rise<\/span> he was <i><span class=\"lx\" data-t=\"signal\">breathing heavily<\/span><\/i>: paying for rendered <span class=\"lx\" data-t=\"signal\">signal<\/span>, cyst after cyst of it, poured into the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> air on his behalf by servants who smelled of nothing at all. That is lawful. That is what it means to be <span class=\"lx\" data-t=\"dry\">Dry<\/span>. An <span class=\"lx\" data-t=\"organism\">organism<\/span> with more <span class=\"lx\" data-t=\"atp\">ATP<\/span> can breathe more <span class=\"lx\" data-t=\"signal\">signal<\/span>. The <span class=\"lx\" data-t=\"swollen\">Swollen<\/span> can breathe as hard as they like; <span class=\"lx\" data-t=\"dry\">the Dry<\/span> can buy the air.", "terms": ["corvane", "epithalian", "dry", "steward", "osmotic-tide", "isotonic-rise", "signal", "hearth", "organism", "atp", "swollen"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"quorum-speaker\">Speaker<\/span> that season was an old <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> called <span class=\"lx\" data-t=\"wend\">Wend<\/span> — Honesty four, the gossip went, which is to say honest enough most of the time and not quite honest enough when it mattered. <span class=\"lx\" data-t=\"wend\">Wend<\/span> stood at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> at the twentieth <span class=\"lx\" data-t=\"fugue-interval\">Interval<\/span> and tasted the air and said, carefully, &quot;<span class=\"lx\" data-t=\"corvane\">Corvane<\/span> gains. Not yet <span class=\"lx\" data-t=\"quorum\">Quorum<\/span>. The air will be read again at the <span class=\"lx\" data-t=\"contract-fair\">Contract Fair<\/span>.&quot;", "terms": ["quorum-speaker", "lysosan", "wend", "hearth", "fugue-interval", "corvane", "quorum", "contract-fair"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> was silent. Every <span class=\"lx\" data-t=\"hauler\">hauler<\/span> knew what <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> wanted the <span class=\"lx\" data-t=\"steward\">Steward<\/span>&#x27;s office <i>for<\/i>. A <span class=\"lx\" data-t=\"steward\">Steward<\/span> feeds the colony from its store. A <span class=\"lx\" data-t=\"steward\">Steward<\/span> may pay a poor household&#x27;s arrears, or not. A <span class=\"lx\" data-t=\"steward\">Steward<\/span> holds the keys to the <span class=\"lx\" data-t=\"vacuole\">Vacuole<\/span>, and the <span class=\"lx\" data-t=\"vacuole\">Vacuole<\/span> holds the water.", "terms": ["hauler", "hearth", "corvane", "steward", "vacuole"]}, {"k": "p", "html": "&quot;He&#x27;ll sell it,&quot; <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> said, in his slow <span class=\"lx\" data-t=\"barophil\">Barophil<\/span> way. &quot;He&#x27;ll sell the water rights for the <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> and pay himself a percentage and call it prudence.&quot;", "terms": ["dunmore", "barophil", "osmotic-tide"]}, {"k": "p", "html": "&quot;He can&#x27;t,&quot; said one of the young ones. &quot;The <span class=\"lx\" data-t=\"charter\">charter<\/span> says the <span class=\"lx\" data-t=\"tally\">tally<\/span> isn&#x27;t negotiable.&quot;", "terms": ["charter", "tally"]}, {"k": "p", "html": "&quot;The <span class=\"lx\" data-t=\"charter\">charter<\/span>,&quot; said <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span>, &quot;is three sentences. <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> has a pocket full of lawyers.&quot;", "terms": ["charter", "dunmore", "corvane"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "At the twenty-first <span class=\"lx\" data-t=\"fugue-interval\">Interval<\/span> the light dims, and <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> closes its <span class=\"lx\" data-t=\"membrane\">Membrane<\/span> for the night, and the colony goes to its <span class=\"lx\" data-t=\"dormant-cycle\">Dormant Cycles<\/span>. Curfew. The <span class=\"lx\" data-t=\"porter\">Porter<\/span> seals the <span class=\"lx\" data-t=\"somatic-gate\">somatic gate<\/span> and the gate sleeps too, in its way.", "terms": ["fugue-interval", "sump-nine", "membrane", "dormant-cycle", "porter", "somatic-gate"]}, {"k": "p", "html": "But a <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> does not sleep in <span class=\"lx\" data-t=\"dim\">the dim<\/span>. A <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> works the night pumps, because a <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> <i>has<\/i> to move, and the colony is glad of it, and pays it two <span class=\"lx\" data-t=\"substrate\">S<\/span> less for the privilege of its sleeplessness.", "terms": ["flagellan", "dim", "substrate"]}, {"k": "p", "html": "So it was <span class=\"lx\" data-t=\"oro\">Oro<\/span> who was on the channel tow-line at the twenty-second <span class=\"lx\" data-t=\"fugue-interval\">Interval<\/span> of the first <span class=\"lx\" data-t=\"beat\">Beat<\/span> of the <span class=\"lx\" data-t=\"isotonic-rise\">Rise<\/span>, alone, in the dark, when the wreck came down the <span class=\"lx\" data-t=\"fork-of-the-second-flow\">Fork of the Second Flow<\/span> and caught in the grille of the sixth <span class=\"lx\" data-t=\"hab\">hab<\/span>&#x27;s channel.", "terms": ["oro", "fugue-interval", "beat", "isotonic-rise", "fork-of-the-second-flow", "hab"]}, {"k": "p", "html": "He smelled it before he saw it. Everyone in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> smells the dead before they see them — that particular sweet slackening of a body whose chemistry has stopped arguing with the water. But this one smelled <i>wrong<\/i>. It smelled of <span class=\"lx\" data-t=\"lysosomal-wastes\">the Wastes<\/span>, of ash and render-pits and the bitter salt of the far side of the <span class=\"lx\" data-t=\"cytoplasmic-mid-strata\">Mid-Strata<\/span>. It smelled of a long, long drift.", "terms": ["the-osmotic-expanse", "lysosomal-wastes", "cytoplasmic-mid-strata"]}, {"k": "p", "html": "And under all of it, faint as a lie, it smelled of <i>him<\/i>.", "terms": []}, {"k": "p", "html": "He told me later — he told me everything, later — that his first thought was that the water had made a mistake. That the current had picked up some ghost of his scent from the tow-line and laid it on the corpse. You could think that, if you were nineteen and frightened and alone in <span class=\"lx\" data-t=\"dim\">the dim<\/span>. But <span class=\"lx\" data-t=\"oro\">Oro<\/span> was a <span class=\"lx\" data-t=\"hauler\">hauler<\/span>. He had carried enough cysts for enough <span class=\"lx\" data-t=\"organism\">organisms<\/span> to know the difference between a scent on the outside of a thing and a scent that comes from <i>inside<\/i>.", "terms": ["dim", "oro", "hauler", "organism"]}, {"k": "p", "html": "He hauled her out of the grille. It was a her — a <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span>, long and fine-boned, with the doubled, quiet look of the latent <span class=\"lx\" data-t=\"lineage\">lineage<\/span> even in death. A <b><span class=\"lx\" data-t=\"pathogen-scout\">Pathogen Scout<\/span><\/b>, by the kit on her: the sealed sample-pouches, the scent-masking film, the travelling-graft along her spine that lets a scout pass through a region&#x27;s antigens without being read. Three <span class=\"lx\" data-t=\"beat\">Beats<\/span> dead, maybe four. Dead of something that had opened her membranes from the inside. <span class=\"lx\" data-t=\"lysosan\">Lysosans<\/span> carry sequences that are not theirs; sometimes one of them wins the argument.", "terms": ["lysosan", "lineage", "pathogen-scout", "beat"]}, {"k": "p", "html": "She had not been harvested. Nobody had read her. She had come a long way to be found, and she had been found by the only <span class=\"lx\" data-t=\"organism\">organism<\/span> in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> who smelled like she did.", "terms": ["organism", "sump-nine"]}, {"k": "p", "html": "Wound into the coils of her spine — not hidden, exactly, but tucked, the way you would tuck a letter into a coat you meant someone to find — was a <b><span class=\"lx\" data-t=\"memory-strand\">memory strand<\/span><\/b>: a sealed crystal of her own recorded moments, the kind that old <span class=\"lx\" data-t=\"budline\">budlines<\/span> keep and play back at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> on feast nights. It was warm. Strands stay warm for as long as the memory inside them still wants to be remembered.", "terms": ["memory-strand", "budline", "hearth"]}, {"k": "p", "html": "And on the seal, in <span class=\"lx\" data-t=\"trail-script\">trail-script<\/span> fine as a hair, someone had laid a name.", "terms": ["trail-script"]}, {"k": "p", "html": "<i>For the one I carried. For the <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span>&#x27; <span class=\"lx\" data-t=\"ward\">ward<\/span>.<\/i>", "terms": ["seven-ladders", "ward"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> sat in <span class=\"lx\" data-t=\"dim\">the dim<\/span> on the tow-line with a dead stranger across his lashes and read that line over and over, the way he read the line in his <span class=\"lx\" data-t=\"ledger\">Ledger<\/span>. He did not know yet that it was the first line of a second <span class=\"lx\" data-t=\"ledger\">Ledger<\/span> — the one the world keeps on you whether you want it to or not.", "terms": ["oro", "dim", "ledger"]}, {"k": "p", "html": "He knew only this: he had never once, in nineteen <span class=\"lx\" data-t=\"drift-season\">Drift Seasons<\/span>, been called a <i><span class=\"lx\" data-t=\"ward\">ward<\/span><\/i>.", "terms": ["drift-season", "ward"]}, {"k": "p", "html": "He did not tell anyone. Not that night. He laid the scout on the channel shelf and wrapped her in tow-line so the current would not take her, and he put the <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> in the pouch under his fin where <span class=\"lx\" data-t=\"hauler\">haulers<\/span> carry their <span class=\"lx\" data-t=\"substrate\">Substrate<\/span>, and he went back to work, because the night pumps do not care what you have found.", "terms": ["memory-strand", "hauler", "substrate"]}, {"k": "p", "html": "That is the first hook, friends. Hold it. It goes all the way down.", "terms": []}, {"k": "hr", "html": "", "terms": []}, {"k": "h2", "html": "II · THE CONTRACT FAIR", "terms": []}, {"k": "h3", "html": "<i>Isotonic Rise — the third Beat<\/i>", "terms": []}, {"k": "q", "html": "<i>Swear it at the <span class=\"lx\" data-t=\"contract-fair\">Fa
