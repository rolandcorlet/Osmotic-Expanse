ir<\/span>, and it costs you nothing to swear. Keep it, and it costs you everything else.<\/i><br>— <span class=\"lx\" data-t=\"contract-fair\">Contract Fair<\/span> saying", "terms": ["contract-fair"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"contract-fair\">Contract Fair<\/span> comes once a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span>, at the <span class=\"lx\" data-t=\"isotonic-rise\">Isotonic Rise<\/span>, when the water is soft and travel is cheap and everyone can afford, for three <span class=\"lx\" data-t=\"beat\">Beats<\/span>, to be generous. It is the season of promises. Debts are signed; <span class=\"lx\" data-t=\"oath\">Oaths<\/span> are sworn; <span class=\"lx\" data-t=\"bud\">buds<\/span> are named; offices are chosen for the <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> to come; and couples who want to <span class=\"lx\" data-t=\"conjugation\">conjugate<\/span> — who want to link their membranes and exchange their sequence and bind their <span class=\"lx\" data-t=\"budline\">budlines<\/span> together for good — stand at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> in front of everyone and do it.", "terms": ["contract-fair", "osmotic-tide", "isotonic-rise", "beat", "oath", "bud", "conjugation", "budline", "hearth"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>&#x27;s <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span> filled the main sump with stalls strung on cables, every one of them breathing a different smell: rendered <span class=\"lx\" data-t=\"substrate\">Substrate<\/span> from <span class=\"lx\" data-t=\"lysosomal-wastes\">the Wastes<\/span>, lipid sheet from the <span class=\"lx\" data-t=\"lipid-plateaus\">Plateaus<\/span>, cheap licensed grafts from a <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> factor&#x27;s barge, plasmid-sellers from the <span class=\"lx\" data-t=\"tallow-market\">Tallow Market<\/span> with their knacks in little sealed vials. <span class=\"lx\" data-t=\"amoeban\">Amoeban<\/span> shape-actors performed on the <span class=\"lx\" data-t=\"gel-moat\">gel moat<\/span> — becoming a <span class=\"lx\" data-t=\"warden-circles\">Warden<\/span>, becoming a <span class=\"lx\" data-t=\"hauler\">hauler<\/span>, becoming a <span class=\"lx\" data-t=\"dry\">Dry<\/span> merchant so precisely bloated with salt that the <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; children laughed until they hiccupped bubbles. A <span class=\"lx\" data-t=\"flow-guilds\">Flow Guild<\/span> courier-mother was taking bets on the <span class=\"lx\" data-t=\"current-race\">current-race<\/span> at <span class=\"lx\" data-t=\"swell\">the Swell<\/span>, two <span class=\"lx\" data-t=\"osmotic-tide\">Tides<\/span> off. There were <span class=\"lx\" data-t=\"masks\">masks<\/span> for sale, though <span class=\"lx\" data-t=\"masks\">masks<\/span> were not lawful until <span class=\"lx\" data-t=\"swell\">the Swell<\/span>, and everybody bought them anyway.", "terms": ["sump-nine", "contract-fair", "substrate", "lysosomal-wastes", "lipid-plateaus", "ribosome-hegemony", "tallow-market", "amoeban", "gel-moat", "warden-circles", "hauler", "dry", "flow-guilds", "current-race", "swell", "osmotic-tide", "masks"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> hauled through the first <span class=\"lx\" data-t=\"beat\">Beat<\/span> of it with the <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> still under his fin and the scout&#x27;s body still wrapped in tow-line on the channel shelf, and on the second <span class=\"lx\" data-t=\"beat\">Beat<\/span>, because he could not bear it any longer, he went to the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>.", "terms": ["oro", "beat", "memory-strand", "registrar"]}, {"k": "p", "html": "You will want to know about the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>, because she is the strangest <span class=\"lx\" data-t=\"organism\">organism<\/span> in this tale, and the kindest.", "terms": ["registrar", "organism"]}, {"k": "p", "html": "Her name was <span class=\"lx\" data-t=\"quell\">Quell<\/span>. She was <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> — the latent <span class=\"lx\" data-t=\"lineage\">lineage<\/span>, the library-bodies, the ones every <span class=\"lx\" data-t=\"ward\">ward<\/span> and gate in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> can see are <i>not quite standard<\/i>. <span class=\"lx\" data-t=\"lysosan\">Lysosans<\/span> are never trusted with <span class=\"lx\" data-t=\"warden-circles\">Warden<\/span> offices; the <span class=\"lx\" data-t=\"ward\">wards<\/span> will not have them. But <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> had had a purge, three <span class=\"lx\" data-t=\"osmotic-tide\">Tides<\/span> before, when a <span class=\"lx\" data-t=\"warden-circles\">Warden<\/span> circuit came through and struck from the <span class=\"lx\" data-t=\"register\">register<\/span> every <span class=\"lx\" data-t=\"organism\">organism<\/span> it could not read cleanly. <span class=\"lx\" data-t=\"quell\">Quell<\/span> had been one of the struck. She had been <b><span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span><\/b> — a body with no legal existence, outside the colony&#x27;s chemistry, owed nothing, owing nothing, unable to sign or swear or be protected. And the morning after the purge, she had gone back to the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>&#x27;s shelves anyway, and opened the <span class=\"lx\" data-t=\"register\">register<\/span>, and gone on keeping it.", "terms": ["quell", "lysosan", "lineage", "ward", "the-osmotic-expanse", "warden-circles", "sump-nine", "osmotic-tide", "register", "organism", "unlisted", "registrar"]}, {"k": "p", "html": "Nobody had stopped her. Nobody could find eight voices to stop her. The <span class=\"lx\" data-t=\"membrane\">Membrane<\/span> went on being read, the lines went on being written, and the hand that wrote them belonged to someone the lines said did not exist. That was the kind of colony <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> was.", "terms": ["membrane", "sump-nine"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"quell\">Quell<\/span>&#x27;s apprentice was at the shelves when <span class=\"lx\" data-t=\"oro\">Oro<\/span> came in. That is how this part of the story starts. That is how the best part of it starts.", "terms": ["quell", "oro"]}, {"k": "p", "html": "The apprentice was <span class=\"lx\" data-t=\"immunan\">Immunan<\/span>. You could see it from the door: the marking-glands, the clean ranked geometry of the body, the faint cold smell of a <span class=\"lx\" data-t=\"lineage\">lineage<\/span> that recognises and remembers and is never, ever wrong about what belongs. Young — younger than <span class=\"lx\" data-t=\"oro\">Oro<\/span>. Their name was <span class=\"lx\" data-t=\"mesk\">Mesk-of-the-Clean-Count<\/span>, and they were copying a <span class=\"lx\" data-t=\"register\">register<\/span> line into crystal with a stillness so complete that <span class=\"lx\" data-t=\"oro\">Oro<\/span>, who could not be still for one <span class=\"lx\" data-t=\"fugue-interval\">Interval<\/span>, found it almost obscene.", "terms": ["immunan", "lineage", "oro", "mesk", "register", "fugue-interval"]}, {"k": "p", "html": "&quot;I need the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>,&quot; <span class=\"lx\" data-t=\"oro\">Oro<\/span> said.", "terms": ["registrar", "oro"]}, {"k": "p", "html": "&quot;She&#x27;s at the <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span>,&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said, without looking up. &quot;Choosing the <span class=\"lx\" data-t=\"muster\">Muster<\/span>. What do you need?&quot;", "terms": ["contract-fair", "mesk", "muster"]}, {"k": "p", "html": "And here is the thing you must understand about <span class=\"lx\" data-t=\"immunan\">Immunans<\/span>, if you are to understand the rest of this. <span class=\"lx\" data-t=\"immunan\">Immunans<\/span> are <i><span class=\"lx\" data-t=\"literal\">Literal<\/span><\/i>. It is their <span class=\"lx\" data-t=\"frailty\">Frailty<\/span>, and it is written in their bodies. They cannot be deceived by language — a lie, to an <span class=\"lx\" data-t=\"immunan\">Immunan<\/span>, smells like what it is — but they cannot <i>use<\/i> it, either. They cannot deceive. They cannot flatter. And if you ask an <span class=\"lx\" data-t=\"immunan\">Immunan<\/span> a question, it will answer you truthfully, unless an <span class=\"lx\" data-t=\"oath\">Oath<\/span> forbids it, and even then it hurts: every sentence of refusal costs them a little <span class=\"lx\" data-t=\"stress\">Stress<\/span>, a little fraying, like a membrane pulled the wrong way.", "terms": ["immunan", "literal", "frailty", "oath", "stress"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> did not know that, that morning. He was a <span class=\"lx\" data-t=\"hauler\">hauler<\/span>. He had never talked to an <span class=\"lx\" data-t=\"immunan\">Immunan<\/span> who wasn&#x27;t reading him at a gate.", "terms": ["oro", "hauler", "immunan"]}, {"k": "p", "html": "&quot;I found a body,&quot; he said, &quot;and it had my name on it.&quot;", "terms": []}, {"k": "p", "html": "<span class=\"lx\" data-t=\"mesk\">Mesk<\/span> looked up.", "terms": ["mesk"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"mesk\">Mesk<\/span> told me, much later, that the first thing they noticed about <span class=\"lx\" data-t=\"oro\">Oro<\/span> was that he was lying — not about the body, but about being calm. He was moving, very slightly, all the time: lashes, fins, a flicker of the wake. <span class=\"lx\" data-t=\"flagellan\">Flagellans<\/span> always are. But this was more than that. This was a body that had not stopped moving since <span class=\"lx\" data-t=\"dim\">the dim<\/span>, because it did not know what would happen if it did.", "terms": ["mesk", "oro", "flagellan", "dim"]}, {"k": "p", "html": "&quot;Show me,&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said.", "terms": ["mesk"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "There was a <span class=\"lx\" data-t=\"convocation\">Convocation<\/span> over the wreck, of course. There is always a <span class=\"lx\" data-t=\"convocation\">Convocation<\/span> over a wreck.", "terms": ["convocation"]}, {"k": "p", "html": "I have told the story of that <span class=\"lx\" data-t=\"convocation\">Convocation<\/span> at other <span class=\"lx\" data-t=\"hearth\">Hearths<\/span> — the market day, <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> crew, the toll-collector who walked, the Steward-claimant who tried <span class=\"lx\" data-t=\"pressure\">Pressure<\/span> and lost the room — and you have heard it, some of you, as a lesson in how to argue. A room with five parties and one <span class=\"lx\" data-t=\"motion\">Motion<\/span>: <i>who takes the wreck in the sixth <span class=\"lx\" data-t=\"hab\">hab<\/span>&#x27;s channel?<\/i> The <span class=\"lx\" data-t=\"reclaimers-ash\">Ash<\/span> crew wanted the body; the dead are <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span>&#x27;s by licence, and <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> believe that a body left unharvested is a soul wasted. The toll-collector wanted forty <span class=\"lx\" data-t=\"substrate\">S<\/span> for the channel. The <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>&#x27;s shelf had a line — <span class=\"lx\" data-t=\"quell\">Quell<\/span> found it, <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> read it out, one rung, no roll — showing that <span class=\"lx\" data-t=\"hab\">Hab<\/span> Six had claimed the channel&#x27;s salvage at the last <span class=\"lx\" data-t=\"rereading\">Rereading<\/span>, which voided the toll. And <span class=\"lx\" data-t=\"corvane\">Corvane<\/span>, who was not yet <span class=\"lx\" data-t=\"steward\">Steward<\/span> and very much wanted to look like one, tried to seize the body <i>for the <span class=\"lx\" data-t=\"nursery\">nursery<\/span>&#x27;s feed<\/i>, and pushed too hard, and the room turned from <span class=\"lx\" data-t=\"room-mood\">Hungry<\/span> toward <span class=\"lx\" data-t=\"room-mood\">Hostile<\/span> under him like a current changing direction.", "terms": ["convocation", "hearth", "reclaimers-ash", "pressure", "motion", "hab", "substrate", "registrar", "quell", "mesk", "rereading", "corvane", "steward", "nursery", "room-mood"]}, {"k": "p", "html": "What I have not told before is the part that happened <i>after<\/i> the <span class=\"lx\" data-t=\"convocation\">Convocation<\/span>, when the <span class=\"lx\" data-t=\"motion\">Motion<\/span> was settled and <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> took the body and the room cleared.", "terms": ["convocation", "motion", "reclaimers-ash"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"reclaimers-ash\">Ash<\/span> crew&#x27;s <span class=\"lx\" data-t=\"reader\">Reader<\/span> was an <span class=\"lx\" data-t=\"amoeban\">Amoeban<\/span> called <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> — ninety <span class=\"lx\" data-t=\"beat\">Beats<\/span> a <span class=\"lx\" data-t=\"reader\">Reader<\/span>, soft-bodied and patient and terrifyingly kind, the way <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> often are. She had Read more dead than anyone in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> had met living. She laid the scout on <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> shelf, and opened her own body around the dead one&#x27;s head in that way <span class=\"lx\" data-t=\"reader\">Readers<\/span> do, and stayed so for a long time. Then she withdrew, and her colour had changed.", "terms": ["reclaimers-ash", "reader", "amoeban", "varrow", "beat", "sump-nine"]}, {"k": "p", "html": "&quot;I can&#x27;t render her,&quot; <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> said.", "terms": ["varrow"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"reclaimers-ash\">Ash<\/span> crew went still. <span class=\"lx\" data-t=\"corvane\">Corvane<\/span>, at the door, went very still indeed.", "terms": ["reclaimers-ash", "corvane"]}, {"k": "p", "html": "&quot;She has an <span class=\"lx\" data-t=\"oath-box\">Oath box<\/span> unspent,&quot; <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> said. &quot;One. Sworn and not yet kept.&quot; She turned to <span class=\"lx\" data-t=\"oro\">Oro<\/span> — not to the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>, not to the room; to <i><span class=\"lx\" data-t=\"oro\">Oro<\/span><\/i> — and said, &quot;We do not harvest a body whose <span class=\"lx\" data-t=\"oath\">Oaths<\/span> are unspent. That debt is sacred. We will keep her until it is paid, or until the <span class=\"lx\" data-t=\"rereading\">Rereading<\/span>, whichever comes first.&quot; Her voice was very gentle. &quot;Do you know what she swore, <span class=\"lx\" data-t=\"hauler\">hauler<\/span>?&quot;", "terms": ["oath-box", "varrow", "oro", "registrar", "oath", "rereading", "hauler"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> did not. He had the <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> under his fin, warm as a living thing, and he did not take it out.", "terms": ["oro", "memory-strand"]}, {"k": "p", "html": "&quot;I can tell you the shape of it,&quot; <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> said. &quot;Not the words. Only what it smelled of.&quot; She hesitated, which a <span class=\"lx\" data-t=\"reader\">Reader<\/span> almost never does. &quot;It smelled of <i>listing<\/i>. Of a name in a <span class=\"lx\" data-t=\"register\">register<\/span>. Of — <i>seeing a child written down.<\/i>&quot;", "terms": ["varrow", "reader", "register"]}, {"k": "p", "html": "The room was empty but for the four of them: the <span class=\"lx\" data-t=\"reader\">Reader<\/span>, the dead scout, the <span class=\"lx\" data-t=\"hauler\">hauler<\/span>, and <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>, who had stayed because nobody had told them to go, and who was watching <span class=\"lx\" data-t=\"oro\">Oro<\/span> the way the <span class=\"lx\" data-t=\"immunan\">Immunans<\/span> watch everything — closely, without judgement, missing nothing.", "terms": ["reader", "hauler", "mesk", "oro", "immunan"]}, {"k": "p", "html": "Afterward, outside in the noise of the <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span>, <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said: &quot;You didn&#x27;t show her the <span class=\"lx\" data-t=\"memory-strand\">strand<\/span>.&quot;", "terms": ["contract-fair", "mesk", "memory-strand"]}, {"k": "p", "html": "&quot;No.&quot;", "terms": []}, {"k": "p", "html": "&quot;Why not?&quot;", "terms": []}, {"k": "p", "html": "&quot;Because I don&#x27;t know what&#x27;s in it.&quot;", "terms": []}, {"k": "p", "html": "&quot;That&#x27;s not why,&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said. They could not help it; it was the truth, and their body put it in their mouth. &quot;You&#x27;re afraid of what&#x27;s in it.&quot;", "terms": ["mesk"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> stopped moving.", "terms": ["oro"]}, {"k": "p", "html": "It lasted perhaps a breath. For a <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span>, a breath of stillness is a long time; it is the beginning of <span class=\"lx\" data-t=\"obligate-drifter\">the ache<\/span>. <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> had never seen a <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> stop. They told me it was like watching a current decide something.", "terms": ["flagellan", "obligate-drifter", "mesk"]}, {"k": "p", "html": "&quot;Yes,&quot; <span class=\"lx\" data-t=\"oro\">Oro<\/span> said.", "terms": ["oro"]}, {"k": "p", "html": "&quot;I can&#x27;t lie to you,&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said. &quot;So I won&#x27;t tell you it&#x27;s going to be all right. I don&#x27;t know that. But I can read crystal. And I can keep a secret, as long as nobody asks me directly.&quot; A pause; a faint, cold, amused flicker in the marking-glands. &quot;Try not to let anyone ask me directly.&quot;", "terms": ["mesk"]}, {"k": "p", "html": "That was the start of it. I want you to mark that, because this is a story about love as much as it is about water, and love in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> does not begin with a look. It begins with an exchange of risks.", "terms": ["the-osmotic-expanse"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "On the third <span class=\"lx\" data-t=\"beat\">Beat<\/span> of the <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span>, <span class=\"lx\" data-t=\"oro\">Oro<\/span> gave <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> a <span class=\"lx\" data-t=\"plasmid\">plasmid<\/span>.", "terms": ["beat", "contract-fair", "oro", "mesk", "plasmid"]}, {"k": "p", "html": "You know what a <span class=\"lx\" data-t=\"plasmid\">plasmid<\/span> is. A small sequence, a knack, a little piece of what you know how to do, passed from body to body at a <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>. Not a skill — something smaller and stranger: <i>how to calm a frightened <span class=\"lx\" data-t=\"bud\">bud<\/span><\/i>, <i>how to digest lipid without cramping<\/i>, <i>how to tell when a <span class=\"lx\" data-t=\"quorum-speaker\">Speaker<\/span> is shading the air<\/i>. Giving one is the deepest courtesy there is. Refusing one, offered at a <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, is an insult your <span class=\"lx\" data-t=\"budline\">budline<\/span> will remember for a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span>.", "terms": ["plasmid", "hearth", "bud", "quorum-speaker", "budline", "osmotic-tide"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span> had a <span class=\"lx\" data-t=\"plasmid\">plasmid<\/span> that every one of them carried: a lullaby, of sorts. A pattern of pressure and scent that a <span class=\"lx\" data-t=\"hauler\">hauler<\/span> could breathe over a terrified body to slow its chemistry down. <span class=\"lx\" data-t=\"sefa\">Sefa<\/span> had given it to <span class=\"lx\" data-t=\"oro\">Oro<\/span> when he was very small, and he had used it on every <span class=\"lx\" data-t=\"bud\">bud<\/span> in the <span class=\"lx\" data-t=\"nursery\">nursery<\/span>, and on <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> once when the <span class=\"lx\" data-t=\"barophil\">Barophil<\/span> was crushed under a fallen cyst and screaming in ammonia.", "terms": ["seven-ladders", "plasmid", "hauler", "sefa", "oro", "bud", "nursery", "dunmore", "barophil"]}, {"k": "p", "html": "He gave it to <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> at the <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, at the <span class=\"lx\" data-t=\"chemotactic-rite\">shared meal<\/span>, in front of everyone. It takes a <span class=\"lx\" data-t=\"fugue-interval\">Fugue Interval<\/span>. You sit very close, and you breathe, and the other body learns.", "terms": ["mesk", "hauler", "hearth", "chemotactic-rite", "fugue-interval"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"sefa\">Sefa<\/span> watched from across the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> with her slow grey lashes and said nothing at all. But she smelled — <span class=\"lx\" data-t=\"oro\">Oro<\/span> told me — of <i>worry<\/i>, and of something much older than worry, which he did not recognise until the <span class=\"lx\" data-t=\"rendering\">Rendering<\/span>.", "terms": ["sefa", "hearth", "oro", "rendering"]}, {"k": "p", "html": "&quot;Why give me that one?&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> asked afterwards.", "terms": ["mesk"]}, {"k": "p", "html": "&quot;Because you&#x27;ll need it,&quot; <span class=\"lx\" data-t=\"oro\">Oro<\/span> said. &quot;You work for <span class=\"lx\" data-t=\"quell\">Quell<\/span>. One day they&#x27;ll come for her again. You&#x27;ll need to calm somebody down.&quot;", "terms": ["oro", "quell"]}, {"k": "p", "html": "&quot;That isn&#x27;t why either,&quot; said <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>, who could not stop telling the truth even when it was cruel and especially when it was kind.", "terms": ["mesk"]}, {"k": "p", "html": "&quot;No,&quot; <span class=\"lx\" data-t=\"oro\">Oro<\/span> agreed. &quot;It isn&#x27;t.&quot;", "terms": ["oro"]}, {"k": "p", "html": "At the end of the <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span> the air was read for the <span class=\"lx\" data-t=\"steward\">Steward<\/span>&#x27;s office, and it did not reach <span class=\"lx\" data-t=\"quorum\">Quorum<\/span>, because <span class=\"lx\" data-t=\"pump\">the Pump<\/span> breathed against <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> as hard as a hundred and forty tired bodies could breathe — which is not as hard as one rich one can pay for, but is harder than you&#x27;d think. The office stayed empty. The store stayed locked. The <span class=\"lx\" data-t=\"tally-keeper\">Tally-Keeper<\/span>, a frightened <span class=\"lx\" data-t=\"epithalian\">Epithalian<\/span> called <span class=\"lx\" data-t=\"henn\">Henn<\/span>, went on being three <span class=\"lx\" data-t=\"beat\">Beats<\/span> behind on the colony&#x27;s loan from the <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span>, and went on being frightened.", "terms": ["contract-fair", "steward", "quorum", "pump", "corvane", "tally-keeper", "epithalian", "henn", "beat", "brine-office"]}, {"k": "p", "html": "And a <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> factor called <span class=\"lx\" data-t=\"lune\">Lune<\/span>, from the <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span> itself, took a room in <span class=\"lx\" data-t=\"dry\">the Dry<\/span> pocket next to <span class=\"lx\" data-t=\"corvane\">Corvane<\/span>&#x27;s, and stayed.", "terms": ["ribosome-hegemony", "lune", "brine-office", "dry", "corvane"]}, {"k": "hr", "html": "", "terms": []}, {"k": "h2", "html": "III · UPHILL", "terms": []}, {"k": "h3", "html": "<i>Isotonic Rise, into the Drift Season<\/i>", "terms": []}, {"k": "q", "html": "<i>Downhill is free. Uphill is a body. The whole economy is the argument about whose.<\/i><br>— the <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; Hearth-saying", "terms": ["hauler"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> would not open.", "terms": ["memory-strand"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"mesk\">Mesk<\/span> could read crystal — <span class=\"lx\" data-t=\"register\">register<\/span> crystal, archive crystal, the long protein libraries that the <span class=\"lx\" data-t=\"nucleolus\">Nucleolus<\/span> keeps — but a <span class=\"lx\" data-t=\"memory-strand\">memory strand<\/span> is not an archive. It is a piece of a self, and it opens only to the self it was made for, or to a <span class=\"lx\" data-t=\"reader\">Reader<\/span> who can persuade it, and the scout had sealed hers to <i>the one I carried<\/i>. <span class=\"lx\" data-t=\"oro\">Oro<\/span> could feel it warming to him when he held it. He could not make it speak.", "terms": ["mesk", "register", "nucleolus", "memory-strand", "reader", "oro"]}, {"k": "p", "html": "&quot;It needs a <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span>,&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said. &quot;Not a <span class=\"lx\" data-t=\"reader\">Reader<\/span>. A <i><span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span><\/i>. She was one; it was made in a <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> body. It&#x27;ll want a body that smells like home.&quot;", "terms": ["lysosan", "mesk", "reader"]}, {"k": "p", "html": "&quot;<span class=\"lx\" data-t=\"quell\">Quell<\/span>,&quot; said <span class=\"lx\" data-t=\"oro\">Oro<\/span>.", "terms": ["quell", "oro"]}, {"k": "p", "html": "&quot;<span class=\"lx\" data-t=\"quell\">Quell<\/span> won&#x27;t do it.&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>&#x27;s glands flickered. &quot;I asked. She said — &quot; and here <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>&#x27;s voice did the thing it did when it was carrying someone else&#x27;s words exactly, because <span class=\"lx\" data-t=\"immunan\">Immunans<\/span> cannot paraphrase without feeling they&#x27;ve lied — &quot;<i>&#x27;I will not open another <span class=\"lx\" data-t=\"organism\">organism<\/span>&#x27;s last memory without <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> in the room. That is how you become the kind of <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> who erases things for money.&#x27;<\/i>&quot;", "terms": ["quell", "mesk", "immunan", "organism", "reclaimers-ash", "registrar"]}, {"k": "p", "html": "&quot;Then what?&quot;", "terms": []}, {"k": "p", "html": "&quot;The <span class=\"lx\" data-t=\"tallow-market\">Tallow Market<\/span>,&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said. &quot;There&#x27;s a <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> there who opens anything. <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> says she&#x27;s honest. <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> says <i>honest<\/i> the way other people say <i>dangerous<\/i>.&quot;", "terms": ["tallow-market", "mesk", "lysosan", "varrow"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"tallow-market\">Tallow Market<\/span> is three <span class=\"lx\" data-t=\"beat\">Beats<\/span> upstream and a world away: a floating bazaar on a raft of congealed fat on the edge of the <span class=\"lx\" data-t=\"lipid-plateaus\">Lipid Plateaus<\/span>, four hundred <span class=\"lx\" data-t=\"organism\">organisms<\/span>, no weapons, and — this is the point of it — <i>no <span class=\"lx\" data-t=\"register\">registers<\/span><\/i>. Nothing in the <span class=\"lx\" data-t=\"tallow-market\">Tallow Market<\/span> is read. Nobody is <span class=\"lx\" data-t=\"register\">listed<\/span>. You can buy a <span class=\"lx\" data-t=\"plasmid\">plasmid<\/span> there that was stolen from a dying elder, or a <span class=\"lx\" data-t=\"gene-debt\">Gene-Debt<\/span> that someone cannot pay, or another <span class=\"lx\" data-t=\"organism\">organism<\/span>&#x27;s <i><span class=\"lx\" data-t=\"oath\">Oath<\/span><\/i> — the obligation itself, transferred to you, binding you as if you had sworn it. It is the only place in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> where a line in a <span class=\"lx\" data-t=\"ledger\">Ledger<\/span> can change hands without a <span class=\"lx\" data-t=\"rite\">Rite<\/span>.", "terms": ["tallow-market", "beat", "lipid-plateaus", "organism", "register", "plasmid", "gene-debt", "oath", "the-osmotic-expanse", "ledger", "rite"]}, {"k": "p", "html": "A <span class=\"lx\" data-t=\"hauler\">hauler<\/span> cannot leave his shift for six <span class=\"lx\" data-t=\"beat\">Beats<\/span>. A registrar&#x27;s apprentice cannot leave the shelves. So they did what every pair of young <span class=\"lx\" data-t=\"organism\">organisms<\/span> with a secret has done since the Making: they lied about where they were going. Or rather <span class=\"lx\" data-t=\"oro\">Oro<\/span> lied, and <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> <i>didn&#x27;t say<\/i>, which for an <span class=\"lx\" data-t=\"immunan\">Immunan<\/span> is a kind of heroism. <span class=\"lx\" data-t=\"oro\">Oro<\/span> told <span class=\"lx\" data-t=\"pump\">the Pump<\/span> he was hauling a <span class=\"lx\" data-t=\"flow-guilds\">Guild<\/span> cargo uphill to the <span class=\"lx\" data-t=\"lipid-plateaus\">Plateaus<\/span> for double wages. <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> told <span class=\"lx\" data-t=\"quell\">Quell<\/span> they were going to the <span class=\"lx\" data-t=\"tallow-market\">Tallow Market<\/span> to fetch a <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> who could open a <span class=\"lx\" data-t=\"memory-strand\">strand<\/span>, and <span class=\"lx\" data-t=\"quell\">Quell<\/span> — who knew exactly what was happening, because the <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> <span class=\"lx\" data-t=\"lineage\">lineage<\/span> are information brokers to the bone — said only, &quot;Take a cleaner. The <span class=\"lx\" data-t=\"lipid-plateaus\">Plateaus<\/span> are full of parasites,&quot; and paid for a <b><span class=\"lx\" data-t=\"cleaner-pact\">Cleaner Pact<\/span><\/b> out of her own pouch, five <span class=\"lx\" data-t=\"substrate\">S<\/span> a <span class=\"lx\" data-t=\"beat\">Beat<\/span> to a little <span class=\"lx\" data-t=\"amoeban\">Amoeban<\/span> grooming-guild, so that the two of them would come back with nothing living in their membranes that hadn&#x27;t been invited.", "terms": ["hauler", "beat", "organism", "oro", "mesk", "immunan", "pump", "flow-guilds", "lipid-plateaus", "quell", "tallow-market", "lysosan", "memory-strand", "lineage", "cleaner-pact", "substrate", "amoeban"]}, {"k": "p", "html": "I tell you that so you know what <span class=\"lx\" data-t=\"quell\">Quell<\/span> was. She was <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span>. She had no rights. She paid for strangers&#x27; cleaning anyway.", "terms": ["quell", "unlisted"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "They went upstream by the <span class=\"lx\" data-t=\"currentpost\">Currentpost<\/span> lines — the <span class=\"lx\" data-t=\"flow-guilds\">Flow Guilds<\/span>&#x27; charted currents, which carry you a region a <span class=\"lx\" data-t=\"beat\">Beat<\/span> if you pay the toll, and which <span class=\"lx\" data-t=\"oro\">Oro<\/span> could ride in his sleep. <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> could not. <span class=\"lx\" data-t=\"immunan\">Immunans<\/span> are built for gates and ranks and <span class=\"lx\" data-t=\"register\">registers<\/span>, not for open water; they swim like a careful sentence. On the first night out, in <span class=\"lx\" data-t=\"dim\">the dim<\/span>, in a dead calm between two currents, <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> had to take a <span class=\"lx\" data-t=\"dormant-cycle\">Dormant Cycle<\/span> — six hours of real sleep, the long rest that every body needs — and there was no nest, no cyst, nothing secured, just the open water of the <span class=\"lx\" data-t=\"cytoplasmic-mid-strata\">Mid-Strata<\/span> and whatever drifted in it.", "terms": ["currentpost", "flow-guilds", "beat", "oro", "mesk", "immunan", "register", "dim", "dormant-cycle", "cytoplasmic-mid-strata"]}, {"k": "p", "html": "So <span class=\"lx\" data-t=\"oro\">Oro<\/span> watched them sleep.", "terms": ["oro"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"hauler\">haulers<\/span> call it <b><span class=\"lx\" data-t=\"incubation\">incubation<\/span><\/b>: one body keeping watch while another takes its <span class=\"lx\" data-t=\"dormant-cycle\">Dormant Cycle<\/span> in the open. It is a mutualism — a small, priced, chemical favour, the kind that lets a body survive among other bodies. Every <span class=\"lx\" data-t=\"incubation\">incubation<\/span> writes a line: <i>I watched over you.<\/i> It is a little debt. It is also one of the most intimate things one <span class=\"lx\" data-t=\"organism\">organism<\/span> can do for another in this world, because a body in its <span class=\"lx\" data-t=\"dormant-cycle\">Dormant Cycle<\/span> cannot mask itself. It smells of exactly what it is.", "terms": ["hauler", "incubation", "dormant-cycle", "organism"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> moved all night — he had to — circling, a slow wake around the sleeping <span class=\"lx\" data-t=\"immunan\">Immunan<\/span>. And he learned what <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> smelled of when <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> could not help it. He told me it was <i>salt and clean count and something underneath that was lonely in a way he recognised<\/i>. He told me he decided then. He told me he decided before he knew there was anything to decide.", "terms": ["oro", "immunan", "mesk"]}, {"k": "p", "html": "When <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> woke, the first thing they said, before they were fully back in their body, was: &quot;You stayed.&quot;", "terms": ["mesk"]}, {"k": "p", "html": "&quot;I can&#x27;t stop moving,&quot; <span class=\"lx\" data-t=\"oro\">Oro<\/span> said. &quot;Staying is easy. It&#x27;s all the same water.&quot;", "terms": ["oro"]}, {"k": "p", "html": "&quot;That&#x27;s a lie,&quot; said <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> sleepily. &quot;I can taste it.&quot;", "terms": ["mesk"]}, {"k": "p", "html": "&quot;Yes,&quot; said <span class=\"lx\" data-t=\"oro\">Oro<\/span>. &quot;It is.&quot;", "terms": ["oro"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"tallow-market\">Tallow Market<\/span> at the <span class=\"lx\" data-t=\"isotonic-rise\">Isotonic Rise<\/span> is a sight I wish every one of you could have. Picture a raft of pale fat the size of a <span class=\"lx\" data-t=\"hab\">hab-hill<\/span>, floating on a sea of slow sweet oil, strung with cables and lamp-moths and stalls, and every stall breathing a different temptation into the thick air. <span class=\"lx\" data-t=\"barophil\">Barophil<\/span> herders selling calves. <span class=\"lx\" data-t=\"deep-choir\">Deep Choir<\/span> pilgrims selling <i>silence<\/i> — an hour in their presence, during which your <span class=\"lx\" data-t=\"stress\">Stress<\/span> will not rise. A <span class=\"lx\" data-t=\"ribosome-hegemony\">Hegemony<\/span> auditor in a sealed suit, buying debts. An old <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> oath-broker with a hundred crystals on strings around her body, every one of them an <span class=\"lx\" data-t=\"oath\">Oath<\/span> that somebody had sworn and somebody else now owned.", "terms": ["tallow-market", "isotonic-rise", "hab", "barophil", "deep-choir", "stress", "ribosome-hegemony", "flagellan", "oath"]}, {"k": "p", "html": "&quot;That one,&quot; the oath-broker told <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>, tapping a dull crystal with her lash, &quot;is a mother&#x27;s promise to bring her <span class=\"lx\" data-t=\"bud\">bud<\/span> home from <span class=\"lx\" data-t=\"lysosomal-wastes\">the Wastes<\/span>. The mother died. The <span class=\"lx\" data-t=\"bud\">bud<\/span>&#x27;s cousin sold it to me to pay for her <span class=\"lx\" data-t=\"rendering\">Rendering<\/span>. Now <i>I<\/i> am bound to bring the <span class=\"lx\" data-t=\"bud\">bud<\/span> home. I&#x27;ll sell it to you for thirty <span class=\"lx\" data-t=\"substrate\">S<\/span>. Then you&#x27;ll be bound.&quot; She laughed. &quot;Most of what I sell is somebody&#x27;s grief. The <span class=\"lx\" data-t=\"reclaimers-ash\">Ash<\/span> call it a theft. The <span class=\"lx\" data-t=\"reclaimers-ash\">Ash<\/span> call everything a theft. You want the <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span>? Under the third cable. She opens anything. She&#x27;ll want something you didn&#x27;t know you had.&quot;", "terms": ["mesk", "bud", "lysosomal-wastes", "rendering", "substrate", "reclaimers-ash", "lysosan"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> under the third cable was very old and very small and almost entirely <i>other<\/i>: her body was crowded with sequences that were not hers, sitting in her like passengers on a skiff, and she spoke in a voice that kept changing as different ones took the tiller. She held the <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> against her and tasted it a long while.", "terms": ["lysosan", "memory-strand"]}, {"k": "p", "html": "&quot;Oh,&quot; she said finally, in a voice that was no one&#x27;s in particular. &quot;Oh, this is a <span class=\"lx\" data-t=\"brooding\">brooder&#x27;s<\/span> <span class=\"lx\" data-t=\"memory-strand\">strand<\/span>.&quot;", "terms": ["brooding", "memory-strand"]}, {"k": "p", "html": "&quot;A what?&quot; said <span class=\"lx\" data-t=\"oro\">Oro<\/span>.", "terms": ["oro"]}, {"k": "p", "html": "&quot;A <span class=\"lx\" data-t=\"brooding\">brooder<\/span>. Somebody who carried something <i>inside<\/i> across water it couldn&#x27;t cross alone. A child, usually. A sequence. A seed.&quot; The voices inside her shifted. &quot;This one carried a child from <span class=\"lx\" data-t=\"lysosomal-wastes\">the Wastes<\/span> to the <span class=\"lx\" data-t=\"cytoplasmic-mid-strata\">Mid-Strata<\/span>. She swore an <span class=\"lx\" data-t=\"oath\">Oath<\/span> to see it <span class=\"lx\" data-t=\"register\">listed<\/span>. The <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> is for the child.&quot; She looked at <span class=\"lx\" data-t=\"oro\">Oro<\/span>, and every passenger in her looked with her. &quot;I can open it. But a <span class=\"lx\" data-t=\"brooding\">brooder&#x27;s<\/span> <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> opens <i>once<\/i>, and then it is spent, and a memory spent is gone from the world. It would be better opened at a <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>. With <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> in the room. Where the dead can be honoured as they are heard.&quot; A sudden sharp voice, nothing like the others: &quot;<i>Whoever told you to bring it to the <span class=\"lx\" data-t=\"tallow-market\">Tallow Market<\/span> wanted it heard where nothing is <span class=\"lx\" data-t=\"register\">registered<\/span>. Ask yourselves why.<\/i>&quot;", "terms": ["brooding", "lysosomal-wastes", "cytoplasmic-mid-strata", "oath", "register", "memory-strand", "oro", "hearth", "reclaimers-ash", "tallow-market"]}, {"k": "p", "html": "&quot;Nobody told us,&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said. &quot;We came because <span class=\"lx\" data-t=\"quell\">Quell<\/span> wouldn&#x27;t — &quot;", "terms": ["mesk", "quell"]}, {"k": "p", "html": "They stopped. <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> had heard it too.", "terms": ["mesk"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"quell\">Quell<\/span> had not sent them. <span class=\"lx\" data-t=\"quell\">Quell<\/span> had refused. It was <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> who had said <i>the <span class=\"lx\" data-t=\"tallow-market\">Tallow Market<\/span><\/i>. It was <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> who had mentioned the <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span>. And <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> had said <i>honest<\/i> the way other people say <i>dangerous<\/i>.", "terms": ["quell", "varrow", "tallow-market", "lysosan"]}, {"k": "p", "html": "&quot;What do you want for it?&quot; <span class=\"lx\" data-t=\"oro\">Oro<\/span> asked. &quot;For not opening it.&quot;", "terms": ["oro"]}, {"k": "p", "html": "The old <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> smiled, and every passenger smiled differently.", "terms": ["lysosan"]}, {"k": "p", "html": "&quot;A line,&quot; she said. &quot;One line in your <span class=\"lx\" data-t=\"ledger\">Ledger<\/span>. <i>Owed to the old one under the third cable: one true thing, when she asks.<\/i> I collect true things. They&#x27;re worth more than <span class=\"lx\" data-t=\"substrate\">Substrate<\/span> on a raft with no <span class=\"lx\" data-t=\"register\">registers<\/span>.&quot; She held out the <span class=\"lx\" data-t=\"memory-strand\">strand<\/span>. &quot;Take your memory home, children. Open it where it can be witnessed. Whatever is in it, somebody upstream wants it <i>un<\/i>-witnessed. That&#x27;s all I know. That, and that the <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span> paid me a visit two <span class=\"lx\" data-t=\"beat\">Beats<\/span> ago, asking if anyone had come to me with a scout&#x27;s <span class=\"lx\" data-t=\"memory-strand\">strand<\/span>.&quot;", "terms": ["ledger", "substrate", "register", "memory-strand", "brine-office", "beat"]}, {"k": "p", "html": "They came home by the <span class=\"lx\" data-t=\"lipidpost\">Lipidpost<\/span> — <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span>&#x27;s corpse-wagons, which go one region a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> and stop at every <span class=\"lx\" data-t=\"rendering\">Rendering<\/span> ground and cannot be stopped or searched or censored, because censoring a funeral breaks the <span class=\"lx\" data-t=\"sacred-code\">Sacred Code<\/span>&#x27;s second <span class=\"lx\" data-t=\"sacred-code\">Precept<\/span> and every <span class=\"lx\" data-t=\"reclaimers-ash\">Ash<\/span> crew in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> would come to the funeral&#x27;s defence. It was slow. It was safe. They rode on the roof of a wagon full of the honoured dead, and the dead did not mind, and <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> sat very close to <span class=\"lx\" data-t=\"oro\">Oro<\/span> on the roof in the drift, and neither of them said anything about the <span class=\"lx\" data-t=\"ledger\">Ledger<\/span> line they now owed jointly to an old woman on a raft.", "terms": ["lipidpost", "reclaimers-ash", "osmotic-tide", "rendering", "sacred-code", "the-osmotic-expanse", "mesk", "oro", "ledger"]}, {"k": "p", "html": "They got back to <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> two <span class=\"lx\" data-t=\"beat\">Beats<\/span> into the <span class=\"lx\" data-t=\"drift-season\">Drift Season<\/span>. <span class=\"lx\" data-t=\"oro\">Oro<\/span> owed <span class=\"lx\" data-t=\"pump\">the Pump<\/span> six <span class=\"lx\" data-t=\"beat\">Beats<\/span>&#x27; wages for the shift he&#x27;d missed, and the <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span> five <span class=\"lx\" data-t=\"substrate\">S<\/span> for every one of those <span class=\"lx\" data-t=\"beat\">Beats<\/span>, and an old <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> one true thing. His <span class=\"lx\" data-t=\"ledger\">Ledger<\/span> had three lines in the <i>You owe<\/i> column now. A <span class=\"lx\" data-t=\"swollen\">Swollen<\/span> <span class=\"lx\" data-t=\"organism\">organism<\/span> may carry three. He was full.", "terms": ["sump-nine", "beat", "drift-season", "oro", "pump", "brine-office", "substrate", "lysosan", "ledger", "swollen", "organism"]}, {"k": "p", "html": "And <span class=\"lx\" data-t=\"sefa\">Sefa<\/span>, at the <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, had begun to cough salt.", "terms": ["sefa", "hauler", "hearth"]}, {"k": "hr", "html": "", "terms": []}, {"k": "h2", "html": "IV · THE SALT VIGIL", "terms": []}, {"k": "h3", "html": "<i>Hypertonic Zenith<\/i>", "terms": []}, {"k": "q", "html": "<i>Salt calls salt. Water finds the floor.<\/i><br>— proverb of <span class=\"lx\" data-t=\"dry\">the Dry<\/span>, and of <span class=\"lx\" data-t=\"swollen\">the Swollen<\/span>, meaning opposite things", "terms": ["dry", "swollen"]}, {"k": "p", "html": "Let me tell you what the <span class=\"lx\" data-t=\"hypertonic-zenith\">Hypertonic Zenith<\/span> does to a colony, for those of you who have only ever lived in the soft <span class=\"lx\" data-t=\"cytoplasmic-mid-strata\">Mid-Strata<\/span> seasons.", "terms": ["hypertonic-zenith", "cytoplasmic-mid-strata"]}, {"k": "p", "html": "Once a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span>, for a <span class=\"lx\" data-t=\"drift-season\">Drift Season<\/span>, the whole world turns salty. It is the <span class=\"lx\" data-t=\"osmotic-tide\">Osmotic Tide<\/span> at its peak: every region of <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> goes hypertonic, and water — which always flows toward salt, always, it is the oldest law there is — begins to leave every body that does not hold enough salt to keep it. The dense survive. The <span class=\"lx\" data-t=\"dry\">Dry<\/span>, in their sealed pockets, with their stored minerals and their concentrated interiors, barely notice; they close their doors and drink their salt-tea and are, if anything, a little more comfortable than usual. The <span class=\"lx\" data-t=\"swollen\">Swollen<\/span> <i>shrink<\/i>. The water goes out of them like breath. They move slower. They heal half as fast. Every <span class=\"lx\" data-t=\"drift\">Drift<\/span> costs them more. The old ones, whose membranes have thinned with age, can lose more water in a <span class=\"lx\" data-t=\"beat\">Beat<\/span> than they can drink.", "terms": ["osmotic-tide", "drift-season", "the-osmotic-expanse", "dry", "swollen", "drift", "beat"]}, {"k": "p", "html": "At the <span class=\"lx\" data-t=\"hypertonic-zenith\">Zenith<\/span>, the colony holds the <b><span class=\"lx\" data-t=\"salt-vigil\">Salt Vigil<\/span><\/b>: a <span class=\"lx\" data-t=\"beat\">Beat<\/span> and <span class=\"lx\" data-t=\"dim\">a dim<\/span> of fasting and rationing, when the water rights of every household are read aloud from the <span class=\"lx\" data-t=\"vacuole\">Vacuole<\/span>&#x27;s crystal and every <span class=\"lx\" data-t=\"organism\">organism<\/span> learns, publicly, how much water it is owed. The <span class=\"lx\" data-t=\"deep-choir\">Deep Choir<\/span> sings its <span class=\"lx\" data-t=\"long-note\">long note<\/span> — one pressure-song, sustained from the beginning of the <span class=\"lx\" data-t=\"beat\">Beat<\/span> to its end, by <span class=\"lx\" data-t=\"barophil\">Barophil<\/span> throats that can hold a note longer than you can hold a grudge. Arrears are audited. Thefts are tried the same night. And in the open sump, where everyone can watch, <span class=\"lx\" data-t=\"organism\">organisms<\/span> with a quarrel that cannot wait settle it by <b><span class=\"lx\" data-t=\"oath-duel\">duel<\/span><\/b>.", "terms": ["hypertonic-zenith", "salt-vigil", "beat", "dim", "vacuole", "organism", "deep-choir", "long-note", "barophil", "oath-duel"]}, {"k": "p", "html": "That <span class=\"lx\" data-t=\"hypertonic-zenith\">Zenith<\/span>, <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>&#x27;s water rights were read aloud, and they were <i>short<\/i>.", "terms": ["hypertonic-zenith", "sump-nine"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"henn\">Henn<\/span> the <span class=\"lx\" data-t=\"tally-keeper\">Tally-Keeper<\/span> stood at the <span class=\"lx\" data-t=\"vacuole\">Vacuole<\/span> with the crystal and read the households one by one, and with every line her sheets tightened, because she could taste what everyone could taste: the store held less than the <span class=\"lx\" data-t=\"tally\">tally<\/span> said. Not a little less. A <i>ladder&#x27;s<\/i> worth less. Somewhere between the channel mouth and the <span class=\"lx\" data-t=\"vacuole\">Vacuole<\/span>&#x27;s cysts, a share of <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>&#x27;s water had gone, <span class=\"lx\" data-t=\"beat\">Beat<\/span> after <span class=\"lx\" data-t=\"beat\">Beat<\/span>, without anyone hauling it.", "terms": ["henn", "tally-keeper", "vacuole", "tally", "sump-nine", "beat"]}, {"k": "p", "html": "&quot;Rationing at three-quarters,&quot; <span class=\"lx\" data-t=\"henn\">Henn<\/span> said. Her voice was steady and her body was not. &quot;Until the <span class=\"lx\" data-t=\"isotonic-fall\">Fall<\/span>. By order of the <span class=\"lx\" data-t=\"tally\">Tally<\/span>.&quot;", "terms": ["henn", "isotonic-fall", "tally"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"swollen\">Swollen<\/span> took it the way <span class=\"lx\" data-t=\"swollen\">the Swollen<\/span> always take it: quietly, and then not quietly. The <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> that night was full of the smell of anger, which in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span> smells like hot iron and old blood. <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> sat in the middle of it like a boulder in a current. &quot;Somebody,&quot; he said slowly, &quot;is drinking our water.&quot;", "terms": ["swollen", "hauler", "hearth", "the-osmotic-expanse", "dunmore"]}, {"k": "p", "html": "&quot;<span class=\"lx\" data-t=\"corvane\">Corvane<\/span>,&quot; said half the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>.", "terms": ["corvane", "hearth"]}, {"k": "p", "html": "&quot;Proof,&quot; said <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span>.", "terms": ["dunmore"]}, {"k": "p", "html": "There was no proof. There was a smell — <span class=\"lx\" data-t=\"dry\">the Dry<\/span> pockets on the high wall were full and fat in a season when they should have been merely comfortable — but a smell is a rumour, and a rumour is not a line. <i>Fresh<\/i>, a rumour like that is. It lives a <span class=\"lx\" data-t=\"beat\">Beat<\/span>. Anybody can disprove it. <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> disproved it the next morning by opening his pocket&#x27;s door to the <span class=\"lx\" data-t=\"muster\">Muster<\/span> and letting him count the cysts, and the count was exactly what <span class=\"lx\" data-t=\"corvane\">Corvane<\/span>&#x27;s household was owed, to the drop.", "terms": ["dry", "beat", "corvane", "muster"]}, {"k": "p", "html": "&quot;He&#x27;s moved it,&quot; said <span class=\"lx\" data-t=\"oro\">Oro<\/span>.", "terms": ["oro"]}, {"k": "p", "html": "&quot;Then find where,&quot; said <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>.", "terms": ["mesk"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "Here is the <span class=\"lx\" data-t=\"oath-duel\">duel<\/span>. Every <span class=\"lx\" data-t=\"salt-vigil\">Salt Vigil<\/span> tale has a <span class=\"lx\" data-t=\"oath-duel\">duel<\/span> in it. This one is true.", "terms": ["oath-duel", "salt-vigil"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"pump\">Pump<\/span>, by the old custom of the <span class=\"lx\" data-t=\"salt-vigil\">Vigil<\/span>, challenged the absent <span class=\"lx\" data-t=\"steward\">Steward<\/span>&#x27;s office for the water. Not <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> — <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> did not hold the office; he only wanted it. The challenge was to the <i>office<\/i>: the claim that the <span class=\"lx\" data-t=\"vacuole\">Vacuole<\/span>&#x27;s store, by the <span class=\"lx\" data-t=\"charter\">charter<\/span>, belonged to the households and not to the treasury, and that the shortage should come out of <span class=\"lx\" data-t=\"dry\">the Dry<\/span> pockets first. A <span class=\"lx\" data-t=\"motion\">Motion<\/span>, sworn as an <span class=\"lx\" data-t=\"oath\">Oath<\/span> by both sides in the open sump, the walls <span class=\"lx\" data-t=\"register\">registered<\/span> by the <span class=\"lx\" data-t=\"porter\">Porter<\/span> so that what happened between them would be law.", "terms": ["pump", "salt-vigil", "steward", "corvane", "vacuole", "charter", "dry", "motion", "oath", "register", "porter"]}, {"k": "p", "html": "Each side names a champion. The <span class=\"lx\" data-t=\"pump\">Pump<\/span> named <span class=\"lx\" data-t=\"grue\">Grue<\/span>.", "terms": ["pump", "grue"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"grue\">Grue<\/span> was the <span class=\"lx\" data-t=\"muster\">Muster<\/span> — <span class=\"lx\" data-t=\"barophil\">Barophil<\/span>, vast, slow, a thing more like a <span class=\"lx\" data-t=\"hab\">hab-hill<\/span> than an <span class=\"lx\" data-t=\"organism\">organism<\/span>, with skin like pressed slate and a voice that could hold the <span class=\"lx\" data-t=\"long-note\">long note<\/span> for a <span class=\"lx\" data-t=\"beat\">Beat<\/span> and a half. He was the colony&#x27;s militia-captain. He did not need to fight for <span class=\"lx\" data-t=\"pump\">the Pump<\/span>; it was not his office. He fought because he had been a <span class=\"lx\" data-t=\"hauler\">hauler<\/span> for six <span class=\"lx\" data-t=\"great-cycle\">Great Cycles<\/span> before he was the <span class=\"lx\" data-t=\"muster\">Muster<\/span>, and because <span class=\"lx\" data-t=\"sefa\">Sefa<\/span> had fed him in the <span class=\"lx\" data-t=\"nursery\">nursery<\/span> when he was a <span class=\"lx\" data-t=\"bud\">bud<\/span>.", "terms": ["grue", "muster", "barophil", "hab", "organism", "long-note", "beat", "pump", "hauler", "great-cycle", "sefa", "nursery", "bud"]}, {"k": "p", "html": "The office&#x27;s side named a champion too, because <span class=\"lx\" data-t=\"corvane\">Corvane<\/span> paid for one. She was a <span class=\"lx\" data-t=\"kinetic-striker\">Kinetic Striker<\/span> from upstream, a <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> mercenary with a wake like a blade, who arrived twice — once where you saw her, and once where she actually was. You know the kind. You&#x27;ve heard the rumour at the <span class=\"lx\" data-t=\"rendering\">Rendering<\/span> tables: <i>a <span class=\"lx\" data-t=\"kinetic-striker\">Kinetic Striker<\/span> killed an <span class=\"lx\" data-t=\"oath-duel\">Oath-duel<\/span> opponent by arriving twice.<\/i> It was her. Or it was her sister. They are always somebody&#x27;s sister.", "terms": ["corvane", "kinetic-striker", "flagellan", "rendering", "oath-duel"]}, {"k": "p", "html": "The whole of <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> came to watch — watching an <span class=\"lx\" data-t=\"oath-duel\">Oath-duel<\/span> is a legal act, interrupting it is a scandal, and killing either duellist outside the <span class=\"lx\" data-t=\"oath-duel\">duel<\/span>&#x27;s rules is a crime. They watched from the ladders, from the stalls, from the <span class=\"lx\" data-t=\"gel-moat\">gel moat<\/span> where the <span class=\"lx\" data-t=\"bud\">buds<\/span> were pressed against the <span class=\"lx\" data-t=\"nursery\">nursery<\/span> membrane like a cluster of eggs. I was one of them. I was not born yet; I was a thing inside a thing inside a thing. But I have the memory of it, and I will tell you how it went.", "terms": ["sump-nine", "oath-duel", "gel-moat", "bud", "nursery"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"kinetic-striker\">Striker<\/span> hit <span class=\"lx\" data-t=\"grue\">Grue<\/span> four times in the first <span class=\"lx\" data-t=\"pulse-cycle\">Cycle<\/span>. Kinetic blows, each one pushing him a <span class=\"lx\" data-t=\"drift\">Drift<\/span> backward across the sump, each one cracking a little more of the slate of him. <span class=\"lx\" data-t=\"grue\">Grue<\/span> did not move. <span class=\"lx\" data-t=\"barophil\">Barophils<\/span> do not move first; they are slow on the Frequency, it is their <span class=\"lx\" data-t=\"frailty\">Frailty<\/span>, they are always a heartbeat behind a fast room. He stood in the centre of the open sump and let the <span class=\"lx\" data-t=\"kinetic-striker\">Striker<\/span> break against him like water against a wall, and he sang.", "terms": ["kinetic-striker", "grue", "pulse-cycle", "drift", "barophil", "frailty"]}, {"k": "p", "html": "He sang the <span class=\"lx\" data-t=\"long-note\">long note<\/span>. Under it — through it — the <span class=\"lx\" data-t=\"kinetic-striker\">Striker<\/span> came round for the fifth time, the killing time, arriving twice, and <span class=\"lx\" data-t=\"grue\">Grue<\/span> <i>let her<\/i>. He let her first arrival hit him in the chest, and then, because he had been listening to the water all along, he put his great slow hand exactly where her second arrival was going to be.", "terms": ["long-note", "kinetic-striker", "grue"]}, {"k": "p", "html": "He caught her. Like catching a fish.", "terms": []}, {"k": "p", "html": "And she <span class=\"lx\" data-t=\"yield\">yielded<\/span>.", "terms": ["yield"]}, {"k": "p", "html": "You know the <span class=\"lx\" data-t=\"yield\">Yield<\/span>. A chemical white flag, flown with the whole body; an <span class=\"lx\" data-t=\"organism\">organism<\/span> that spends a whole <span class=\"lx\" data-t=\"pulse-cycle\">Cycle<\/span> signalling surrender, in a scent it cannot fake. And whoever kills a <span class=\"lx\" data-t=\"yield\">yielding<\/span> <span class=\"lx\" data-t=\"organism\">organism<\/span> — in war, in a <span class=\"lx\" data-t=\"oath-duel\">duel<\/span>, anywhere — marks every witness with <span class=\"lx\" data-t=\"stress\">Stress<\/span> and drops the <span class=\"lx\" data-t=\"cohesion\">Cohesion<\/span> of everyone who saw it. Killing a duellist in front of a whole colony is the most expensive thing you can do in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span>.", "terms": ["yield", "organism", "pulse-cycle", "oath-duel", "stress", "cohesion", "the-osmotic-expanse"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"grue\">Grue<\/span> held the <span class=\"lx\" data-t=\"kinetic-striker\">Striker<\/span> for a long breath with every <span class=\"lx\" data-t=\"organism\">organism<\/span> in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> watching. Then he opened his hand.", "terms": ["grue", "kinetic-striker", "organism", "sump-nine"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"motion\">Motion<\/span> passed. The office conceded: the shortage would come out of <span class=\"lx\" data-t=\"dry\">the Dry<\/span> pockets first. It was the right result, and the whole sump knew it, and it changed exactly nothing, because there was no <span class=\"lx\" data-t=\"steward\">Steward<\/span> to enforce it and no proof of where the water was going, and <span class=\"lx\" data-t=\"dry\">the Dry<\/span> pockets went on being full.", "terms": ["motion", "dry", "steward"]}, {"k": "p", "html": "That is the thing about a <span class=\"lx\" data-t=\"oath-duel\">duel<\/span>. A <span class=\"lx\" data-t=\"oath-duel\">duel<\/span> settles in one scene what a war would settle in a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> and a hundred dead. It does not settle whether the winner can collect.", "terms": ["oath-duel", "osmotic-tide"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "<span class=\"lx\" data-t=\"sefa\">Sefa<\/span> died at <span class=\"lx\" data-t=\"dim\">the dim<\/span>.", "terms": ["sefa", "dim"]}, {"k": "p", "html": "I am sorry to come at it so plainly. There is no other way to come at it. She was old, and she was <span class=\"lx\" data-t=\"swollen\">Swollen<\/span>, and the <span class=\"lx\" data-t=\"hypertonic-zenith\">Zenith<\/span> had been taking water out of her for half a <span class=\"lx\" data-t=\"drift-season\">Drift Season<\/span>, and she had given half her ration to the <span class=\"lx\" data-t=\"nursery\">nursery<\/span> because the <span class=\"lx\" data-t=\"charter\">charter<\/span> said every <span class=\"lx\" data-t=\"hab\">hab<\/span> feeds one <span class=\"lx\" data-t=\"nursery\">nursery<\/span> shift and she was too old to haul and <span class=\"lx\" data-t=\"nursery\">nursery<\/span> feed was what she had left to give. She had been coughing salt since the <span class=\"lx\" data-t=\"isotonic-rise\">Rise<\/span>. She coughed salt through the <span class=\"lx\" data-t=\"oath-duel\">duel<\/span>. She was sitting at the <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> listening to <span class=\"lx\" data-t=\"grue\">Grue<\/span>&#x27;s <span class=\"lx\" data-t=\"long-note\">long note<\/span> fade when her lashes stopped moving.", "terms": ["swollen", "hypertonic-zenith", "drift-season", "nursery", "charter", "hab", "isotonic-rise", "oath-duel", "hauler", "hearth", "grue", "long-note"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> was hauling. Of course he was. It was <span class=\"lx\" data-t=\"dim\">the dim<\/span>; the night pumps run in <span class=\"lx\" data-t=\"dim\">the dim<\/span>, and a <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span> has to move. <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> came for him. <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> swam the third ladder top to bottom, which an <span class=\"lx\" data-t=\"immunan\">Immunan<\/span> should not be able to do, to find him on the tow-line, and said, in the plain way they could not help: &quot;<span class=\"lx\" data-t=\"sefa\">Sefa<\/span> is dead. She died at the <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>. She wasn&#x27;t alone. <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> was with her. She didn&#x27;t hurt.&quot;", "terms": ["oro", "dim", "flagellan", "mesk", "immunan", "sefa", "hearth", "dunmore"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> stopped moving.", "terms": ["oro"]}, {"k": "p", "html": "He stopped for a long time. Long enough for <span class=\"lx\" data-t=\"obligate-drifter\">the ache<\/span> to come. Long enough for the grey nothing that comes after <span class=\"lx\" data-t=\"obligate-drifter\">the ache<\/span> — the thing he had always been afraid of — to start creeping in at the edges of his lashes. Long enough that <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>, who did not know what else to do, sat beside him on the tow-line in <span class=\"lx\" data-t=\"dim\">the dim<\/span> and breathed over him the only thing they had ever been given that was meant for this.", "terms": ["obligate-drifter", "mesk", "dim"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span>&#x27; lullaby. The <span class=\"lx\" data-t=\"plasmid\">plasmid<\/span> he had given them at the <span class=\"lx\" data-t=\"contract-fair\">Fair<\/span>.", "terms": ["seven-ladders", "plasmid", "contract-fair"]}, {"k": "p", "html": "It worked. <span class=\"lx\" data-t=\"plasmid\">Plasmids<\/span> are not magic; they are chemistry, and chemistry does not care whether you deserve it. <span class=\"lx\" data-t=\"oro\">Oro<\/span>&#x27;s body slowed, and steadied, and after a while it began, very slightly, to move again. He told me the first thing he felt was not grief. It was <i>being owed<\/i>. <span class=\"lx\" data-t=\"sefa\">Sefa<\/span> had fed him every <span class=\"lx\" data-t=\"beat\">Beat<\/span> of his life and he had never once paid her back.", "terms": ["plasmid", "oro", "sefa", "beat"]}, {"k": "p", "html": "&quot;She signed a <span class=\"lx\" data-t=\"digestion-pact\">Digestion Pact<\/span>,&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said quietly, when he could hear it. &quot;Last <span class=\"lx\" data-t=\"rendering\">Rendering<\/span>. <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> told me.&quot;", "terms": ["digestion-pact", "mesk", "rendering", "varrow"]}, {"k": "p", "html": "A <span class=\"lx\" data-t=\"digestion-pact\">Digestion Pact<\/span>. Do you know what that is, those of you from the soft regions? It is a mutualism, like <span class=\"lx\" data-t=\"incubation\">incubation<\/span>, like grooming — one of the twelve acts <span class=\"lx\" data-t=\"organism\">organisms<\/span> do for each other. You sign your body over to <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> <i>while you are still alive<\/i>. They pay you an advance, half of what your harvest will be worth, in <span class=\"lx\" data-t=\"substrate\">Substrate<\/span>, today. And when you die, your body is theirs to read and render, and they will enforce your unspent <span class=\"lx\" data-t=\"oath\">Oaths<\/span> whether you like it or not.", "terms": ["digestion-pact", "incubation", "organism", "reclaimers-ash", "substrate", "oath"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"sefa\">Sefa<\/span> had sold her own body to <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> a <span class=\"lx\" data-t=\"osmotic-tide\">Tide<\/span> ago. She had sold it for fifty <span class=\"lx\" data-t=\"substrate\">S<\/span>.", "terms": ["sefa", "reclaimers-ash", "osmotic-tide", "substrate"]}, {"k": "p", "html": "And she had paid fifty <span class=\"lx\" data-t=\"substrate\">S<\/span> into the <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span>&#x27; debt, against the principal, for the first time in two <span class=\"lx\" data-t=\"great-cycle\">Great Cycles<\/span>.", "terms": ["substrate", "seven-ladders", "great-cycle"]}, {"k": "p", "html": "&quot;She was paying it down,&quot; <span class=\"lx\" data-t=\"oro\">Oro<\/span> said. &quot;She was paying <i>my<\/i> share down.&quot;", "terms": ["oro"]}, {"k": "p", "html": "&quot;Yes,&quot; said <span class=\"lx\" data-t=\"mesk\">Mesk<\/span>.", "terms": ["mesk"]}, {"k": "p", "html": "&quot;I didn&#x27;t know.&quot;", "terms": []}, {"k": "p", "html": "&quot;She asked <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> not to tell you,&quot; <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> said. &quot;<span class=\"lx\" data-t=\"varrow\">Varrow<\/span> told me because I asked her directly.&quot; A flicker of cold <span class=\"lx\" data-t=\"immunan\">Immunan<\/span> humour, very small, the size of a grief. &quot;People should stop asking me things directly.&quot;", "terms": ["varrow", "mesk", "immunan"]}, {"k": "hr", "html": "", "terms": []}, {"k": "h2", "html": "V · THE RENDERING", "terms": []}, {"k": "h3", "html": "<i>Isotonic Fall<\/i>", "terms": []}, {"k": "q", "html": "<i>The <span class=\"lx\" data-t=\"reclaimers-ash\">Ash<\/span> read the dead because somebody must. A body that is not read is a story that is not told, and a story that is not told is a soul thrown in the water.<\/i><br>— the <span class=\"lx\" data-t=\"reclaimers-ash\">Reclaimers&#x27; Ash<\/span>, as they say it at every <span class=\"lx\" data-t=\"rendering\">Rendering<\/span>", "terms": ["reclaimers-ash", "rendering"]}, {"k": "p", "html": "Two <span class=\"lx\" data-t=\"beat\">Beats<\/span> of the <span class=\"lx\" data-t=\"rendering\">Rendering<\/span>, every <span class=\"lx\" data-t=\"isotonic-fall\">Isotonic Fall<\/span>. You are sitting in the second of them now. You know how it goes: the year&#x27;s dead brought to <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> Rows and hung in their husks, and the <span class=\"lx\" data-t=\"reader\">Readers<\/span> going among them one by one, opening their own bodies around the heads of the dead and reading the last of what they knew. A body&#x27;s last hours stay in it a long time, if nobody renders it first. The <span class=\"lx\" data-t=\"reclaimers-ash\">Ash<\/span> think a soul is mostly memory. They might be right.", "terms": ["beat", "rendering", "isotonic-fall", "reclaimers-ash", "reader"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"reader\">Reading<\/span> of an <span class=\"lx\" data-t=\"organism\">organism<\/span> is done at its own <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, in front of its kin. That is the law. So on the first <span class=\"lx\" data-t=\"beat\">Beat<\/span> of that <span class=\"lx\" data-t=\"rendering\">Rendering<\/span>, <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> came to the <span class=\"lx\" data-t=\"hauler\">haulers<\/span>&#x27; <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> with her crew and <span class=\"lx\" data-t=\"sefa\">Sefa<\/span>&#x27;s body in its husk, and every <span class=\"lx\" data-t=\"hauler\">hauler<\/span> in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> sat around the warm stone, and <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> sat at <span class=\"lx\" data-t=\"oro\">Oro<\/span>&#x27;s side, and the scout from the channel hung in her own husk on <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> shelf behind them all, still unrendered, still owed.", "terms": ["reader", "organism", "hearth", "beat", "rendering", "varrow", "hauler", "sefa", "sump-nine", "mesk", "oro", "reclaimers-ash"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"varrow\">Varrow<\/span> read <span class=\"lx\" data-t=\"sefa\">Sefa<\/span> for a long time.", "terms": ["varrow", "sefa"]}, {"k": "p", "html": "When she came out of it, she did not speak to the room. She spoke to <span class=\"lx\" data-t=\"oro\">Oro<\/span>. That was the second time she had done that, and both times it meant the same thing: <i>this is yours, and I am sorry<\/i>.", "terms": ["oro"]}, {"k": "p", "html": "&quot;She has a confession,&quot; <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> said, &quot;and she wants it heard by her <span class=\"lx\" data-t=\"ward\">ward<\/span>.&quot;", "terms": ["varrow", "ward"]}, {"k": "p", "html": "The <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> went cold.", "terms": ["hearth"]}, {"k": "p", "html": "&quot;She wants you to know,&quot; <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> said, very gently, in the voice <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> use to carry the words of the dead exactly, &quot;that you are not of her <span class=\"lx\" data-t=\"budline\">budline<\/span>. That you were <i>brought<\/i>. That twenty <span class=\"lx\" data-t=\"drift-season\">Drift Seasons<\/span> ago, at a <span class=\"lx\" data-t=\"rendering\">Rendering<\/span> very like this one, a <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> scout came down the <span class=\"lx\" data-t=\"fork-of-the-second-flow\">Fork of the Second Flow<\/span> from <span class=\"lx\" data-t=\"lysosomal-wastes\">the Wastes<\/span> with a <span class=\"lx\" data-t=\"bud\">bud<\/span> <i>inside her<\/i> — <span class=\"lx\" data-t=\"brooding\">brooded<\/span>, the way <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> carry seeds, the way a mother carries what she cannot leave behind. She had carried it across <span class=\"lx\" data-t=\"lysosomal-wastes\">the Wastes<\/span> because the colony it came from had been struck from every <span class=\"lx\" data-t=\"register\">register<\/span>. <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span>. The whole of it. A purge. And an <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span> <span class=\"lx\" data-t=\"bud\">bud<\/span> has no name, no line, no <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, no water, no right to exist inside any membrane in <span class=\"lx\" data-t=\"the-osmotic-expanse\">the Expanse<\/span>.&quot;", "terms": ["varrow", "reclaimers-ash", "budline", "drift-season", "rendering", "lysosan", "fork-of-the-second-flow", "lysosomal-wastes", "bud", "brooding", "register", "unlisted", "hearth", "the-osmotic-expanse"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"oro\">Oro<\/span> did not move. He told me later he had known since the channel. He told me that knowing a thing and hearing it said at your <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> are not the same thing at all.", "terms": ["oro", "hearth"]}, {"k": "p", "html": "&quot;The scout gave the <span class=\"lx\" data-t=\"bud\">bud<\/span> to <span class=\"lx\" data-t=\"sefa\">Sefa<\/span>,&quot; <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> said, &quot;and <span class=\"lx\" data-t=\"sefa\">Sefa<\/span> took it as her <span class=\"lx\" data-t=\"ward\">ward<\/span>. A <b><span class=\"lx\" data-t=\"ward\">Wardship<\/span><\/b>. A <span class=\"lx\" data-t=\"rite\">Rite<\/span> at a <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>; a line that cannot be transferred. And then <span class=\"lx\" data-t=\"sefa\">Sefa<\/span> went to the <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> of that day and asked her to write the <span class=\"lx\" data-t=\"bud\">bud<\/span> into the birth <span class=\"lx\" data-t=\"register\">register<\/span> as a <span class=\"lx\" data-t=\"seven-ladders\">Seven Ladders<\/span>. <span class=\"lx\" data-t=\"flagellan\">Flagellan<\/span>. Born in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span>. A forged line. The <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> did it, for a debt.&quot; <span class=\"lx\" data-t=\"varrow\">Varrow<\/span>&#x27;s voice did not change. &quot;The <span class=\"lx\" data-t=\"registrar\">Registrar<\/span> was <span class=\"lx\" data-t=\"quell\">Quell<\/span>.&quot;", "terms": ["bud", "sefa", "varrow", "ward", "rite", "hearth", "registrar", "register", "seven-ladders", "flagellan", "sump-nine", "quell"]}, {"k": "p", "html": "Every <span class=\"lx\" data-t=\"hauler\">hauler<\/span> at that <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> turned, slowly, to look at the door, where <span class=\"lx\" data-t=\"quell\">Quell<\/span> was standing — <span class=\"lx\" data-t=\"quell\">Quell<\/span> the <span class=\"lx\" data-t=\"unlisted\">Unlisted<\/span> <span class=\"lx\" data-t=\"registrar\">Registrar<\/span>, who had come to every <span class=\"lx\" data-t=\"reader\">Reading<\/span> at every <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> in <span class=\"lx\" data-t=\"sump-nine\">Sump Nine<\/span> for six <span class=\"lx\" data-t=\"osmotic-tide\">Tides<\/span>, because nobody had ever told her she couldn&#x27;t. She did not leave. She did not look away. She stood in the doorway and let the whole <span class=\"lx\" data-t=\"pump\">Pump<\/span> smell what she was.", "terms": ["hauler", "hearth", "quell", "unlisted", "registrar", "reader", "sump-nine", "osmotic-tide", "pump"]}, {"k": "p", "html": "&quot;<i>I owe her for it<\/i>,&quot; <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> said — <span class=\"lx\" data-t=\"sefa\">Sefa<\/span>&#x27;s words, in <span class=\"lx\" data-t=\"varrow\">Varrow<\/span>&#x27;s mouth. &quot;<i>I owe <span class=\"lx\" data-t=\"quell\">Quell<\/span> a debt I will not live to pay. I owe the <span class=\"lx\" data-t=\"brine-office\">Brine Office<\/span> a debt my <span class=\"lx\" data-t=\"budline\">budline<\/span> will not live to pay. I owe the child the truth, and that one I am paying now. <span class=\"lx\" data-t=\"oro\">Oro<\/span>. You were never mine. You were always mine. Both. I am sorry I made you a lie to keep you alive. I would do it again.<\/i>&quot;", "terms": ["varrow", "sefa", "quell", "brine-office", "budline", "oro"]}, {"k": "p", "html": "That was the end of the <span class=\"lx\" data-t=\"reader\">Reading<\/span>.", "terms": ["reader"]}, {"k": "p", "html": "<span class=\"lx\" data-t=\"sefa\">Sefa<\/span>&#x27;s body went to the <span class=\"lx\" data-t=\"rendering\">Rendering<\/span> ground in the morning, and was rendered properly, <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span>&#x27;s way, and every part of her that could feed something fed something, and her last memory went into a <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> that <span class=\"lx\" data-t=\"varrow\">Varrow<\/span> gave to <span class=\"lx\" data-t=\"oro\">Oro<\/span>, and that is the <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> I carry. I have it under my fin now. I will not play it for you. Some memories are <span class=\"lx\" data-t=\"hearth\">Hearth<\/span> memories, and this is not my <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>.", "terms": ["sefa", "rendering", "reclaimers-ash", "memory-strand", "varrow", "oro", "hearth"]}, {"k": "hr", "html": "", "terms": []}, {"k": "p", "html": "That night — <span class=\"lx\" data-t=\"dim\">the dim<\/span> between the two <span class=\"lx\" data-t=\"beat\">Beats<\/span> of the <span class=\"lx\" data-t=\"rendering\">Rendering<\/span>, five <span class=\"lx\" data-t=\"osmotic-tide\">Tides<\/span> ago — <span class=\"lx\" data-t=\"oro\">Oro<\/span> went to <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> shelf where the scout still hung, and <span class=\"lx\" data-t=\"mesk\">Mesk<\/span> went with him, and <span class=\"lx\" data-t=\"quell\">Quell<\/span>, and <span class=\"lx\" data-t=\"varrow\">Varrow<\/span>. And <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span>, because <span class=\"lx\" data-t=\"dunmore\">Dunmore<\/span> had been the one sitting with <span class=\"lx\" data-t=\"sefa\">Sefa<\/span>, and a <span class=\"lx\" data-t=\"barophil\">Barophil<\/span> who has started a thing finishes it.", "terms": ["dim", "beat", "rendering", "osmotic-tide", "oro", "reclaimers-ash", "mesk", "quell", "varrow", "dunmore", "sefa", "barophil"]}, {"k": "p", "html": "And <span class=\"lx\" data-t=\"oro\">Oro<\/span> opened the <span class=\"lx\" data-t=\"memory-strand\">strand<\/span>.", "terms": ["oro", "memory-strand"]}, {"k": "p", "html": "He did not need the old <span class=\"lx\" data-t=\"lysosan\">Lysosan<\/span> from the <span class=\"lx\" data-t=\"tallow-market\">Tallow Market<\/span>. He understood that now. The <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> had been made in a body that smelled like home, and he <i>was<\/i> home; he was the thing that had been <span class=\"lx\" data-t=\"brooding\">brooded<\/span>. It opened to him the moment he wanted it to. A <span class=\"lx\" data-t=\"brooding\">brooder&#x27;s<\/span> <span class=\"lx\" data-t=\"memory-strand\">strand<\/span> opens once. He knew that, too. He opened it anyway, in front of witnesses, at a <span class=\"lx\" data-t=\"hearth\">Hearth<\/span>, with <span class=\"lx\" data-t=\"reclaimers-ash\">the Ash<\/span> in the room. Where it could be heard properly.", "terms": ["lysosan", "tallow-market", "memory-strand", "brooding", "
