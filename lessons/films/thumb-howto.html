<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0}body{width:1280px;height:720px;overflow:hidden;position:relative;font-family:"TeX Gyre Adventor";background:#000}
.bg{position:absolute;inset:-20px;background:url(img/banner-world.png) center/cover;filter:saturate(1.5) brightness(.45) hue-rotate(140deg)}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 30% 50%,rgba(95,208,138,.45),transparent 45%),radial-gradient(circle at 85% 20%,rgba(255,60,60,.3),transparent 40%)}
.hit{position:absolute;left:40px;top:120px;width:590px;transform:rotate(-4deg);border-radius:26px;box-shadow:0 0 70px 14px rgba(95,208,138,.75),0 0 0 8px #fff}
.ring{position:absolute;left:262px;top:362px;width:120px;height:120px;border:12px solid #ff2b2b;border-radius:50%;box-shadow:0 0 25px rgba(255,0,0,.9)}
.arrow{position:absolute;left:350px;top:470px;width:200px;transform:rotate(40deg)}
.t{position:absolute;right:40px;text-align:right;font-weight:700;line-height:.92;-webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 8px 0 #000,0 0 40px rgba(0,0,0,.8)}
.t1{top:60px;font-size:84px;color:#fff}.t2{top:150px;font-size:118px;color:#ffe23d}.t3{top:285px;font-size:84px;color:#fff}.t4{top:375px;font-size:118px;color:#ff4d4d}
.leak{position:absolute;left:60px;top:44px;background:#ffe23d;color:#000;font-weight:700;font-size:30px;padding:8px 18px;border-radius:50px;transform:rotate(-6deg);border:4px solid #000}
.badge{position:absolute;right:44px;bottom:44px;background:#ff2b2b;color:#fff;font-weight:700;font-size:40px;padding:10px 24px;border-radius:14px;transform:rotate(-3deg);border:5px solid #fff;box-shadow:0 6px 0 #000}
</style></head><body>
<div class="bg"></div><div class="glow"></div>
<img class="hit" src="img/crop-hit.png"><div class="ring"></div>
<svg class="arrow" viewBox="0 0 260 120"><path d="M250 60 L60 60" stroke="#000" stroke-width="40" stroke-linecap="round"/><path d="M250 60 L60 60" stroke="#ff2b2b" stroke-width="26" stroke-linecap="round"/><path d="M10 60 L90 8 L90 112 Z" fill="#ff2b2b" stroke="#000" stroke-width="8" stroke-linejoin="round"/></svg>
<div class="leak">THE ONE RULE</div>
<div class="t t1">MORE DICE</div><div class="t t2">= MORE</div><div class="t t4" style="top:290px;font-size:150px">TROUBLE?!</div>
<div class="badge">HOW TO PLAY · THE OSMOTIC EXPANSE</div>
</body></html>
