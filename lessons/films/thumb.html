<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0}body{width:1280px;height:720px;overflow:hidden;position:relative;font-family:"TeX Gyre Adventor";background:#000}
.bg{position:absolute;inset:-20px;background:url(img/banner-world.png) center/cover;filter:saturate(1.6) contrast(1.15) brightness(.55) hue-rotate(-15deg)}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 26% 55%,rgba(94,230,208,.45),transparent 45%),radial-gradient(circle at 80% 10%,rgba(224,69,123,.35),transparent 40%)}
.card{position:absolute;left:70px;top:70px;height:560px;transform:rotate(-6deg);border-radius:22px;box-shadow:0 0 60px 10px rgba(94,230,208,.8),0 0 0 8px #fff}
.ring{position:absolute;left:30px;top:150px;width:390px;height:390px;border:14px solid #ff2b2b;border-radius:50%;transform:rotate(-12deg);box-shadow:0 0 25px rgba(255,0,0,.8)}
.t{position:absolute;right:46px;text-align:right;font-weight:700;line-height:.92;letter-spacing:1px;-webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 8px 0 #000,0 0 40px rgba(0,0,0,.8)}
.t1{top:60px;font-size:92px;color:#fff}
.t2{top:160px;font-size:150px;color:#ffe23d}
.t3{top:330px;font-size:84px;color:#fff}
.t4{top:420px;font-size:84px;color:#5ee6d0}
.arrow{position:absolute;left:400px;top:430px;width:260px;transform:rotate(-24deg)}
.badge{position:absolute;right:50px;bottom:48px;background:#ff2b2b;color:#fff;font-weight:700;font-size:44px;padding:10px 26px;border-radius:14px;transform:rotate(-3deg);border:5px solid #fff;box-shadow:0 6px 0 #000}
.leak{position:absolute;left:300px;top:40px;background:#ffe23d;color:#000;font-weight:700;font-size:30px;padding:8px 18px;border-radius:50px;transform:rotate(8deg);border:4px solid #000}
</style></head><body>
<div class="bg"></div><div class="glow"></div>
<img class="card" src="img/m-gnaw-swarm.png">
<div class="ring"></div>
<div class="leak">IT WANTS YOUR WATER</div>
<svg class="arrow" viewBox="0 0 260 120"><path d="M250 60 L60 60" stroke="#000" stroke-width="40" stroke-linecap="round"/><path d="M250 60 L60 60" stroke="#ff2b2b" stroke-width="26" stroke-linecap="round"/><path d="M10 60 L90 8 L90 112 Z" fill="#ff2b2b" stroke="#000" stroke-width="8" stroke-linejoin="round"/></svg>
<div class="t t1">YOU ARE</div>
<div class="t t2">TINY</div>
<div class="t t3">…AND YOU'RE</div>
<div class="t t4">INSIDE IT?!</div>
<div class="badge">THE OSMOTIC EXPANSE</div>
</body></html>
