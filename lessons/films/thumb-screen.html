<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0}body{width:1280px;height:720px;overflow:hidden;position:relative;font-family:"TeX Gyre Adventor";background:#000}
.bg{position:absolute;inset:-20px;background:url(img/banner-world.png) center/cover;filter:saturate(1.6) brightness(.5)}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 24% 50%,rgba(122,162,247,.55),transparent 45%)}
.phone{position:absolute;left:110px;top:30px;width:330px;height:690px;border-radius:46px;background:#0b0f14;padding:14px;box-sizing:border-box;transform:rotate(-7deg);box-shadow:0 0 70px 12px rgba(122,162,247,.8),0 0 0 6px #fff}
.phone div{width:100%;height:100%;border-radius:34px;background:url(img/ui-08.png) top/100% auto no-repeat}
.ring{position:absolute;left:112px;top:232px;width:200px;height:72px;border:12px solid #ff2b2b;border-radius:60px;transform:rotate(-7deg);box-shadow:0 0 25px rgba(255,0,0,.9)}
.arrow{position:absolute;left:300px;top:228px;width:200px;transform:rotate(-12deg)}
.t{position:absolute;right:44px;text-align:right;font-weight:700;line-height:.92;-webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 8px 0 #000,0 0 40px rgba(0,0,0,.8)}
.t1{top:70px;font-size:96px;color:#fff}.t2{top:170px;font-size:150px;color:#ffe23d}.t3{top:350px;font-size:76px;color:#fff}.t4{top:432px;font-size:76px;color:#7aa2f7}
.leak{position:absolute;left:470px;top:38px;background:#ffe23d;color:#000;font-weight:700;font-size:28px;padding:8px 18px;border-radius:50px;transform:rotate(5deg);border:4px solid #000}
.badge{position:absolute;right:44px;bottom:44px;background:#ff2b2b;color:#fff;font-weight:700;font-size:38px;padding:10px 24px;border-radius:14px;transform:rotate(-3deg);border:5px solid #fff;box-shadow:0 6px 0 #000}
</style></head><body>
<div class="bg"></div><div class="glow"></div>
<div class="phone"><div></div></div><div class="ring"></div>
<svg class="arrow" viewBox="0 0 260 120"><path d="M250 60 L60 60" stroke="#000" stroke-width="40" stroke-linecap="round"/><path d="M250 60 L60 60" stroke="#ff2b2b" stroke-width="26" stroke-linecap="round"/><path d="M10 60 L90 8 L90 112 Z" fill="#ff2b2b" stroke="#000" stroke-width="8" stroke-linejoin="round"/></svg>
<div class="leak">PLAY FROM YOUR PHONE</div>
<div class="t t1">ZERO</div><div class="t t2">MATHS.</div><div class="t t3">JUST SAY WHAT</div><div class="t t4">YOU DO.</div>
<div class="badge">THE PLAYER SCREEN · OSMOTIC EXPANSE</div>
</body></html>
