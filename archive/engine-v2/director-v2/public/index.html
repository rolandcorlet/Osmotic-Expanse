<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Osmotic Expanse</title>
<style>
:root{--bg:#0d1417;--panel:#142026;--panel2:#1a2a31;--line:#28404a;--ink:#e6f0ee;--dim:#9db3b1;--faint:#6b8482;--accent:#5fd3bc;--ok:#7ed98a;--no:#ef7d6e;--warn-c:#e8c15a;--input:#0f1a1e;--btn:#21353e}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.02em}header .site{color:var(--accent);font-weight:600}header .sp{flex:1}
.tabs{display:flex;gap:4px}.tabs button{background:none;border:1px solid transparent;color:var(--dim);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--panel2);border-color:var(--line);color:var(--ink)}
main{flex:1;min-height:0;padding:12px 16px}.tab{height:100%}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);gap:12px;height:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:0}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:0 0 8px;font-weight:650}
#story{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.e{padding:8px 10px;border-radius:10px;max-width:92%}.e.director{background:var(--panel2);border:1px solid var(--line)}
.e.ask{color:var(--accent);font-weight:600;padding:2px 10px}.e.player{align-self:flex-end;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.e.player b{color:var(--accent);font-weight:600;margin-right:6px}.e.roll{font-variant-numeric:tabular-nums;color:var(--warn-c);padding:2px 10px;font-size:13.5px}.e.engine{color:var(--faint);font-size:13px;padding:0 10px}
.busy{color:var(--dim);font-style:italic;padding:2px 10px}
.say{display:flex;gap:8px;margin-top:10px}input,select{background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;min-width:0}
.say input{flex:1}button.b{background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;text-align:left}
button.b:hover{border-color:var(--accent)}button.b.go{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:650}button.b:disabled{opacity:.5;cursor:default}
.turn{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);font-weight:600}
.turn.wait{background:var(--panel2);border-color:var(--line);color:var(--dim);font-weight:500}
.moves{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}.moves .grp{color:var(--faint);font-size:12px;margin-top:4px}
.moves button{display:flex;justify-content:space-between;gap:10px;width:100%}.moves .cost{color:var(--dim);font-size:12.5px;white-space:nowrap}
.clocks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}.clock{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.clock .id{font-size:11px;letter-spacing:.08em;color:var(--faint)}.pips{display:flex;justify-content:center;gap:4px;margin:6px 0 2px}.pip{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}.pip.f{background:var(--warn-c);border-color:var(--warn-c)}
.clock .w{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}.row{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:8px;background:var(--panel2)}
.row .s{color:var(--dim);font-size:13px;text-align:right}.mine{outline:1px solid color-mix(in srgb,var(--accent) 50%,transparent)}.row.turnrow b{color:var(--accent)}
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;height:100%;overflow:auto;align-content:start}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.tile{background:var(--panel2);border-radius:8px;padding:6px;text-align:center}.tile .l{font-size:11px;color:var(--faint)}.tile .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld .fl{font-size:12px;color:var(--dim)}
.center{height:100%;display:grid;place-items:center}.join{width:min(420px,92vw)}
.err{color:var(--no);min-height:1.3em;font-size:13.5px}.ok{color:var(--ok)}.mono{font-family:ui-monospace,Consolas,monospace}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.sw{display:flex;align-items:center;gap:8px}.sw input{padding:0;width:42px;height:30px}
.hostgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;height:100%;overflow:auto;align-content:start}
@media (max-width:1050px){body{overflow:auto}.grid,.hostgrid{grid-template-columns:1fr;height:auto}#story{max-height:55vh}.tab{height:auto}}
@media (max-height:800px) and (min-width:1051px){header{padding:5px 14px}.card{padding:9px}main{padding:8px 12px}}
</style></head><body>
<header><h1>The Osmotic Expanse</h1><span class="site" id="hsite"></span><span class="sp"></span>
<nav class="tabs" id="tabs" hidden><button data-t="table" class="on">Table</button><button data-t="cohort">Cohort</button><button data-t="host" id="thost" hidden>Host</button><button data-t="colours">Colours</button></nav></header>
<main>
<section id="join" class="center"><div class="card join"><h2>Sit down at the table</h2>
<p id="premise" style="color:var(--dim);margin-top:0"></p>
<label class="fld"><span class="fl">Your name</span><input id="jname" maxlength="24" autocomplete="nickname"></label>
<label class="fld"><span class="fl">Table code (ask the host)</span><input id="jcode" class="mono" maxlength="6" autocapitalize="characters" autocomplete="off"></label>
<button class="b go" id="jgo">Join</button><div class="err" id="jerr"></div></div></section>

<section id="t-table" class="tab" hidden><div class="grid">
 <div class="card col"><h2>The story</h2><div id="story" data-keep="story"></div><div class="busy" id="busy" hidden></div>
  <form class="say" id="sayf"><input id="say" maxlength="400" placeholder="Say or ask anything in your own words…" autocomplete="off"><button class="b go">Say</button></form><div class="err" id="serr"></div></div>
 <div class="col">
  <div class="card"><div class="turn wait" id="turn"></div></div>
  <div class="card col" style="flex:1.3"><h2>What you can do</h2><div class="moves" id="moves" data-keep="moves"></div></div>
  <div class="card"><h2>Clocks</h2><div class="clocks" id="clocks"></div></div>
  <div class="card col" style="flex:1"><h2>In the water</h2><div class="list" id="cre" data-keep="cre"></div></div>
 </div></div></section>

<section id="t-cohort" class="tab" hidden><div class="sheets" id="sheets"></div></section>

<section id="t-host" class="tab" hidden><div class="hostgrid">
 <div class="card"><h2>Getting players in</h2><div id="hinfo"></div></div>
 <div class="card"><h2>The Director's voice</h2>
  <label class="fld"><span class="fl">Model provider</span><select id="hprov"></select></label>
  <label class="fld" id="furl"><span class="fl">Address</span><input id="hurl" placeholder="http://localhost:8080/v1"></label>
  <label class="fld"><span class="fl">Model name</span><input id="hmodel"></label>
  <label class="fld" id="fkey"><span class="fl">API key (kept in saves/config.json on this PC only)</span><input id="hkey" type="password" autocomplete="off"></label>
  <label class="fld"><span class="fl">Thinking (local models)</span><select id="hthink"><option>off</option><option>low</option><option>medium</option><option>default</option></select></label>
  <label class="fld"><span class="fl">When the model speaks</span><select id="hnarr"><option value="all">Every move</option><option value="beats">Key moments only (faster)</option><option value="off">Never (Engine lines)</option></select></label>
  <button class="b go" id="hsave">Save voice</button> <span class="err" id="herr"></span><div id="hstats" style="color:var(--dim);margin-top:10px;font-size:13.5px"></div></div>
 <div class="card"><h2>The game</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b" id="hundo">Take back the last move</button><button class="b" id="hnew">New game</button><button class="b" id="hcode">New table code</button></div>
  <p style="color:var(--dim);font-size:13.5px">As host you can press any organism's buttons on the Table tab, so an empty seat never stalls the game.</p></div>
 <div class="card"><h2>Seats</h2><div class="list" id="hseats"></div></div>
</div></section>

<section id="t-colours" class="tab" hidden><div class="card" style="max-width:760px"><h2>Colours</h2><div class="cols" id="cols"></div><p><button class="b" id="creset">Back to the defaults</button></p></div></section>
</main>
<script>
const $=(id)=>document.getElementById(id);const esc=(s)=>String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// The host key arrives once in the link, is kept for this browser tab, and is taken out of the address bar.
const qs=new URLSearchParams(location.search);if(qs.get('key')){sessionStorage.setItem('oe2.host',qs.get('key'));history.replaceState(null,'','/host');}
const hostKey=sessionStorage.getItem('oe2.host')||'';let token=hostKey||localStorage.getItem('oe2.token')||'';let V=null,tab='table',es=null,hinfo=null;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||('Error '+r.status));e.status=r.status;throw e;}return j;}
// ---- colours ----
const VARS=[['--bg','Background'],['--panel','Panels'],['--panel2','Inner panels'],['--line','Lines'],['--ink','Text'],['--dim','Dim text'],['--faint','Faint text'],['--accent','Accent'],['--ok','Good'],['--no','Bad'],['--warn-c','Warning'],['--input','Fields'],['--btn','Buttons']];
const DEF=Object.fromEntries(VARS.map(([v])=>[v,getComputedStyle(document.documentElement).getPropertyValue(v).trim()]));
function loadCols(){let c={};try{c=JSON.parse(localStorage.getItem('oe2.colours')||'{}')}catch(e){}for(const [v] of VARS)document.documentElement.style.setProperty(v,c[v]||DEF[v]);
 $('cols').innerHTML=VARS.map(([v,l])=>`<label class="sw"><input type="color" data-v="${v}" value="${c[v]||DEF[v]}"><span>${l}</span></label>`).join('');}
$('cols').addEventListener('input',(e)=>{const v=e.target.dataset.v;if(!v)return;document.documentElement.style.setProperty(v,e.target.value);let c={};try{c=JSON.parse(localStorage.getItem('oe2.colours')||'{}')}catch(x){}c[v]=e.target.value;localStorage.setItem('oe2.colours',JSON.stringify(c));});
$('creset').onclick=()=>{localStorage.removeItem('oe2.colours');loadCols();};loadCols();
// ---- tabs ----
function showTab(t){tab=t;for(const b of $('tabs').children)b.classList.toggle('on',b.dataset.t===t);for(const s of ['table','cohort','host','colours'])$('t-'+s).hidden=s!==t;if(t==='host')loadHost();}
$('tabs').onclick=(e)=>{if(e.target.dataset.t)showTab(e.target.dataset.t);};
// ---- joining ----
fetch('/api/hello').then((r)=>r.json()).then((j)=>{$('premise').textContent=j.premise;document.title=j.title+' · The Osmotic Expanse';});
$('jname').value=localStorage.getItem('oe2.name')||'';
$('jgo').onclick=async()=>{$('jerr').textContent='';try{const j=await api('/api/join',{code:$('jcode').value,name:$('jname').value});token=j.token;localStorage.setItem('oe2.token',token);localStorage.setItem('oe2.name',$('jname').value);start();}catch(e){$('jerr').textContent=e.message;}};
$('jcode').addEventListener('keydown',(e)=>{if(e.key==='Enter')$('jgo').click();});
// ---- live ----
async function refresh(){try{V=await api('/api/state');render();}catch(e){if(e.status===401||e.status===403){if(es)es.close();es=null;if(!hostKey){localStorage.removeItem('oe2.token');token='';}$('join').hidden=false;$('tabs').hidden=true;for(const s of ['table','cohort','host','colours'])$('t-'+s).hidden=true;$('jerr').textContent=hostKey?e.message:'';}}}
function start(){$('join').hidden=true;$('tabs').hidden=false;showTab(tab);refresh();if(es)es.close();es=new EventSource('/api/events?token='+encodeURIComponent(token));es.onmessage=()=>refresh();es.onerror=()=>{};}
setInterval(()=>{if(token&&V)refresh();},15000);
function keep(fn){const pos={};document.querySelectorAll('[data-keep]').forEach((el)=>{pos[el.dataset.keep]={top:el.scrollTop,end:el.scrollHeight-el.scrollTop-el.clientHeight<40};});fn();document.querySelectorAll('[data-keep]').forEach((el)=>{const p=pos[el.dataset.keep];if(!p)return;el.scrollTop=el.dataset.keep==='story'&&p.end?el.scrollHeight:p.top;});}
function render(){if(!V)return;$('thost').hidden=!V.host;$('hsite').textContent=V.site?V.site.name:V.title;
 keep(()=>{
 $('story').innerHTML=V.story.map((e)=>`<div class="e ${esc(e.kind)}">${e.kind==='player'?`<b>${esc(e.who)}</b>`:''}${esc(e.text)}</div>`).join('')||'<div class="e engine">Nothing has happened yet. Take an organism on the Cohort tab, then begin.</div>';
 $('busy').hidden=!V.busy;$('busy').textContent=V.busy?V.busy+'…':'';
 const mine=V.me?V.me.orgIds:[];const t=$('turn');
 if(V.ended){t.className='turn';t.textContent='The module has ended: '+V.ended.replace(/-/g,' ')+'.';}
 else if(V.turn){const me=mine.includes(V.turn.org);t.className='turn'+(me?'':' wait');t.textContent=me?`Your turn: ${V.turn.name}`:`${V.turn.name}'s turn${V.turn.player?` (${V.turn.player})`:V.turn.open?' (open seat: anyone may play it)':''}`;}
 else{t.className='turn wait';t.textContent=!V.me&&!V.host?'':mine.length||V.host?({opening:'Ready to begin',explore:'Exploring: anyone may act',chase:'The race is on',reaction:'Something is coming',fight:'The creatures are moving'}[V.phase]||''):'Take an organism on the Cohort tab to play';}
 const groups={};for(const m of V.moves)(groups[m.whoName||'The Cohort']??=[]).push(m);
 $('moves').innerHTML=Object.entries(groups).map(([g,ms])=>`<div class="grp">${esc(g)}</div>`+ms.map((m)=>`<button class="b" data-m="${esc(m.id)}"><span>${esc(m.label)}</span><span class="cost">${esc(m.cost)}</span></button>`).join('')).join('')||'<div class="e engine">Nothing for you to press right now.</div>';
 $('clocks').innerHTML=V.clocks.map((c)=>`<div class="clock" title="${esc(c.word)}"><div class="id">${esc(c.id)}</div><div class="pips">${Array.from({length:c.max},(_,i)=>`<span class="pip${i<c.n?' f':''}"></span>`).join('')}</div><div class="w">${esc(c.word.replace(/^.*?of \d+,?\s*/,''))||'&nbsp;'}</div></div>`).join('');
 $('cre').innerHTML=V.creatures.map((c)=>`<div class="row"><b>${esc(c.name)}</b><span class="s">${esc(c.state)} · ${esc(c.band)}<br>${esc(c.look)}${c.cut?' · cut':''}</span></div>`).join('')||'<div class="e engine">Nothing but the current.</div>';
 if(!(document.activeElement&&document.activeElement.dataset.called))$('sheets').innerHTML=V.cohort.map((o)=>`<div class="card${o.mine?' mine':''}"><h2>${esc(o.phenotype)}${o.onTurn?' · on turn':''}</h2><div style="font-size:17px;font-weight:650">${esc(o.name)}</div><div style="color:var(--dim)">${esc(o.body)}, ${esc(o.nerve)}${o.state!=='up'?' · '+esc(o.state):''}${o.conditions.length?' · '+esc(o.conditions.join(', ')):''}</div>
  <div class="tiles"><div class="tile"><div class="l">Membrane</div><div class="v">${o.mi}/${o.miMax}</div></div><div class="tile"><div class="l">Stress</div><div class="v">${o.stress}</div></div><div class="tile"><div class="l">Pulse</div><div class="v">${o.pp}/${o.ppMax}</div></div><div class="tile"><div class="l">ATP</div><div class="v">${o.atp}/${o.atpMax}</div></div>
  <div class="tile"><div class="l">Lysis</div><div class="v">${o.countdown}/${o.countdownMax}</div></div><div class="tile"><div class="l">Substrate</div><div class="v">${o.substrate}</div></div><div class="tile"><div class="l">Codon</div><div class="v">${o.codon}</div></div><div class="tile"><div class="l">Cut</div><div class="v">${o.spec.C+o.spec.G+o.spec.P+o.spec.T}</div></div></div>
  <div style="color:var(--dim);font-size:13.5px;margin-bottom:8px">${esc(o.weapon)}${o.reserve?' · holding a Reserve':''} · Specimens C${o.spec.C} G${o.spec.G} P${o.spec.P} T${o.spec.T}</div>
  ${o.mine?`<button class="b" data-rel="${esc(o.id)}">Give up this organism</button>`:o.player?`<span style="color:var(--dim)">Played by ${esc(o.player)}</span>`:V.me?`<div style="display:flex;gap:6px"><input data-called="${esc(o.id)}" maxlength="28" placeholder="Name it (optional)" style="flex:1"><button class="b go" data-claim="${esc(o.id)}">Play</button></div>`:'<span style="color:var(--dim)">Open seat</span>'}</div>`).join('');
 if(V.host&&V.hostInfo){const h=V.hostInfo;$('hseats').innerHTML=V.seats.map((s)=>`<div class="row"><span><b>${esc(s.name)}</b> <span class="s">${s.here?'here':'away'}${s.orgs.length?' · '+esc(s.orgs.join(', ')):''}</span></span><button class="b" data-kick="${esc(s.id)}">Remove</button></div>`).join('')||'<div class="e engine">Nobody has joined yet.</div>';
  const st=h.stats;$('hstats').innerHTML=`Now: <b>${esc(h.model)}</b>. ${st.calls?`${st.calls} calls, ${(st.ms/st.calls/1000).toFixed(1)} s each, about ${Math.round(st.in/st.calls)} tokens in and ${Math.round(st.out/st.calls)} out per call; ${st.fallbacks} time(s) the Engine spoke instead.`:'No model calls yet.'}${st.error?`<br><span style="color:var(--warn-c)">Last fallback: ${esc(st.error)}</span>`:''}`;
  if(document.activeElement!==$('hnarr'))$('hnarr').value=h.narrate;$('hundo').disabled=!h.canUndo;renderHostInfo();}
 });}
async function act(fn,errEl){try{if(errEl)errEl.textContent='';await fn();}catch(e){if(errEl)errEl.textContent=e.message;else alertLine(e.message);}}
function alertLine(m){$('serr').textContent=m;setTimeout(()=>{if($('serr').textContent===m)$('serr').textContent='';},4000);}
$('moves').onclick=(e)=>{const b=e.target.closest('[data-m]');if(b){b.disabled=true;act(()=>api('/api/move',{id:b.dataset.m}));}};
$('sayf').onsubmit=(e)=>{e.preventDefault();const t=$('say').value.trim();if(!t)return;$('say').value='';act(()=>api('/api/say',{text:t}),$('serr'));};
$('sheets').onclick=(e)=>{const c=e.target.dataset.claim,r=e.target.dataset.rel;if(c){const n=document.querySelector(`[data-called="${c}"]`);act(()=>api('/api/claim',{org:c,called:n?n.value:''}));}if(r)act(()=>api('/api/release',{org:r}));};
// ---- host ----
const H=(action,extra)=>api('/api/host',{action,...extra});
async function loadHost(){if(!V||!V.host)return;try{hinfo=await H('info');const c=hinfo.config;$('hprov').innerHTML=hinfo.providers.map((p)=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('hprov').value=c.provider;$('hmodel').value=c.model;$('hurl').value=c.url;$('hthink').value=c.thinking;$('hkey').placeholder=c.hasKey?'(a key is saved)':'';provFields();renderHostInfo();if(hinfo.note)$('herr').textContent=hinfo.note;}catch(e){$('herr').textContent=e.message;}}
function provFields(){const p=hinfo.providers.find((x)=>x.id===$('hprov').value)||{};$('furl').hidden=!p.url;$('fkey').hidden=!p.key;if(p.url&&!$('hurl').value)$('hurl').placeholder=p.base;}
$('hprov').onchange=provFields;
function renderHostInfo(){if(!hinfo||!V||!V.hostInfo)return;const a=hinfo.addresses[0]||'this PC';$('hinfo').innerHTML=`<div class="tiles" style="grid-template-columns:1fr 1fr"><div class="tile"><div class="l">Table code</div><div class="v mono">${esc(V.hostInfo.code)}</div></div><div class="tile"><div class="l">Port</div><div class="v mono">${hinfo.port}</div></div></div>
 <p style="margin:6px 0"><b>On your home network:</b><br>${hinfo.addresses.map((x)=>`<span class="mono">http://${esc(x)}:${hinfo.port}</span>`).join('<br>')||'no network address found'}</p>
 <p style="margin:6px 0"><b>Over the internet:</b> <span class="mono">http://&lt;your public IP&gt;:${hinfo.port}</span><br><span style="color:var(--dim);font-size:13.5px">On the router at <span class="mono">192.168.0.1</span>, forward TCP port <span class="mono">${hinfo.port}</span> to <span class="mono">${esc(a)}</span> port <span class="mono">${hinfo.port}</span>. Players need only the address and the table code. This host page stays on your home network.</span></p>`;}
$('hsave').onclick=()=>act(async()=>{await H('config',{provider:$('hprov').value,model:$('hmodel').value,url:$('hurl').value,apiKey:$('hkey').value,thinking:$('hthink').value});await H('narrate',{mode:$('hnarr').value});$('hkey').value='';$('herr').className='ok';$('herr').textContent='Saved.';setTimeout(()=>{$('herr').className='err';$('herr').textContent='';},2500);loadHost();},$('herr'));
